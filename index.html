  /* ---------- Profile (a page, laid out like the Admin page) ---------- */
  /* ================================================================ */
  /* Notifications: inbox (stored on the server) + Web Push on this device */
  /* ================================================================ */
  // Push needs the GitHub Pages build (service worker on our own origin) and, on iPhone, the home-screen app.
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushCapable = () => !!(window.PAL_API_URL && window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
  let swReg = null;
  function setBadge() {
    try { if (navigator.setAppBadge) { if (S.unread) navigator.setAppBadge(S.unread); else navigator.clearAppBadge(); } } catch (e) { /* not supported */ }
  }
  async function initPush() {
    if (window.PAL_API_URL && window.isSecureContext && 'serviceWorker' in navigator) {
      try { swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) { swReg = null; }
      navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'open') openLink(ev.data.url); });
    }
    await refreshPushState();
  }
  async function refreshPushState() {
    let st;
    if (!window.PAL_API_URL) st = 'google';
    else if (isIOS() && !isStandalone()) st = 'install';
    else if (!pushCapable() || !swReg) st = 'unsupported';
    else if (Notification.permission === 'denied') st = 'denied';
    else {
      let sub = null; try { sub = await swReg.pushManager.getSubscription(); } catch (e) { sub = null; }
      st = sub && Notification.permission === 'granted' ? 'on' : 'off';
    }
    S.pushState = st; redrawNotes();
  }
  /** Links from notifications: #req=<id> opens that request, #notes opens Profile. */
  function openLink(url) {
    const h = String(url || '').split('#')[1] || '';
    if (/^req=/.test(h)) { const id = decodeURIComponent(h.slice(4)); if (S.requests.some(r => r.id === id)) openRequest(id); else toast('That request no longer exists'); }
    else if (h === 'notes') { S.view = 'profile'; render(); }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }
  async function loadNotes() {
    if (S.notesLoading || !S.token) return;

  function ago(ts) {
    const s = (Date.now() - new Date(ts).getTime()) / 1000;
    if (!(s >= 0)) return '';
    if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h';
    if (s < 7 * 86400) return Math.floor(s / 86400) + 'd';

  /* ---------- Request detail ---------- */
  /* ---------- Approval conflict calendar ---------- */
  /** Per day of r: who else of the same position is out (approved/pending), whether the daily max is exceeded,
   *  and any of the member's own overlapping requests (duplicates). */
  function reqConflicts(r) {
    const u = userOf(r.userId), q = quota(u.role), out = new Map();
    for (let d = r.start; d <= r.end; d = D.add(d, 1)) {
      const others = IDX.live.filter(x => x.id !== r.id && x.status !== 'Denied' && x.start <= d && x.end >= d);
      // Only leave uses a slot: a pass is never over the max, and only other members' leave counts against it.
      const peers = r.type === 'Leave' ? others.filter(x => x.type === 'Leave' && x.userId !== r.userId && userOf(x.userId).role === u.role).sort(byLast) : [];
      const dups = others.filter(x => x.userId === r.userId);
      const over = r.type === 'Leave' && !!q && peers.length + 1 > q;
      out.set(d, { peers, dups, over, bad: over || dups.length > 0, q, role: u.role });
    }
    return out;
  }
  function conflictText(d, c) {
    const day = D.f(d, { weekday: 'short', month: 'short', day: 'numeric' });
    if (!c.bad) return day + ': no conflict' + (c.peers.length ? ' (' + (c.peers.length + 1) + (c.q ? ' of ' + c.q : '') + ' ' + ROLE_PLURAL[c.role] + ' out)' : '') + '.';
    const parts = [];
    if (c.over) parts.push('over the ' + ROLE_PLURAL[c.role] + ' max (' + (c.peers.length + 1) + ' of ' + c.q + ') with ' +
      c.peers.map(x => fullName(userOf(x.userId)) + ' – ' + x.type.toLowerCase() + ', ' + x.status.toLowerCase()).join('; '));
    if (c.dups.length) parts.push('duplicate of own ' + c.dups.map(x => x.type.toLowerCase() + ' ' + D.short(x.start) + '–' + D.short(x.end)).join(', '));
    return day + ': conflicts — ' + parts.join('. ') + '.';
  }
  /** Request details calendar: the same month grid as the request form, with the request's range coloured
   *  green (no conflict) or red (conflict). Every day in the range is tappable to see who else is out. */
  function reqCalendar(r) {
    const cf = reqConflicts(r);
    const months = [];
    for (let m = D.monthStart(r.start); m <= r.end && months.length < 3; m = D.addMonths(m, 1)) months.push(m);
    return months.map(m0 => {
      const gs = D.weekStart(m0), mon = m0.slice(0, 7);
      let cells = DOW.map(x => '<div class="dw">' + x[0] + '</div>').join('');
      for (let i = 0; i < 42; i++) {
        const d = D.add(gs, i);
        if (i === 35 && d.slice(0, 7) !== mon) break;
        if (d.slice(0, 7) !== mon) { cells += '<span class="blank"></span>'; continue; }
        const today = d === S.today ? ' today' : '', c = cf.get(d);
        if (!c) { cells += '<span class="' + today.trim() + '">' + Number(d.slice(8)) + '</span>'; continue; }
        const txt = conflictText(d, c);
        cells += '<button type="button" class="in ' + (c.bad ? 'rg-full' : 'rg-ok') + (d === r.start ? ' r-s' : '') + (d === r.end ? ' r-e' : '') + today + '"' +
          ' data-act="confDay" data-date="' + d + '" data-id="' + esc(r.id) + '" aria-label="' + esc(txt) + '" title="' + esc(txt) + '">' + Number(d.slice(8)) + '</button>';
      }
      return '<div class="mini"><div class="mini-h"><span>' + D.f(m0, { month: 'long', year: 'numeric' }) + '</span></div><div class="mini-g">' + cells + '</div></div>';
    }).join('');
  }

  /* ---------- Roster: one member's year (6 months back, this month, 5 ahead) ---------- */
  function openPersonYear(uid) {
    const u = S.users.find(x => x.id === uid);
    if (!u) return;
    const first = D.addMonths(D.monthStart(S.today), -6), months = Array.from({ length: 12 }, (_, i) => D.addMonths(first, i));
    const from = first, to = D.add(D.addMonths(first, 12), -1);
    const reqs = IDX.live.filter(r => r.userId === uid && r.status !== 'Cancelled' && r.end >= from && r.start <= to);
    const RANK = { Approved: 0, Pending: 1, Denied: 2 };
    // One request per day: approved beats pending beats denied (overlaps are rare and flagged elsewhere).
    const dayReq = d => reqs.filter(r => r.start <= d && r.end >= d).sort((a, b) => RANK[a.status] - RANK[b.status])[0];
    const tot = { Leave: { Approved: 0, Pending: 0, Denied: 0 }, Pass: { Approved: 0, Pending: 0, Denied: 0 } };
    reqs.forEach(r => { const a = D.max(r.start, from), b = D.min(r.end, to); if (a <= b) tot[r.type][r.status] += D.days(a, b); });
    const cls = r => r.status === 'Approved' ? 'y-ap-' + r.type.toLowerCase() : r.status === 'Pending' ? 'y-pend' : 'y-den';
    const blocks = months.map(m0 => {
      const gs = D.weekStart(m0), mon = m0.slice(0, 7);
      let cells = DOW.map(x => '<span class="y-dw">' + x[0] + '</span>').join('');
      for (let i = 0; i < 42; i++) {
        const d = D.add(gs, i);
        if (i === 35 && d.slice(0, 7) !== mon) break;
        if (d.slice(0, 7) !== mon) { cells += '<span class="y-d y-blank"></span>'; continue; }
        const r = dayReq(d), today = d === S.today ? ' y-today' : '';
        cells += r
          ? '<button type="button" class="y-d ' + cls(r) + today + '" data-act="yearDay" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(D.f(d, { month: 'long', day: 'numeric' }) + ': ' + r.type + ', ' + r.status) + '">' + Number(d.slice(8)) + '</button>'
          : '<span class="y-d' + today + '">' + Number(d.slice(8)) + '</span>';
      }
      return '<div class="y-m' + (mon === S.today.slice(0, 7) ? ' y-now' : '') + '"><div class="y-t">' + D.f(m0, { month: 'long', year: 'numeric' }) + '</div><div class="y-g">' + cells + '</div></div>';
    }).join('');
    const sum = '<div class="y-sum"><span><b>' + tot.Leave.Approved + '</b> leave days approved</span><span><b>' + tot.Leave.Pending + '</b> pending</span><span><b>' + tot.Leave.Denied + '</b> denied</span>' +
      '<span><b>' + tot.Pass.Approved + '</b> pass days approved</span></div>';
    const key = '<div class="mini-key"><span class="mk-i"><span class="mk y-ap-leave"></span>Approved leave</span><span class="mk-i"><span class="mk y-ap-pass"></span>Approved pass</span>' +
      '<span class="mk-i"><span class="mk y-pend"></span>Pending</span><span class="mk-i"><span class="mk y-den"></span>Denied</span></div>';
    const html = modalHead(esc(nameText(u, true)), 'calendar') + '<div class="modal-b">' +
      '<div class="req-who">' + idBadge(u) + '<span class="req-name">' + esc(nameText(u)) + '</span><span class="badge">' + esc(ROLE_NAME[u.role] || u.role) + '</span></div>' +
      '<p class="meta" style="margin:8px 0 10px;white-space:normal">' + esc(D.f(from, { month: 'short', year: 'numeric' }) + ' – ' + D.f(to, { month: 'short', year: 'numeric' })) + ' · tap a coloured day to open that request</p>' +
      sum + key + '<div class="y-grid">' + blocks + '</div></div>' +
      '<div class="modal-f"><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="personRequests" data-id="' + esc(u.id) + '">' + icon('list', 18) + 'All requests</button></div>';
    openModal('year', html, true);
  }

    S.wiz = {
      step: 1, editId: r.id, editStatus: r.status, assigneeId: r.userId, creating: false,

  function wizRole() {
    const w = S.wiz;
    return w.creating ? w.nu.role : userOf(w.assigneeId).role;
  }
  function wizCheck() {
    const w = S.wiz, errs = [], warns = [];
    let n = 0;
    if (!D.valid(w.start) || !D.valid(w.end)) {
      errs.push('Select departure and return dates.');
    } else if (w.end < w.start) {
      errs.push('Return date must be on or after the departure date.');
    } else {
      n = D.days(w.start, w.end);
      const rule = lenRule(w.type), tn = w.type === 'Pass' ? 'Pass' : 'Leave';
      if (n > rule.max) (rule.mode === 'limit' ? errs : warns).push(rule.mode === 'limit'
        ? tn + ' is limited to ' + rule.max + ' days — you selected ' + n + '.'
        : 'Caution: ' + tn.toLowerCase() + ' over ' + rule.max + ' days is flagged for leadership review.');
      if (n > 60) errs.push('Requests are limited to 60 days.');
      const role = wizRole(), q = w.type === 'Leave' ? quota(role) : 0;
      if (q) {
        const hits = [];
        // When editing, the request's current days are already in the counts.
        const self0 = w.editId && w.editStatus !== 'Denied' ? S.requests.find(r => r.id === w.editId) : null;
        const self = self0 && self0.type === 'Leave' ? self0 : null;
        for (let d = w.start; d <= w.end && hits.length < 40; d = D.add(d, 1)) {
          const own = self && d >= self.start && d <= self.end ? 1 : 0;
          if (countOn(d, role) - own + 1 > q) hits.push(d);
        }
        if (hits.length) warns.push(role + ' leave max (' + q + '/day) would be exceeded on ' + hits.map(D.short).join(', ') + '. Leadership will see a conflict flag.');
      }
      if (!w.creating) {
        const clash = IDX.live.filter(r => r.id !== w.editId && r.userId === w.assigneeId && (r.status === 'Pending' || r.status === 'Approved') && r.start <= w.end && r.end >= w.start);
        if (clash.length) warns.push('Overlap: these dates overlap ' + clash.map(c => 'an existing ' + c.type.toLowerCase() + ' (' + D.short(c.start) + ' → ' + D.short(c.end) + ', ' + c.status.toLowerCase() + ')').join(' and ') + '. A member can’t be on leave and a pass at the same time — leadership will see a conflict warning.');
      }
      if (w.start < S.today) warns.push('Departure date is in the past.');
    }
    return { errs, warns, n };
  }

  /* Step 2: pick dates on the calendar (or type them in the fields below it). Only blocking problems show here;
     the summary, warnings and trip notes are on the Review step. */
  function renderWizDates() {
    const w = S.wiz;
    return '<div id="wizMini">' + renderMini() + '</div>' +
      '<div class="wiz-dates"><div class="field"><label for="wzS">Departure</label><input id="wzS" type="date" value="' + esc(w.start) + '" data-model="wiz.start" data-change="wizDates"></div>' +
      '<div class="field"><label for="wzE">Return</label><input id="wzE" type="date" value="' + esc(w.end) + '" data-model="wiz.end" data-change="wizDates"></div></div>' +

  /** Slot state of a day for the request being made: 'ok' (green), 'over' (adding it overbooks, orange), 'full' (approved leave
   *  already fills the slots, red). Passes and positions without a max are always 'ok'. Excludes the request being edited. */
  function wizDayState(d) {
    const w = S.wiz, role = wizRole(), q = w.type === 'Leave' ? quota(role) : 0;
    if (!q) return 'ok';
    const self = w.editId ? S.requests.find(r => r.id === w.editId) : null;
    const own = self && self.type === 'Leave' && self.status !== 'Denied' && d >= self.start && d <= self.end;

    const total = countOn(d, role) - (own ? 1 : 0) + 1;

    async signOut() {
      // Remove this device's push subscription while the session is still valid, then end the session.
      try { const sub = swReg && await swReg.pushManager.getSubscription(); if (sub) { await call('apiPushUnsubscribe', S.token, sub.endpoint); await sub.unsubscribe(); } } catch (e) { /* best effort */ }
      try { await call('apiLogout', S.token); } catch (e) { /* session may already be gone */ }
      signOutLocal();
    },

    /* Admin */
    previewUnit(el) {
      const prev = el.closest('.unit-row') && el.closest('.unit-row').querySelector('.ub');
      if (prev) prev.className = 'ub ub-' + el.value;
    },
    openRoster() { S.view = 'roster'; S.adq = ''; render(); },
    backAdmin() { S.view = 'admin'; render(); },
    rosterShow(el) { S.rosterShow = el.dataset.v; render(); },
    adFilter() {
      const q = (S.adq || '').trim().toLowerCase();
      $$('.cfg-row').forEach(r => { r.hidden = !!q && r.dataset.q.indexOf(q) < 0; });
      const none = $('.cfg-none'); if (none) none.hidden = !!$('.cfg-row:not([hidden])');
    },
    async saveUnit(el) {
      const code = el.dataset.code, row = el.closest('.unit-row');
      const unit = { code, name: row.querySelector('.un-name').value, style: (row.querySelector('.swatches input:checked') || {}).value };
      save(() => { S.settings.units = unitsList().map(x => x.code === code ? Object.assign({}, x, unit) : x); }, 'apiSaveUnit', S.token, unit);
      render(); toast(code + ' badge saved', 'ok', 1500);
    },
    async addUnit() {
      const code = $('#nuCode').value.trim().toUpperCase();
      if (!/^[A-Z0-9]{2,5}$/.test(code)) return toast('Unit code must be 2–5 letters or numbers.', 'error');
      if (unitsList().some(x => x.code === code)) return toast(code + ' already exists — edit it above.', 'error');
      const unit = { code, name: $('#nuUName').value || code, style: ($('.cfg-new .swatches input:checked') || {}).value || 'crimson' };
      save(() => { S.settings.units = unitsList().concat([unit]); }, 'apiSaveUnit', S.token, unit);
      render(); toast(code + ' badge added', 'ok', 1500);
    },
    async deleteUnit(el) {
      if (!confirm('Delete the ' + el.dataset.code + ' badge?')) return;
      const code = el.dataset.code;
      save(() => { S.settings.units = unitsList().filter(x => x.code !== code); }, 'apiDeleteUnit', S.token, code);
      render(); toast(code + ' badge deleted', 'ok', 1500);
    },
    async resetPin(el) {
      const u = S.users.find(x => x.id === el.dataset.id);
      if (!u || !confirm('Reset ' + u.name + '’s PIN to the current default PIN? They will have to choose a new PIN at their next sign-in.')) return;
      save(() => { u.mustChange = true; }, 'apiResetPin', S.token, u.id);
      render(); toast(u.name + '’s PIN reset to the default', 'ok', 2000);
    },
    async saveDefaultPin() {
      const a = $('#dp1').value.trim(), b = $('#dp2').value.trim();
      if (!/^\d{4,8}$/.test(a)) return toast('PIN must be 4–8 digits.', 'error');
      if (a !== b) return toast('PINs do not match.', 'error');
      const ok = await run('Updating default PIN…', 'apiSetDefaultPin', S.token, a, b);
      if (ok) { $('#dp1').value = ''; $('#dp2').value = ''; toast('Default PIN updated'); }
    },
    lenMode(el) {
      S.lenDraft = Object.assign({}, S.lenDraft, { [el.dataset.t]: el.dataset.v });
      $$('[data-act="lenMode"][data-t="' + el.dataset.t + '"]').forEach(b => b.classList.toggle('on', b.dataset.v === el.dataset.v));
    },
    saveLength() {
      const cfg = {};
      ['Leave', 'Pass'].forEach(t => { cfg[t] = { max: Number($('#len' + t).value), mode: (S.lenDraft || {})[t] || lenRule(t).mode }; });
      const bad = ['Leave', 'Pass'].find(t => !Number.isInteger(cfg[t].max) || cfg[t].max < 1 || cfg[t].max > 60);
      if (bad) return toast(bad + ' max days must be 1–60.', 'error');
      save(() => { Object.assign(S.settings, { leaveMaxDays: cfg.Leave.max, leaveMode: cfg.Leave.mode, passMaxDays: cfg.Pass.max, passMode: cfg.Pass.mode }); S.lenDraft = null; },
        'apiSaveLengthRules', S.token, cfg);
      render(); toast('Length rules saved', 'ok', 1500);
    },
    async saveQuotas() {
      const cfg = { pilotQuota: Number($('#qP').value), boomQuota: Number($('#qB').value), otherQuota: Number($('#qO').value) };
      save(() => { Object.assign(S.settings, cfg); }, 'apiSaveSettings', S.token, cfg);
      render(); toast('Daily limits saved', 'ok', 1500);
    },
    editUser(el) { openUserEditor(el.dataset.id); },
    async saveUser(el) {
      const u = readUserFields('ue'); u.id = el.dataset.id || '';
      const err = $('#ueErr');
      if (!u.first || !u.last) { err.textContent = 'Enter first and last name.'; return; }
      // Edits show at once; a new member appears when the save finishes (it needs an id from the server).
      save(u.id ? () => { const x = S.users.find(y => y.id === u.id); if (x) Object.assign(x, { name: u.name, rank: u.rank, role: u.role, unit: u.unit }); } : null, 'apiSaveUser', S.token, u);
      closeModal(); render(); toast(u.id ? 'Member updated' : 'Adding ' + u.name + '…', 'ok', 1500);
    },
    async toggleUser(el) {
      const u = S.users.find(x => x.id === el.dataset.id);
      if (!u) return;
      if (u.active && !confirm('Deactivate ' + u.name + '? They will no longer be able to sign in. Their history is kept.')) return;
      const on = !u.active;
      save(() => { u.active = on; }, 'apiSetUserActive', S.token, u.id, on);
      render(); toast(u.name + (on ? ' reactivated' : ' deactivated'), 'ok', 1500);
    },
    async savePasskey() {
      const a = $('#pk1').value.trim(), b = $('#pk2').value.trim();
      if (!/^\d{4,8}$/.test(a)) return toast('Passkey must be 4–8 digits.', 'error');
      if (a !== b) return toast('Passkeys do not match.', 'error');
      const ok = await run('Updating passkey…', 'apiChangePasskey', S.token, a, b);
      if (ok) { $('#pk1').value = ''; $('#pk2').value = ''; toast('Admin PIN updated'); }
    },

    /* Wizard */
    wizCreate() { S.ppMode = 'filter'; S.wiz.creating = true; S.wiz.error = ''; renderWizard(); },
    wizExisting() { S.wiz.creating = false; S.wiz.error = ''; renderWizard(); },
    wizEdit() { S.wiz.step = 'form'; S.wiz.error = ''; renderWizard(); },
    /** One-page form → Review: check the new member (if any) and the dates first. */
    wizReview() {
      const w = S.wiz, err = m => { const e = $('#wizErr'); if (e) e.textContent = m; toast(m, 'error'); };
      if (w.creating) {
        w.nu = readUserFields('nu');
        if (!w.nu.first || !w.nu.last) return err('Enter the new member’s first and last name.');
        if (S.users.find(u => u.name.toLowerCase() === w.nu.name.toLowerCase() && u.unit === w.nu.unit)) return err(w.nu.name + ' (' + w.nu.unit + ') is already on the roster — choose them from the list.');
      }
      if (!D.valid(w.start)) return err('Pick your departure date on the calendar.');
      if (!D.valid(w.end)) return err('Now pick your return date — tap the same day again for a one-day request.');
      const c = wizCheck();
      if (c.errs.length) return err(c.errs[0]);
      w.error = ''; w.step = 3; renderWizard();
    },
    wizEditType(el) {
      S.wiz.type = el.dataset.v;
      $$('#modal [data-act="wizEditType"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.wiz.type));
      refreshWizDates();
    },
    wizDates() {
      const w = S.wiz;
      // A return date before the departure is cleared, never replaced with a guess.
      if (D.valid(w.start) && D.valid(w.end) && w.end < w.start) w.end = '';
      if (D.valid(w.start)) w.mini = D.monthStart(w.start);
      w.picking = D.valid(w.start) && !D.valid(w.end);
      refreshWizDates();
    },
    miniNav(el) { S.wiz.mini = D.addMonths(S.wiz.mini, Number(el.dataset.v)); refreshWizDates(); },
    miniPick(el) {
      const w = S.wiz, d = el.dataset.date;
      // First tap = Departure (Return stays empty); second tap = Return. Tap the same day twice for a one-day request.
      if (!w.picking) { w.start = d; w.end = ''; w.picking = true; }
      else { const a = D.min(w.start, d), b = D.max(w.start, d); w.start = a; w.end = b; w.picking = false; }
      refreshWizDates();
    },
    /* Submitting / saving a request waits for the server behind a full-screen "Submitting…" screen, so nobody closes
       the app before it's saved. If it fails, the form stays open with the error so they can try again. */
    async wizSubmit() {
      const w = S.wiz, c = wizCheck();
      if (c.errs.length) { $('#wizErr').textContent = c.errs[0]; return; }
      const payload = { type: w.type, start: w.start, end: w.end, note: w.note.trim() };
      let done;
      if (w.editId) {
        const id = w.editId;
        showBlocker('Saving…');
        done = save(() => {
          const r = findReq(id); if (!r) return;
          Object.assign(r, payload);
          if (!S.isAdmin && r.status === 'Denied') r.status = 'Pending'; // a member's edit resubmits a denied request
        }, 'apiUpdateRequest', S.token, id, payload);
      } else {
        if (S.isAdmin && w.creating) payload.newUser = w.nu;
        else if (S.isAdmin) payload.assigneeId = w.assigneeId;
        showBlocker('Submitting…');
        done = save(null, 'apiCreateRequest', S.token, payload);
      }
      const data = await done;
      await saveChain; // let the confirmed data apply
      hideBlocker();
      if (!data) { if (S.wiz) $('#wizErr') && ($('#wizErr').textContent = 'Not saved — check your connection and try again.'); return; }
      closeModal();
      if (!w.editId && isCalView()) S.cursor = w.start;
      render();
      toast(w.editId ? 'Request updated' : 'Request submitted — pending approval', 'ok', 2200);
      if (S.cfReturn) { const cd = S.cfReturn; S.cfReturn = null; openConflict(cd, S.cfRole); } // edited from the conflict screen
    }
  };

  /* ================================================================ */
  /* Event wiring                                                       */
  /* ================================================================ */
  document.addEventListener('click', ev => {
    // A click outside an open filter menu only closes the menu — it doesn't also open a day, request, etc.
    if (S.openDrop && !ev.target.closest('.fdrop')) {
      S.openDrop = null; $$('.fdrop-pop').forEach(p => { p.hidden = true; }); $$('.fdrop-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
      ev.preventDefault(); ev.stopPropagation();
      return;
    }
    const ov = ev.target.closest('[data-overlay]');
    if (ov && ev.target === ov) { closeModal(); return; }
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') return;
    ev.preventDefault();
    ev.stopPropagation();
    fn(el, ev);
  });
  document.addEventListener('input', ev => {
    const t = ev.target, m = t.dataset && t.dataset.model;
    if (!m) return;
    setPath(m, t.value);
    if (t.dataset.live && A[t.dataset.live]) A[t.dataset.live](t, ev);
  });
  document.addEventListener('change', ev => {
    const t = ev.target, m = t.dataset && t.dataset.model;
    if (m) setPath(m, t.value);
    if (t.dataset && t.dataset.change && A[t.dataset.change]) A[t.dataset.change](t, ev);
    if (m === 'wiz.assigneeId') { /* role may change quota checks later */ }
  });
  document.addEventListener('mouseover', ev => {
    if (!S.sel) return;
    const el = ev.target.closest('[data-act="pickDay"]');
    if (el && el.dataset.date !== S.sel.hover) { S.sel.hover = el.dataset.date; paintSel(); }
  });
  document.addEventListener('keydown', ev => {
    // Non-button event elements (bars, chips, pucks) act like buttons for keyboard users.
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-act], article[data-act], tr[data-act][tabindex]')) {
      ev.preventDefault();
      ev.target.click();
      return;
    }
    if (ev.key !== 'Escape') return;
    if (S.modal) { closeModal(); return; }
    if (S.dayPanel && $('.dpanel')) { S.dayPanel = null; store.set('dpClosed', true); render(); return; }
    if (S.sel) { S.sel = null; paintSel(); hideToast(); }
    else if (S.focus) clearFocus();
  });
  // Hover / keyboard-focus tooltip for elements with data-tip (conflict calendar days).
  let tipEl = null;
  function showTip(el) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.textContent = el.dataset.tip;
    tipEl.style.display = 'block';
    const b = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
    let x = b.left + b.width / 2 - t.width / 2, y = b.top - t.height - 8;
    x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
    if (y < 8) y = b.bottom + 8;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('scroll', hideTip, true);

  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (!S.me || !isCalView() || S.cal !== 'month') return;
      // Switch between the phone (counts) and full (names) month layouts when crossing the breakpoint.
      if (!!$('.month.compact') !== isCompact()) render(); else fitMonth();
    }, 120);
  });

  /* Keep data fresh: changes made elsewhere (another admin, another tab, the sheet) show up without a reload.
     Refreshes every 60s while visible, when the tab regains focus, and when the request form or a person picker opens.
     The page behind an open dialog re-renders; an open person picker is rebuilt in place with the new list. */
  let refreshing = false;
  let saveGen = 0;   // bumped by every save(); lets a background refresh detect it raced a save
  async function refreshData() {
    if (!S.token || !S.me || S.busy || S.sel || S.pending || refreshing) return;
    const a = document.activeElement;
    if (!S.modal && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    refreshing = true;
    const gen = saveGen;
    try {
      const data = await call('apiBootstrap', S.token);
      // A save started while this was in flight: its result is newer than this snapshot, so drop the snapshot.
      if (S.pending || gen !== saveGen) return;
      apply(data);
      if (!S.modal) render();
      else if (S.modal === 'person') {
        // Rebuild the open picker with the fresh list, keeping whatever was typed in its search box.
        const q = S.ppq; openPersonPicker(S.ppScope, S.ppMode);
        const box = $('#modal .pp-search input'); if (q && box) { box.value = q; S.ppq = q; A.ppFilter(); }
      }
    } catch (e) { /* transient; the next refresh retries */ }
    finally { refreshing = false; }
  }
  setInterval(() => { if (!document.hidden) refreshData(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshData(); });
  window.addEventListener('focus', () => refreshData());

  /* ================================================================ */
  /* Boot                                                               */
  /* ================================================================ */
  async function boot() {
    applyTheme();
    initPush();
    if (S.token) {
      try { apply(await call('apiBootstrap', S.token)); render(); if (location.hash) openLink(location.hash); return; }
      catch (e) { if (/new PIN/.test(e.message)) return; S.token = null; store.del('token'); }
    }
    showLogin();
  }
  boot();
})();
</script>
