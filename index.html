    .modal-f .btn.act.act-lbl .ic { width: 18px; height: 18px; }
  }
  @container (max-width: 340px) {
    .modal-f .btn.act.act-edit, .modal-f .btn.act.act-edit:has(> .ic:first-child) { flex: none; width: 40px; padding: 0; gap: 0; border-radius: 50%; }
    .modal-f .btn.act.act-edit .bl { display: none; }
  }

  /* Dialog footer actions: labels come back as soon as every pill has room for its word (Approve is the longest, ~110px each). */
  .modal-f:has(.btn.act) { container-type: inline-size; }
  @container (min-width: 470px) {
    .modal-f .btn.act .bl { display: inline; }
    .modal-f .btn.act, .modal-f .btn.act:has(> .ic:first-child) { gap: 6px; padding: 0 12px; }
    .modal-f .btn.act .ic { width: 18px; height: 18px; }
  }

  /* ---------- Phone month: event strips (like Week view) ---------- */
  .month.compact.strips .cell.cc { justify-content: flex-start; }
  .month.compact.strips .cell.cc.over .cc-n::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 3px; border-radius: 50%; background: var(--bad); vertical-align: 3px; }
  .cs-lanes { position: absolute; top: 28px; left: 0; right: 0; bottom: 2px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(var(--lanes, 3), 22px); row-gap: 3px; pointer-events: none; overflow: hidden; }
  .cs-bar { --tag: 18px; --pill-fs: 11.5px; pointer-events: auto; min-width: 0; height: 22px; display: flex; align-items: center; gap: 3px; padding: 0 3px; margin: 0 -1px; overflow: hidden;
    font-size: 11.5px; font-weight: 700; line-height: 1; white-space: nowrap; cursor: pointer; }
  .cs-bar.leave { background: var(--leave); color: #ffffff; }
  .cs-bar.pass { background: var(--gold); color: var(--navy); }
  .cs-bar.st-denied { background: var(--denied-bg); color: var(--denied-ink); }
  .cs-bar.st-denied .cs-n { text-decoration: line-through; }
  .cs-bar.b-s { margin-left: 2px; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .cs-bar.b-e { margin-right: 2px; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .cs-r { flex: none; width: 13px; height: 13px; display: grid; place-items: center; border-radius: 3px; font-size: 9.5px; font-weight: 900; background: rgba(0, 0, 0, .28); color: inherit; }
  .cs-bar.pass .cs-r { background: var(--navy); color: var(--gold); }
  .cs-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cs-bar .sti { margin-left: 0; flex: none; } .cs-bar .sti .ic { width: 11px; height: 11px; }
  .cs-bar:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; z-index: 2; }
  .cs-more { pointer-events: auto; align-self: center; justify-self: center; font-size: 11.5px; font-weight: 800; color: var(--muted); cursor: pointer; }

  /* Phone month fills the space between the toolbar and Add Request: equal rows, no scrolling. */
  .month.compact .month-grid { grid-template-rows: repeat(var(--weeks), minmax(0, 1fr)); overflow: hidden; }
  .month.compact .week-row { min-height: 0; }
  .month.compact .cell.cc { overflow: hidden; }
  .month.compact:not(.strips) .cell.cc { gap: 2px; }
  .month.compact:not(.strips) .cell.cc .rm-bar { height: 3px; }
  /* Phone month strips carry the standard person puck [P|MKE|Lastname] (DESIGN.md §Pills). */
  .cs-bar .idb.pb { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .cs-bar .idb-u { display: inline-flex; }
  /* (Badges never drop the unit; names shorten with … instead.) */

  /* ---------- Qtr availability tint (one position: mine, else the first selected) ---------- */
  :root { --av-open: #b9e6c4; --av-over: #fcc98f; --av-full: #f7aaa4; --av-open-dot: #1e7a3a; --av-over-dot: #c2560a; --av-full-dot: #b3261e; }
  /* Dark mode: vivid "trading app" good / caution / bad — green #00C805, orange #FF9F0A, red #FF3B30 over the dark surface. */
  :root[data-theme="dark"] { --av-open: color-mix(in srgb, #00C805 34%, #17181d); --av-over: color-mix(in srgb, #FF9F0A 40%, #17181d); --av-full: color-mix(in srgb, #FF3B30 42%, #17181d);
    --av-open-dot: #00C805; --av-over-dot: #FF9F0A; --av-full-dot: #FF3B30; }
  .qd.av-open, .qd.av-open.wknd { background: var(--av-open); }
  .qd.av-over, .qd.av-over.wknd { background: var(--av-over); }
  .qd.av-full, .qd.av-full.wknd { background: var(--av-full); }
  .qkey { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 4px 12px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .qk-t { font-weight: 800; color: var(--on-surface); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  .qk { display: inline-flex; align-items: center; gap: 6px; }
  .qk i { width: 14px; height: 14px; border-radius: 4px; }
  .qk.av-open i { background: var(--av-open); box-shadow: inset 0 0 0 2px var(--av-open-dot); }
  .qk.av-over i { background: var(--av-over); box-shadow: inset 0 0 0 2px var(--av-over-dot); }
  .qk.av-full i { background: var(--av-full); box-shadow: inset 0 0 0 2px var(--av-full-dot); }

  /* Request and Stats tables: Last Name (.stk) stays pinned to the left edge while the rest scrolls sideways. */
  .rtable .stk { position: sticky; left: 0; box-shadow: inset -1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .35); }
  .rtable tbody td.stk { z-index: 1; background: var(--card); }
  .rtable tbody tr:nth-child(even) td.stk { background: color-mix(in srgb, var(--card-2) 55%, var(--card)); }
  .rtable tbody tr:hover td.stk { background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
  .rtable thead th.stk { z-index: 3; }

  /* ---------- Profile page (same panel layout as Admin) ---------- */
  .profile-page .panel { max-width: 720px; }
  .profile-page #passkey { max-width: 220px; }

  /* ---------- Admin page (settings only) — mobile first ---------- */
  .admin-page .toolbar { flex-wrap: nowrap; padding: 8px 12px; gap: 8px; }
  .admin-page .cfg-tools { margin-left: auto; display: flex; gap: 8px; }
  .admin-page a.btn { text-decoration: none; }
  .admin-page .panel { max-width: 760px; padding: 16px; }
  .admin-page .panel h3 { margin: 0 0 6px; }
  .admin-page .panel h3 .ct { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .cfg-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cfg-h h3 { margin: 0 !important; }
  .cfg-help { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .cfg-search { position: relative; margin-bottom: 6px; }
  .cfg-search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .cfg-search input { height: 44px; padding-left: 38px; border-radius: 22px; border: 1px solid var(--outline); background: transparent; }
  .cfg-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .cfg-row:first-child { border-top: 0; }
  .cfg-row[hidden] { display: none; }
  .cfg-row .idb { margin-right: 0; }
  .cfg-row.off .cfg-nm { color: var(--muted); }
  .cfg-who { flex: 1; min-width: 0; }
  .cfg-nm { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cfg-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .cfg-sub .badge { font-size: 12px; }
  .cfg-acts { flex: none; display: flex; gap: 6px; }
  .cfg-none { padding: 16px 0; color: var(--muted); text-align: center; }
  .cfg-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 420px; }
  .cfg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 480px; }
  .cfg-grid3 input, .cfg-grid2 input { width: 100%; }
  .cfg-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .cfg-foot .meta { margin-right: auto; }
  .cfg-unit { padding: 14px 0; border-top: 1px solid var(--line); }
  .cfg-unit:first-of-type { border-top: 0; padding-top: 4px; }
  .cfg-unit-h { display: flex; align-items: flex-end; gap: 10px; }
  .cfg-unit-h .ub-prev { min-width: 0; flex: none; align-self: center; }
  .cfg-unit-h > input, .cfg-unit-h .field { flex: 1; min-width: 0; }
  .cfg-unit-h .field.cfg-code { flex: 0 0 88px; }
  .cfg-unit .un-name { width: 100%; height: 44px; padding: 0 12px; }
  .cfg-new { margin-top: 4px; border-top: 1px dashed var(--outline); }
  .cfg-sub-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .swatch { position: relative; cursor: pointer; }
  .swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .swatch .ub { width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .swatch input:checked + .ub { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--on-surface); }
  .swatch input:focus-visible + .ub { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (max-width: 420px) { .cfg-grid2 { grid-template-columns: 1fr; } }
  .cfg-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  /* Pinned Last Name while scrolled sideways: a 4px Leave (blue) / Pass (gold) bar on its left edge shows the row's type. */
  .tbl-wrap.scrolled tr.t-leave td.stk { box-shadow: inset 4px 0 0 var(--leave), inset -1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .35); }
  .tbl-wrap.scrolled tr.t-pass td.stk { box-shadow: inset 4px 0 0 var(--gold), inset -1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .35); }
  .tbl-wrap.scrolled tr.t-leave td.stk, .tbl-wrap.scrolled tr.t-pass td.stk { padding-left: 16px; }

  /* ---------- All / Mine list bar: same controls and order as the calendar bar ----------
     Desktop: [search ········] [status] [position · person] [Leave|Pass] [Add Request]
     Phone:   row 1 search · row 2 filters (equal widths) · Add Request in the bottom bar. */
  .lbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
  .lsearch { flex: 1 1 160px; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 20px; color: var(--muted); }
  .lsearch:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
  .lsearch input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; color: var(--on-surface); font-size: 16px; outline: none; }
  .lbar .filters { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  @media (max-width: 700px) {
    .lbar .lsearch { flex: 1 1 100%; }
    .lbar .filters { flex: 1 1 100%; gap: 6px; }
    .lbar .filters > .fdrop, .lbar .filters > .tgroup { flex: 1 1 0; min-width: 0; }
    .lbar .filters .fdrop-btn { width: 100%; padding: 0 8px 0 12px; font-size: 13.5px; }
    .lbar .filters .tgroup { display: flex; height: 40px; }
    .lbar .filters .tgroup .tchip { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 13.5px; }
    .lbar .req-btn { display: none; }
  }

  /* Request form step 1: two plain choices — Leave / Pass. Tapping one goes straight to dates. */
  .choices .choice { height: 72px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--outline); border-radius: 20px; background: transparent;
    color: var(--on-surface); font-size: 20px; font-weight: 700; text-align: center; padding: 0; }
  .choices .choice:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .choices .choice.leave:hover, .choices .choice.leave.on { background: var(--leave); border-color: var(--leave); color: #ffffff; }
  .choices .choice.pass:hover, .choices .choice.pass.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  /* Keep visually-hidden text inside its table (it was stretching the page sideways on phones). */
  .tbl-wrap, .flag { position: relative; }

  /* ---------- Consolidated Filters button (every width) + filter sheet ----------
     One "Filters" button (summary of what's filtered) opens the sheet with status, position, person / conflicts and Leave | Pass.
     The inline segment groups are not shown in the bars any more. */
  .mmode { display: none; }
  .fall .ic:first-child { flex: none; }
  .fall span { flex: 1; min-width: 0; text-align: left; }
  .calbar .filters > .fdrop, .calbar .filters > .tgroup, .calbar .filters > .fchips, .calbar .filters > .fp, .calbar .filters > .conf-only,
  .lbar .filters > .fdrop, .lbar .filters > .tgroup, .lbar .filters > .fchips, .lbar .filters > .fp, .lbar .filters > .conf-only { display: none !important; }
  .calbar .filters > .fall, .lbar .filters > .fall { display: flex; flex: 0 1 auto; min-width: 0; max-width: 380px; gap: 8px; padding: 0 12px 0 14px; }
  @media (max-width: 700px) {
    .calbar .filters > .fall, .lbar .filters > .fall { flex: 1 1 0; max-width: none; }
    .calbar .filters > .mmode { display: flex; flex: none; }
    .calbar .filters > .mmode .seg { display: flex; }
    .calbar .filters > .mmode .seg button { padding: 0 14px; }
  }
  .fs-sheet { max-width: 440px; }
  .fs-body { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .fs-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .fs-sect .seg, .fs-sect .tgroup { display: flex; width: 100%; height: 44px; }
  .fs-sect .seg button, .fs-sect .tgroup .tchip { flex: 1 1 0; min-width: 0; padding: 0 8px; }
  .fs-sect .fp.in-sheet { width: 100%; } .fs-sect .fp.in-sheet .fperson { display: flex; max-width: none; height: 44px; } .fs-sect .fp-clear { width: 44px; height: 44px; border-radius: 22px; }
  .fs-sheet .modal-f .btn { flex: 1; }

  /* Swipe cue: a round ‹ / › chip that fades in at the edge you swiped toward, then out (≈0.6s). */
  .swipe-cue { position: fixed; top: 50%; z-index: 60; width: 52px; height: 52px; margin-top: -26px; display: grid; place-items: center; border-radius: 50%;
    background: var(--sel-bg); color: var(--sel-ink); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; animation: swipeCue .6s ease-out forwards; }
  .swipe-cue.right { right: 12px; } .swipe-cue.left { left: 12px; }
  .swipe-cue.right { --sx: 16px; } .swipe-cue.left { --sx: -16px; }
  @keyframes swipeCue { 0% { opacity: 0; transform: translateX(var(--sx)); } 25% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .swipe-cue { --sx: 0px; } }

  /* Roster page (Admin → Manage roster) */
  .roster-page .toolbar .title { padding-left: 0; }
  .ro-show { margin: 4px 0 6px; }
  .ro-show .seg { display: flex; width: 100%; max-width: 420px; }
  .ro-show .seg button { flex: 1 1 0; min-width: 0; padding: 0 8px; }
  @media (max-width: 700px) { .roster-page .cfg-tools .btn.primary { padding: 0 16px 0 12px; } }
  /* New-badge fields: same 44px inputs as the unit name rows. */
  .cfg-unit .field input { flex: none; width: 100%; height: 44px; padding: 0 12px; }
  .cfg-unit-h { align-items: flex-end; }
  .cfg-unit-h .ub-prev { align-self: auto; margin-bottom: 11px; }
  .cfg-unit-h > .ub-prev:first-child + input { align-self: center; }
  /* Request form: assignee picker button (same picker sheet as the person filter). */
  .wiz-who { flex: 1 1 auto; min-width: 0; height: 44px; display: flex; gap: 10px; padding: 0 14px 0 10px; }
  .wiz-who .idb { margin-right: 0; flex: none; }
  .wiz-who span:not(.idb):not(.idb-r):not(.idb-u) { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-add { color: var(--primary); border-bottom: 1px solid var(--line); }
  .pp-add .ic { flex: none; }
  .pin-note { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; white-space: normal; }

  /* Disabled buttons look disabled, whatever their variant (e.g. Approve on an approved request, Deny on a denied one). */
  .btn:disabled, .btn.ok:disabled, .btn.bad:disabled, .btn.primary:disabled, .btn.req-btn:disabled, .btn.del:disabled {
    background: color-mix(in srgb, var(--on-surface) 10%, transparent) !important; border-color: transparent !important;
    color: color-mix(in srgb, var(--on-surface) 38%, transparent) !important; box-shadow: none !important; cursor: not-allowed; }
  .btn:disabled::before { display: none; }
  /* Same for every other kind of button: segments, toggles, chips, dropdown buttons, picker rows. */
  button:disabled:not(.btn), .seg button:disabled, .tchip:disabled, .fdrop-btn:disabled, .choice:disabled, .pp-row:disabled {
    background: color-mix(in srgb, var(--on-surface) 10%, transparent) !important; border-color: transparent !important;
    color: color-mix(in srgb, var(--on-surface) 38%, transparent) !important; box-shadow: none !important; cursor: not-allowed; opacity: 1; }
  button:disabled .ic, button:disabled .idb { opacity: .6; }

  /* Sync indicator: the Profile tab icon spins a ring while changes save; a red dot if a save failed. */
  .nav-ic { position: relative; }
  .nav-ic.syncing::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 2.5px solid color-mix(in srgb, var(--primary) 25%, transparent); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  .nav button.on .nav-ic.syncing::after { border-color: color-mix(in srgb, var(--sel-ink) 25%, transparent); border-top-color: var(--sel-ink); }
  .nav-ic.sync-err::after { content: ""; position: absolute; top: 2px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--nav-bg); }
  @media (prefers-reduced-motion: reduce) { .nav-ic.syncing::after { animation-duration: 2.4s; } }
  /* Admin → Request length */
  .cfg-len { display: grid; grid-template-columns: 64px minmax(0, 110px) minmax(0, 200px); gap: 12px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
  .cfg-len:first-of-type { border-top: 0; }
  .cfg-len-t { align-self: center; padding-top: 18px; }
  .cfg-len input { width: 100%; height: 44px; }
  .cfg-len .seg { display: flex; height: 44px; } .cfg-len .seg button { flex: 1 1 0; }
  .lbl-sm { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

  /* Conflict chip on request rows: red while any request in the over-max day is pending, gray once all approved. Opens the resolver. */
  .cfl { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; margin-left: 6px; border-radius: 4px; border: 0; font: inherit; font-size: 12.5px; font-weight: 800; white-space: nowrap; cursor: pointer; vertical-align: middle; }
  .cfl-bad { background: var(--no-bg); color: var(--no-ink); }
  .cfl-ok { background: color-mix(in srgb, var(--on-surface) 12%, transparent); color: var(--on-surface); }
  .cfl-sm { width: 22px; padding: 0; justify-content: center; }
  .cfl:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .st-cell { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
  .cfl-count { display: inline-flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 800; }
  /* Home-screen (standalone) app on iPhone: keep the top bar clear of the status bar / notch (0 everywhere else).
     The status-bar strip is painted in the top bar's color, so iOS's edge fade there blends into a solid color
     instead of fading the controls; the bottom (home indicator) area is the nav's own color. */
  #app { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  #app::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--card); z-index: 50; pointer-events: none; }
  html, body { background: var(--bg); } /* the nav bar pads itself over the home indicator, so nothing navy shows around the app */

  /* Request form, date step: calendar first, compact date fields under it. */
  .wiz-dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 2px 0 8px; }
  .wiz-dates .field { min-width: 0; }
  .wiz-dates input[type="date"] { display: block; width: 100%; min-width: 0; max-width: 100%; height: 44px; padding: 0 10px; box-sizing: border-box;
    font-size: 16px; -webkit-appearance: none; appearance: none; text-align: left; }
  .wiz-dates input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  /* Selected range: green where it fits, orange where it would overbook, red where slots are already full. */
  :root { --rg-ok: #1e7a3a; --rg-ok-ink: #ffffff; --rg-over: #c2560a; --rg-over-ink: #ffffff; --rg-full: #b3261e; --rg-full-ink: #ffffff; }
  :root[data-theme="dark"] { --rg-ok: #86d99a; --rg-ok-ink: #17181d; --rg-over: #fdba74; --rg-over-ink: #17181d; --rg-full: #ffb4ab; --rg-full-ink: #17181d; }
  .mini-g button.in { border-radius: 0; font-weight: 800; }
  .mini-g button.rg-ok { background: var(--rg-ok); color: var(--rg-ok-ink); }
  .mini-g button.rg-over { background: var(--rg-over); color: var(--rg-over-ink); }
  .mini-g button.rg-full { background: var(--rg-full); color: var(--rg-full-ink); }
  .mini-g button.r-s { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
  .mini-g button.r-e { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
  .mini-g button.dot-over::after, .mini-g button.dot-full::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; margin: -2px auto 0; }
  .mini-g button.dot-over::after { background: var(--rg-over); } .mini-g button.dot-full::after { background: var(--rg-full); }
  .mini-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
  .mk { width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; } .mk-ok { background: var(--rg-ok); } .mk-over { background: var(--rg-over); } .mk-full { background: var(--rg-full); }
  .wiz-type .seg { display: flex; width: 100%; height: 44px; } .wiz-type .seg button { flex: 1 1 0; }
  /* New-request Type selector: Brewers yellow with navy text (like the person filter) so the Leave / Pass choice stands out. */
  .wiz-type .seg { border-color: var(--gold-2); }
  .wiz-type .seg button + button { border-left-color: var(--gold-2); }
  .wiz-type .seg button.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .modal-f [data-act="wizEditSave"] { flex: 1; }

  /* Full-screen "Submitting…" cover (request submit / save). */
  .blocker { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(4, 12, 28, .72); backdrop-filter: blur(3px); }
  .blocker-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 32px; border-radius: 20px; background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,.4); text-align: center; }
  .blocker-t { font-size: 20px; font-weight: 800; color: var(--on-surface); }
  .blocker-s { font-size: 14px; color: var(--muted); }

  /* Week view: today's column gets a light tint behind the bars. */
  .slot.today { background-color: color-mix(in srgb, var(--primary) 8%, transparent); }

  /* ---------- Desktop day panel (≥900px): slides in from the left; the calendar narrows beside it ---------- */
  .cal-split { flex: 1; min-height: 0; display: flex; }
  .cal-split > .cal-body { flex: 1 1 auto; min-width: 0; }
  .dpanel { flex: 0 0 400px; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--outline-variant);
    box-shadow: -6px 0 18px -10px rgba(0, 0, 0, .45); z-index: 2; }
  .dpanel.dp-anim { animation: dpIn .18s ease-out; }
  @keyframes dpIn { from { transform: translateX(24px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .dpanel.dp-anim { animation: none; } }
  .dayv-panel { flex: 1; min-height: 0; overflow-y: auto; border-top: 0; box-shadow: none; }
  .dp-h { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; background: var(--surface); }
  .dp-t { flex: 1; min-width: 0; }
  .dp-w { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
  .dp-d { font-size: 18px; font-weight: 800; color: var(--on-surface); }
  .dp-x { margin-left: 4px; }
  .dayv-panel .day-groups .dl-who { flex-basis: 100%; }

  /* ---------- Week view: clearer position bands ---------- */
  .band { border-bottom: 0; }
  .band-title { background: var(--surface-high); color: var(--on-surface); border-top: 2px solid var(--outline); border-bottom: 1px solid var(--outline);
    padding: 6px 10px; font-size: 13.5px; box-shadow: inset 4px 0 0 var(--rm); }
  .band:first-child .band-title { border-top: 0; }
  .band-p { --rm: #0d9488; } .band-b { --rm: #7c3aed; } .band-o { --rm: #64748b; }
  :root[data-theme="dark"] .band-p { --rm: #2dd4bf; } :root[data-theme="dark"] .band-b { --rm: #a78bfa; } :root[data-theme="dark"] .band-o { --rm: #94a3b8; }
  .band-tag { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--rm); color: #0b1730; font-size: 12px; font-weight: 900; letter-spacing: 0; }
  .band-title .ct { background: var(--surface); border-color: var(--outline-variant); color: var(--on-surface); }

  /* Person filter with someone picked: one joined pill [ Name ⌄ | ✕ ] in the selected color (DESIGN.md §Selection). */
  .fp { gap: 0; }
  .fp:has(.fp-clear) .fperson { border-top-right-radius: 0; border-bottom-right-radius: 0; padding-right: 10px; }
  .fp:has(.fp-clear) { align-items: stretch; }
  .fp .fp-clear, .fp .fp-clear:has(> .ic:first-child) { width: 44px; min-width: 44px; height: auto; min-height: 0; align-self: stretch; padding: 0; margin: 0; justify-content: center;
    border-radius: 0 20px 20px 0; border: 0; border-left: 1px solid color-mix(in srgb, var(--sel-ink) 30%, transparent);
    background: var(--sel-bg); color: var(--sel-ink) !important; }
  .fp .fp-clear .ic { margin: 0; }
  .fs-sect .fp .fp-clear, .fs-sect .fp .fp-clear:has(> .ic:first-child) { width: 52px; min-width: 52px; border-radius: 0 22px 22px 0; }
  .mini-key { gap: 6px 16px; }
  .mk-i { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mk-i .mk { margin-left: 0; }


  /* Status cell: badges stacked and left-aligned, same height. */
  .st-cell { flex-direction: column; align-items: flex-start; gap: 4px; }
  .st-cell .cfl { margin-left: 0; height: 22px; }
  .st-cell .badge { height: 22px; display: inline-flex; align-items: center; }
  .dayv-panel .dstrip { padding: 4px 4px 10px; gap: 2px; }
  .dayv-panel .ds-arrow { width: 32px; height: 52px; }
  .dayv-panel .ds-days { gap: 2px; }
  .dayv-panel .ds-d { height: 56px; border-radius: 10px; }

  /* ---------- Conflict mode: only requests over the daily max; red frame + banner with ✕ ---------- */
  .btn.conf-only.on, .btn.conf-only.on:hover { background: var(--no-bg); border-color: var(--no-bg); color: var(--no-ink) !important; }

  .fs-sect .conf-sheet { width: 100%; height: 44px; }
  .conf-banner { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; background: var(--no-bg); color: var(--no-ink); font-size: 14.5px; }

  .pp-conf-t { flex: 1 1 160px; font-size: 13.5px; color: var(--muted); }
  .fp-conf .fperson.on, .fp-conf .fp-clear { background: var(--no-bg) !important; border-color: var(--no-bg) !important; color: var(--no-ink) !important; }
  .fp-conf .fperson .ic:first-child { flex: none; }
  /* "Everyone" row badge: [P|B|O] in the same puck style as people. */
  .idb.idb-all { margin-right: 0; box-shadow: 0 0 0 1.5px #0b1730; }
  .idb.idb-all .idb-r + .idb-r { border-left: 1.5px solid #0b1730; }

  /* Band headers use the type badge itself (no L / P tag); Past is neutral and starts collapsed. */
  .grp-in .badge { font-size: 12.5px; letter-spacing: .04em; text-transform: none; }
  .badge.t-past { background: var(--surface); border: 1px solid var(--outline); color: var(--on-surface); }
  .grp-past { --rm: var(--outline); }
  .badge.t-sm { height: 20px; padding: 0 6px; font-size: 11.5px; flex: none; }
  .grp-past tr[data-id] td { opacity: .85; }
  /* Narrow month cells (e.g. calendar squeezed by the day panel): keep only the counters that are full or over the max. */
  .month:not(.compact) .cell { container-type: inline-size; }
  @container (max-width: 185px) { .qc-day:not(.over):not(.full) { display: none; } .qc-day { padding: 0 4px; font-size: 11.5px; } }
  /* Out now: requests in progress today. Neutral high-contrast ring + live green dot. */
  :root { --now: #111318; --now-dot: #00a35c; }
  :root[data-theme="dark"] { --now: #ffffff; --now-dot: #00C805; }
  /* No "on now" stripes on bars: the green dot after the name marks who's out today. */
  .now-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--now-dot); animation: nowPulse 1.8s ease-out infinite; flex: none; }
  @keyframes nowPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--now-dot) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  @media (prefers-reduced-motion: reduce) { .now-dot { animation: none; } }
  /* Active Leave / Pass rows: a small L / P letter badge before the name and a green dot after it (no big badges;
     the section header already says they're active). */
  .badge.t-ltr { position: relative; flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; min-width: 0; padding: 0;
    border-radius: 6px; font-size: 12px; line-height: 1; font-weight: 800; }
  .now-dot.row-now { flex: none; position: relative; margin-left: 6px; }
  .badge.t-now { display: inline-flex; align-items: center; gap: 6px; background: var(--now); color: #fff; }

  .rtable tr.now > td:first-child { box-shadow: inset 4px 0 0 var(--now-dot); }
  /* Dark mode: navy sits close to the dark background, so leave BARS on the calendars (Month, phone month, Week, Qtr)
     get a light navy edge. Badges and the "On leave" header have no border (same as Pass). */
  :root[data-theme="dark"] .evs.leave, :root[data-theme="dark"] .cs-bar.leave, :root[data-theme="dark"] .wpuck.leave,
  :root[data-theme="dark"] .qbar.leave, :root[data-theme="dark"] .mseg.leave { box-shadow: inset 0 0 0 1.5px var(--navy-edge); }
  /* ---------- Day marker: ONE implementation for Month (desktop + phone), Stats, Week, Qtr and the day strip ----------
     ::before = rounded ring, ::after = the date pill joined to its top-left corner. Both use --mark, so they always match.
     Today uses --today-ring; the open day (desktop day panel) uses --sel-ring, and so does today when it is the open day.
     The pill shows data-d (set by markOpenDay); the original number stays in place, invisible but clickable.
     Layers: cell background < ring (z 3) < event bars (z 4: .mo, .cs-lanes, .qbar) < date pill (z 5). The marker is always the bottom layer under bars. */
  :root { --today-ring: color-mix(in srgb, var(--primary) 72%, var(--surface)); }
  :is(.cell, .wk-day, .qd) { position: relative; isolation: auto; --mk-h: 24px; --mk-fs: 15px; }
  .qd { --mk-h: 18px; --mk-fs: 11px; }
  :is(.cell, .wk-day, .qd, .ds-d).today { --mark: var(--today-ring); }
  :is(.cell, .wk-day, .qd).is-open, .ds-d.on { --mark: var(--sel-ring); }
  :is(.cell, .wk-day, .qd):is(.today, .is-open)::before, .ds-d:is(.today, .on)::before {
    content: ""; position: absolute; inset: 1px; z-index: 3; pointer-events: none; border-radius: 12px;
    border: 2px solid var(--mark); background: color-mix(in srgb, var(--mark) 12%, transparent); }
  .qd:is(.today, .is-open)::before { background: none; }
  :is(.cell, .wk-day, .qd).today::after {
    content: attr(data-d); position: absolute; inset: 1px auto auto 1px; z-index: 5; pointer-events: none;
    height: var(--mk-h); min-width: calc(var(--mk-h) + 4px); padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 12px 0 12px 0;
    background: var(--mark); color: var(--on-primary); font-size: var(--mk-fs); font-weight: 800; font-variant-numeric: tabular-nums; }
  /* Today's pill on the yellow selected-day ring: navy text. */
  :is(.cell, .wk-day, .qd).is-open.today::after { color: var(--navy); }
  :is(.cell.today .dnum, .cell.cc.today .cc-n, .wk-day.today .wk-num, .qd.today .qn) { opacity: 0; }
  .cell .cell-head, .month.compact .cell.cc > .cc-n { position: relative; z-index: 4; }
  .mo, .cs-lanes { z-index: 4; }
  .qd .qbar { position: relative; z-index: 4; }

  .ds-d.on .ds-w, .ds-d.on .ds-n { color: var(--on-surface); }
  .ds-d.on .ds-n { font-weight: 800; }
  /* Request details: the request form's layout, read-only. */
  .req-view .sect:first-child { border-top: 0; padding-top: 4px; }

  .req-who .idb { margin: 0; flex: none; }
  .req-who .req-name { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-who .badge { flex: none; }

  .req-view .cc-sum { margin: 12px 0 2px; }

  /* Sensitive settings: amber card = caution (Default PIN), red card = danger (Admin PIN). Tinted fill, toned border and heading icon. */
  .panel-warn { --tone: #d97706; } .panel-danger { --tone: #d92d20; }

  /* Stats bar: search pill · period segmented control · Inactive toggle. Phones: search on its own row, then the controls. */

  /* Request details footer: rows. Admin decision row (Deny · Approve, labeled, half width each) above Delete · Cancel · Edit. */

  .mf-row .btn.act.act-lbl .bl { display: inline; }

  /* Person filter active: Brewers yellow pill (desktop person pill + ✕, phone Filters button) so it's obvious the calendar is filtered to one person.

  .fp:not(.fp-conf):has(.fp-clear) .fperson, .fp:not(.fp-conf) .fp-clear, .fdrop-btn.fall.fp-active {
    background: var(--gold); border-color: var(--gold); color: var(--navy) !important; font-weight: 800; }
  .fp:not(.fp-conf) .fp-clear { border-left-color: color-mix(in srgb, var(--navy) 30%, transparent); }
  /* Clear filters: an outlined "✕ Clear" button at the end of the filters on wide screens; on phones a ✕ joined to the Filters button,

  .fall-clear { flex: none; }

  @media all {
    .filters > .fall:has(+ .fall-clear) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .filters > .fall-clear, .filters > .fall-clear:has(> .ic:first-child) { width: 44px; min-width: 44px; padding: 0; margin-left: -6px; border-radius: 0 20px 20px 0;

  }
  /* Collapsible band headers: the whole row toggles. */
  .rtable tr.grp-h, .rtable tr.grp-h th { cursor: pointer; user-select: none; }

  .idb-n:has(> .idb-t) { display: flex !important; align-items: center; }

  /* ---------- Profile → Notifications: push switch for this device + inbox ---------- */

  .y-m.y-now { border-color: var(--today-ring); box-shadow: inset 0 0 0 1px var(--today-ring); }
  .y-t { font-weight: 800; font-size: 14px; margin: 0 0 4px 2px; }
  .y-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
  .y-dw { font-size: 11px; font-weight: 800; color: var(--muted); }
  .y-d { height: 26px; display: grid; place-items: center; border: 0; padding: 0; border-radius: 6px; background: none; color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  button.y-d { cursor: pointer; font-weight: 800; }
  .y-today { box-shadow: inset 0 0 0 2px var(--today-ring); }
  .y-ap-leave { background: var(--leave); color: var(--leave-ink); }
  .y-ap-pass { background: var(--gold); color: var(--navy); }
  .y-pend { background: var(--rg-over); color: var(--rg-over-ink); }
  .y-den { background: var(--no-bg); color: var(--no-ink); }
  /* Nav bar: Brewers navy for everyone (dark in dark mode), Brewers metallic gold (#85714D) in admin mode. Light labels, yellow selection pill.
     --nav-bg is set on the bar itself so the badge rings and the home-indicator strip match its color. */
  :root { --brick: #7C2529; }
  .nav { --nav-bg: var(--navy); background: var(--nav-bg); border-top: 1px solid var(--nav-bg); }
  /* Admin mode: the same bar as everyone else, with a solid red line along its top edge (works in light and dark). */
  .nav.nav-admin { border-top: 3px solid #d92d20; }
  :root[data-theme="dark"] .nav { border-top-color: rgba(255, 255, 255, .14); }
  /* Dark mode: the regular nav bar is dark (not navy); admin mode stays metallic gold so it's still obvious. */
  :root[data-theme="dark"] .nav { --nav-bg: #1d1e24; }
  :root[data-theme="dark"] .nav button:not(.on):not([aria-expanded="true"]) { color: #c5c6d0; }
  .nav button { color: #c9d3e8; }
  .nav button.on { color: var(--navy); }
  .nav button:hover .nav-ic, .nav button.on .nav-ic, :root[data-theme="dark"] .nav button.on .nav-ic { background: transparent; color: inherit; }
  .nav .dot { background: var(--gold); color: var(--navy); }
  .nav .dot.warn { background: #ffffff; color: #c2410c; }
  .nav .nav-ic.syncing::after { border-color: rgba(255, 255, 255, .25); border-top-color: #ffffff; }
  .nav button.on .nav-ic.syncing::after { border-color: color-mix(in srgb, var(--navy) 25%, transparent); border-top-color: var(--navy); }
  /* Admin mode (metallic gold bar): the open page's pill is Brewers navy with a white icon, so it contrasts with the bar. */
  .nav.nav-admin button.on .nav-ic, :root[data-theme="dark"] .nav.nav-admin button.on .nav-ic { background: transparent; color: inherit; }
  .modal.modal-wide:has(.y-grid) { max-width: 1100px; }
  @media (min-width: 900px) { .y-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* My Requests: List | Calendar ("Cal" on phones) in the filter row, at every width. */
  .filters > .mine-mode { display: flex; flex: none; order: 3; }
  .filters > .mine-mode .seg { display: flex; }
  .filters > .mine-mode .seg button { padding: 0 14px; }
  .fs-sect .fs-conf { width: 100%; height: 44px; }
  .fs-help { margin: 6px 2px 0; font-size: 13.5px; color: var(--muted); }
  /* Year view: a divider before each January, spanning the whole grid. */
  .y-year { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 4px 0 -2px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
  .y-year::before, .y-year::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  .y-body .y-grid { margin-top: 0; }
  @media (max-width: 700px) { .y-grid { grid-template-columns: 1fr; } .y-d { height: 34px; font-size: 14px; } }
  /* Hide user schedules: days tinted by the member's position availability (same colors as Qtr). */
  .month:not(.compact) .cell.av-open, .month.compact .cell.cc.av-open, .wk-day.av-open { background-color: var(--av-open); }
  .month:not(.compact) .cell.av-over, .month.compact .cell.cc.av-over, .wk-day.av-over { background-color: var(--av-over); }
  .month:not(.compact) .cell.av-full, .month.compact .cell.cc.av-full, .wk-day.av-full { background-color: var(--av-full); }
  .cell.out.av-open, .cell.out.av-over, .cell.out.av-full { opacity: .75; }
  .day-avail { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 2px 0; }
  .day-avail i { width: 14px; height: 14px; border-radius: 4px; }
  .day-avail.av-open i { background: var(--av-open-dot, #22c55e); } .day-avail.av-over i { background: var(--av-over-dot, #f59e0b); } .day-avail.av-full i { background: var(--av-full-dot, #ef4444); }
  .cfg-row-tog { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .cfg-row-tog .chip-tog { flex: none; }
  .stats-bar .manage-btn { flex: none; }
  .manage-ct { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: var(--navy); font-size: 12px; display: inline-grid; place-items: center; }
  @media (max-width: 700px) { .stats-bar .manage-btn { padding: 0 14px 0 10px; } }
  .cfg-note { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; color: var(--warn); }
  /* Nav hover on the dark bars: labels stay light (white), the icon gets a faint light pill. */
  .nav button:not(.on):not([aria-expanded="true"]):hover { color: #ffffff; } /* only unselected items brighten their text */
  /* ---------- Blackout dates: brick diagonal stripes on every calendar, brick chips ---------- */
  :root { --bo-stripe: color-mix(in srgb, var(--brick) 26%, transparent); }
  :root[data-theme="dark"] { --bo-stripe: color-mix(in srgb, #e0645f 34%, transparent); }
  .month:not(.compact) .cell.bo, .month.compact .cell.cc.bo, .wk-day.bo, .slot.bo, .qd.bo, .mini-g button.bo, .mini-g > span.bo, .mk.mk-bo {
    background-image: repeating-linear-gradient(135deg, var(--bo-stripe) 0 5px, transparent 5px 10px); }
  .mk.mk-bo { box-shadow: inset 0 0 0 1px var(--brick); }
  .cfl.cfl-bo { background: var(--brick); color: #ffffff; }
  :root[data-theme="dark"] .cfl.cfl-bo { background: #e0645f; color: #17181d; }
  .bo-msg { align-items: center; } .bo-msg .btn { margin-left: auto; flex: none; }
  .bo-day { margin: 8px 0 0; }
  .bo-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; margin: 6px 0 12px; }
  .bo-row { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 12px; border-bottom: 1px solid var(--line); }
  .bo-row:last-child { border-bottom: 0; }
  .bo-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .bo-badge { background: var(--brick); color: #ffffff; margin-left: 4px; }
  .bo-n { color: var(--bad); }
  .bo-del { color: var(--error); }
  .bo-add { border-top: 1px solid var(--line); padding-top: 12px; }
  .bo-types .seg { display: flex; width: 100%; height: 44px; } .bo-types .seg button { flex: 1 1 0; }
  .note-prefs .push-btns .chip-tog { padding: 0 14px; }

  /* No CSS filter (drop-shadow) on the logo: iPhone Safari draws a filtered element as its own square layer whose colors
     don't match the gradient behind it, so a faint box showed around the patch and the patch looked washed out. */
  .splash .brand-logo { width: 120px; height: 120px; }
  .splash, .login { background: radial-gradient(120% 90% at 50% 0%, #1d3d6e 0%, var(--navy) 55%, #0a1a33 100%); }
  .login-card h1 + * { margin-top: 14px; }
  .login-card h1 { margin-top: 0; color: var(--navy); }
  :root[data-theme="dark"] .login-card h1 { color: #ffffff; }
  .login-card .linkbtn, .auth-alt .linkbtn { color: var(--brick); font-weight: 700; }
  :root[data-theme="dark"] .login-card .linkbtn, :root[data-theme="dark"] .auth-alt .linkbtn { color: var(--gold); }
  /* Loading (.logo-loading): the squadron logo NEVER spins. A brick arc sweeps around the white rim of the patch's inner
     circle (the disc with the bolt). The rim was fitted all the way round on the full-size logo: it's a very slightly tall
     ellipse, center 50.00% across / 44.87% down, white band from 39.71%–42.09% (across) and 40.01%–42.37% (down) of the
     logo's width. The ring shape covers the band plus a hair each side and stays still (a rotating ellipse would wobble
     off the rim); only the arc moves, by turning the conic gradient (--arc-a). Used on the splash, sign-in screens and
     the Submitting cover. */
  @property --arc-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .logo-loading { position: relative; }
  .logo-loading::after { content: ""; position: absolute; left: 7.61%; top: 2.20%; width: 84.78%; height: 85.34%; border-radius: 50%;
    background: conic-gradient(from var(--arc-a), var(--brick) 0deg 110deg, transparent 110deg 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent 92.9%, #000 93.1%); mask: radial-gradient(farthest-side, transparent 92.9%, #000 93.1%);

  /* Nav bar selection (Material 3 style, adapted): the active indicator is one rounded pill that holds BOTH the icon and

     The Profile tab also lights up while its drop-up menu is open. */
  .nav button::before { content: ""; position: absolute; inset: 0 1px; border-radius: 16px; background: transparent; transition: background-color .18s ease; }

  /* Caret: points UP while the menu is closed (it opens upward) and DOWN while it's open. */
  .nav-caret .ic { transform: rotate(180deg); transition: transform .18s ease; }
  .nav button[aria-expanded="true"] .nav-caret { transform: none; }
  .nav button[aria-expanded="true"] .nav-caret .ic { transform: rotate(0deg); }
  /* While the Profile drop-up is open, the page you're on keeps a muted pill (so Profile is the strong one). */
  .nav:has(button[aria-expanded="true"]) button.on:not([aria-expanded="true"])::before { background: rgba(255, 255, 255, .16); }
  .nav:has(button[aria-expanded="true"]) button.on:not([aria-expanded="true"]) { color: #ffffff; }
  /* Profile drop-up: a clearly raised surface — a visible outline, a stronger shadow, and in dark mode a lighter
     surface than the page so it doesn't melt into it. The notch matches. */
  .pm-pop { --pm-bg: var(--card); --pm-edge: var(--outline); background: var(--pm-bg); border: 1.5px solid var(--pm-edge);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 -10px 40px rgba(0, 0, 0, .35); }
  :root[data-theme="dark"] .pm-pop { --pm-bg: #2a2c34; --pm-edge: rgba(255, 255, 255, .32); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 -12px 44px rgba(0, 0, 0, .7); }
  .pm-pop .pm-row, .pm-pop .pm-theme { border-bottom-color: color-mix(in srgb, var(--pm-edge) 60%, transparent); }
  .pm-pop::after { background: var(--pm-bg); border-right: 1.5px solid var(--pm-edge); border-bottom: 1.5px solid var(--pm-edge); bottom: -8px; }
  /* Names inside a shared badge: a clear gap around the "·" separator. */
  .gbb .rp-dot { margin: 0 8px; }
  /* P / B / O day chips: solid red over the max, solid orange at the max, solid green with slots open. */
  .qc-day.over, .qc-day.over.ok { background: #b42318; border-color: #b42318; color: #ffffff; }
  .qc-day.full { background: #c2410c; border-color: #c2410c; color: #ffffff; }
  .qc-day.open { background: #15803d; border-color: #15803d; color: #ffffff; }
  /* Hovering the selected item keeps its text color; the pill just deepens a little. */
  .nav button.on:hover, .nav button[aria-expanded="true"]:hover { color: var(--navy); }
  .nav button.on:hover::before, .nav button[aria-expanded="true"]:hover::before { background: var(--gold-2); }
  .nav:has(button[aria-expanded="true"]) button.on:not([aria-expanded="true"]):hover { color: #ffffff; }
  .nav:has(button[aria-expanded="true"]) button.on:not([aria-expanded="true"]):hover::before { background: rgba(255, 255, 255, .22); }
  /* Saving ring on the Profile tab: the same brick arc as the logo loading ring, circling the patch icon. */
  .nav button[data-v="profile"] .nav-ic.syncing::after, .nav button[data-v="profile"].on .nav-ic.syncing::after,
  .nav button[data-v="profile"][aria-expanded="true"] .nav-ic.syncing::after {
    border-width: 3px; border-color: transparent; border-top-color: var(--brick); border-right-color: var(--brick); }
  #modal #passkey::placeholder { letter-spacing: normal; font-size: 16px; }
  .splash .splash-t { font-size: 24px; font-weight: 800; letter-spacing: .02em; color: #ffffff; } /* big and bold so it's obvious the app is loading */
  /* Requests table: status mark and name sit close together (no wide padding between them or after the marks). */
  .rtable th.st-ic-h, .rtable td.st-ic-c { width: 28px; padding: 0 0 0 10px; }
  .rtable td.stk { padding-left: 8px; padding-right: 10px; }
  .rtable th.stk { padding: 0; } .rtable th.stk .th-sort { padding-left: 8px; padding-right: 10px; } /* the header doesn't widen the column */
  .rtable td.stk .stk-in { gap: 8px; }
  .tbl-wrap.scrolled tr.t-leave td.stk, .tbl-wrap.scrolled tr.t-pass td.stk { padding-left: 12px; }
  /* Notifications inside the Profile drop-up: header (count + Clear all), the newest 3 with a ✕ each, "+N more". */
  .pm-notes { border-bottom: 1px solid color-mix(in srgb, var(--pm-edge, var(--line)) 60%, transparent); padding: 8px 0 4px; }
  .pm-nh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 16px 6px; font-weight: 800; font-size: 15px; }
  .pm-nh > span { display: inline-flex; align-items: center; gap: 10px; }
  .pm-nh .pm-ct { font-size: 12.5px; }
  .pm-clear { font-size: 14px; }
  .pm-nempty { padding: 2px 16px 10px 44px; color: var(--muted); font-size: 14px; }
  .pm-n { position: relative; display: flex; align-items: stretch; }
  .pm-n.unread { background: color-mix(in srgb, var(--sel-bg) 18%, transparent); }
  .pm-nb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 4px 8px 14px; border: 0; background: none; color: var(--ink);
    font: inherit; text-align: left; cursor: pointer; }
  .pm-nb:hover { background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
  .pm-nb .note-ic { width: 26px; height: 26px; }
  .pm-nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13.5px; line-height: 1.25; }
  .pm-nt b, .pm-nt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-nt span { color: var(--muted); }
  .pm-ago { flex: none; font-size: 12px; color: var(--muted); }
  .pm-nx { flex: none; width: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .pm-nx:hover { color: var(--ink); background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .pm-more { display: block; width: 100%; padding: 8px 16px; border: 0; background: none; text-align: left; font: inherit; font-weight: 800; font-size: 14px;
    color: var(--primary); cursor: pointer; }
  /* Full list (from "+N more"): fits the sheet — no bleed margins, ✕ in its own column. */
  .notes-drawer .notes-list { margin: 0; border-top: 0; }
  .notes-drawer .note-row { padding: 12px 52px 12px 14px; gap: 10px; }
  .notes-drawer .note-x { top: 50%; bottom: auto; transform: translateY(-50%); right: 4px; }
  .notes-drawer .notes-lh { padding: 8px 14px; }
  .notes-drawer .note-t span { overflow-wrap: anywhere; }
  /* Member card (Roster → tap a member): compact sections with small headings and short controls. */
  .mc-body { padding-top: 12px; }
  .mc-top { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .mc-top .idb { --tag: 26px; }
  .mc-who b { font-size: 18px; }
  .mc-sec { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mc-sec:last-child { border-bottom: 0; }
  .mc-sec h4 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .mc-sec h4 .meta { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 13px; }
  .mc-sum { margin-bottom: 8px; }
  .mc-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .mc-pin { margin-top: 8px; }
  .mc-pin[hidden] { display: none; }
  .mc-pin input { height: 40px; }
  .mc-sec .field { margin-bottom: 8px; }
  .mc-actions { margin-top: 4px; align-items: center; }
  /* Settings → About: server status pill. */
  .srv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700; }
  .srv-st { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; border: 0; font: inherit; font-size: 14px; font-weight: 800; color: #ffffff; }
  .srv-ok { background: #15803d; }
  .srv-bad { background: #b42318; cursor: default; }
  .srv-upd { background: var(--gold); color: var(--navy); cursor: pointer; }
  /* A shared bar carried over from last week starts exactly where other carried-over bars do (badges line up). */
  .evs.grp.end, .evs.grp.mid { padding-left: 11px !important; }
  /* Request review: the type is a big colored banner (Leave navy, Pass yellow), not a small badge. */
  .rv-type { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 14px; }
  .rv-type.rv-leave { background: var(--leave); color: #ffffff; }
  .rv-type.rv-pass { background: var(--gold); color: var(--navy); }
  :root[data-theme="dark"] .rv-type.rv-leave { box-shadow: inset 0 0 0 1.5px var(--navy-edge); }
  .rv-tt { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
  .rv-for { font-size: 15px; font-weight: 600; opacity: .9; overflow-wrap: anywhere; }
  /* A bar for more than one person always gets the shared (slashed) pattern — same-dates bars included — in
     Month (desktop and phone) and Week. */
  .evs.grp.leave, .cs-bar.grp.leave, .wpuck.grp.leave { background: repeating-linear-gradient(135deg, var(--leave) 0 6px, var(--leave-2) 6px 12px); }
  .evs.grp.pass, .cs-bar.grp.pass, .wpuck.grp.pass { background: repeating-linear-gradient(135deg, var(--gold) 0 6px, var(--gold-2) 6px 12px); }
  /* Request form "Request for" / "Add members": an inline multi-select dropdown under the button. */
  .who-wrap { position: relative; }
  .who-wrap .wiz-who { width: 100%; }
  .who-pop { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); display: flex; flex-direction: column; max-height: min(340px, 52vh);
    background: var(--card); border: 1.5px solid var(--outline); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .3); overflow: hidden; }
  :root[data-theme="dark"] .who-pop { background: #2a2c34; border-color: rgba(255, 255, 255, .28); }
  .who-pop[hidden] { display: none; }
  .who-search { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .who-search input { flex: 1; min-width: 0; height: 36px; border: 0; background: none; padding: 0; font-size: 16px; color: var(--ink); outline: none; }
  .who-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  .who-h { padding: 8px 14px 2px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .who-h[hidden], .who-row[hidden] { display: none; }
  .who-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 4px 14px; border: 0; background: none; color: var(--ink);
    font: inherit; text-align: left; cursor: pointer; }
  .who-row:hover { background: color-mix(in srgb, var(--on-surface) 7%, transparent); }
  .who-row.on { background: color-mix(in srgb, var(--sel-bg) 30%, transparent); }
  .who-ck { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--outline); display: grid; place-items: center; }
  .who-row.on .who-ck { background: var(--navy); border-color: var(--navy); color: #ffffff; }
  :root[data-theme="dark"] .who-row.on .who-ck { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .who-new .ic { flex: none; margin-left: 2px; }
  .who-none { padding: 12px 14px; color: var(--muted); }
  .wiz-who .who-n { flex: 0 0 auto !important; width: auto; }
  .wiz-who > span:not(.who-n):not(.idb) { flex: 1 1 auto; text-align: left; }
  /* Person filter: the same inline dropdown as "Request for" (search, tick several, tap outside to apply). */
  .fp { position: relative; }
  .fp-pop { right: auto; width: min(340px, calc(100vw - 24px)); }
  .fp-conf-row { flex: none; padding: 8px 12px 4px; }
  .fp-conf-row .conf-only.on { background: #b42318; border-color: #b42318; color: #ffffff; }
  .fperson .who-n, .fall .who-n { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
    background: var(--navy); color: #fff; font-size: 12.5px; font-weight: 800; }
  .evs.mid .evs-t .gsl { flex: none; font-weight: 900; color: #ffffff; opacity: .85; } .evs.mid.pass .evs-t .gsl { color: var(--navy); }
  /* Separator between badges on a shared bar: a dot (not a slash). */
  .gsl { font-size: 20px; line-height: 1; margin: 0 1px; }
  /* Request dialogs: the length is a big solid pill in the header — "4 days" — Leave navy / Pass yellow. */
  .hd-days { flex: none; display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .hd-days b { font-size: 22px; font-weight: 900; line-height: 1; }
  .hd-days.hd-leave { background: var(--leave); color: #ffffff; }
  .hd-days.hd-pass { background: var(--gold); color: var(--navy); }
  :root[data-theme="dark"] .hd-days.hd-leave { box-shadow: inset 0 0 0 1.5px var(--navy-edge); }
  .modal-h .hd-days + .btn { margin-left: 4px; }
  /* Requests table: marks sit with the status in the first column; the pinned Name column is narrow (long names "…"). */
  .rtable th.st-ic-h, .rtable td.st-ic-c { width: auto; min-width: 28px; padding: 0 2px 0 10px; text-align: left; }
  .rtable td.st-ic-c .st-in { display: flex; align-items: center; gap: 6px; }
  .rtable td.st-ic-c .cfl { margin: 0; flex: none; }
  .rtable td.stk { max-width: 9.5em; }
  .rtable td.stk .stk-in { min-width: 0; }
  .rtable td.stk .stk-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Requests tables size to their content (no forced 1240px), so on phones no column gets padded with spare space. */
  .rtable:not(.ptable) { min-width: 100%; width: max-content; }
  /* View switch icons (Week · Month · Qtr). */
  .calbar .cb-views .seg button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 0 12px; }
  /* Smooth paging between weeks / months: the calendar body slides; its frame clips it. */
  .cal-split { overflow: hidden; }
  #calBody { will-change: transform; }
  /* Blackout conflict resolver: the blackout on top, then a table-like list — a row per request (who · dates · status)
     with one joined strip of four equal choices under it (outlined, colored icons; no mixed filled shapes). */
  .bor-bo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--brick) 16%, transparent); color: var(--ink); }
  .bor-bo .ic { color: var(--brick); } :root[data-theme="dark"] .bor-bo .ic { color: #f09a95; }
  .bor-intro { margin: 10px 0 8px; color: var(--muted); font-size: 14.5px; }
