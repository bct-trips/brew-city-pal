    <meta name="mobile-web-app-capable" content="yes">
    <!-- "black" gives the iPhone status bar its own solid strip and starts the app below it. "black-translucent" made
         iOS blur the top of the page (to keep the clock readable) and sized the home-screen app short, leaving a
         blank band under the nav bar. Same fix as PiFire. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="126 PAL">
    <title>Brew City PAL</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="config.js?v=1792592715"></script>
    <script>
      /* Always the newest page, even in a home-screen app (iOS keeps its own copy of the page and resumes it without
         reloading). This page knows its build; version.json (fetched past every cache) holds the latest one.
         - Opening / refreshing the app: a newer build loads straight away (once per build per session: no loop).
         - Coming back to the open app: never reload on its own — tell the app ('pal-update'), which asks "Update now?"
           so nothing half-typed is lost. */
      window.PAL_BUILD = '1792592715';
      (function () {
        function check(launch) {
          try {
            fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
              if (!v || !v.build || v.build === window.PAL_BUILD) return;
              if (launch && /[?&]u=1(&|$)/.test(location.search)) return; // just reloaded for an update: never again on this load
              var k = 'pal.freshFor';
              if (sessionStorage.getItem(k) === v.build) return; // already loaded this build once in this session
              if (!launch) { document.dispatchEvent(new CustomEvent('pal-update', { detail: v.build })); return; }
              sessionStorage.setItem(k, v.build);
              location.replace(location.pathname + '?v=' + v.build + '&u=1' + location.hash);
            }).catch(function () {});
          } catch (e) {}
        }
        check(true);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(false); });
      })();
    </script>
    <style>
  :root {
    /* Brewers brand (teamcolorcodes.com): Leave = navy #12284B, Pass = yellow #FFC52F. */
    --navy: #12284B; --navy-2: #1b3d7a; --gold: #FFC52F; --gold-2: #e8ab12;
    /* Neutral grays: near-white calendar on a light gray canvas. */
    --bg: #e4e4e7; --card: #fafafa; --card-2: #f0f0f2; --ink: #18181b; --muted: #52525b;
    --line: #d0d0d6; --hatch: rgba(0, 0, 0, .08); --navy-3: #2c4f95; --gold-3: #ffd970; --navy-edge: #7f9ee0;
    --wknd: #f4f4f5; --out-bg: #ebebee; --denied-bg: #d4d4d8; --denied-2: #b8b8bf; --denied-ink: #27272a; --focus: #b4410c; --accent: var(--navy); --on-accent: #fff;
    --ok: #166534; --ok-bg: #dcfce7; --warn: #854d0e; --warn-bg: #fef3c7;
    --bad: #b42318; --bad-bg: #fee4e2; --pend: #1e40af; --pend-bg: #dbeafe;
    --leave: #12284B; --leave-2: #2b4a7e; --leave-ink: #ffffff; --leave-tint: #dde3ee; --leave-tint-ink: #12284B; --leave-pend: #b9c6dd; --leave-pend-ink: #12284B; --pass-pend: #ffe7a8;
    --line-strong: #c4c4cc;
    --thumb: #ffffff; --gold-mark: #ca8a04; --dot-ok: #15803d; --dot-pend: #b45309; --dot-bad: #dc2626;
    /* Brewers interface accents: navy outlines in light mode, gold in dark; Add Request is a gold tonal button. */
    --go: var(--navy); --go-tint: rgba(10, 35, 81, .08); --req-bg: rgba(253, 184, 39, .38); --req-bg-h: rgba(253, 184, 39, .55); --req-ink: var(--navy);
    --nav-bg: #ebebef; --nav-line: #d4d4d8; --nav-ink: #52525b; --nav-hover: #dcdce2;
    --nav-tone: rgba(10, 35, 81, .12); --nav-on: #0A2351;
    --nav-h: 68px; --bar-h: 23px; --head-h: 30px; --tag: 22px; --pill-h: 22px; --pill-fs: 12.5px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .08);

    color-scheme: light;
  }
  :root[data-theme="dark"] {

    --line: #3a3a40; --hatch: rgba(255, 255, 255, .06);
    --wknd: #1c1c20; --out-bg: #131316; --denied-bg: #52525b; --denied-2: #3f3f46; --denied-ink: #fafafa; --focus: #fde68a; --accent: var(--gold); --on-accent: var(--navy);
    --ok: #4ade80; --ok-bg: rgba(34, 197, 94, .14); --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .14);
    --bad: #fca5a5; --bad-bg: rgba(248, 113, 113, .16); --pend: #93c5fd; --pend-bg: rgba(96, 165, 250, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .45);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --line-strong: #46464e;
    --thumb: #34343b; --gold-mark: #FDB827; --dot-ok: #4ade80; --dot-pend: #fbbf24; --dot-bad: #f87171;

    --nav-bg: #26262b; --nav-line: #36363d; --nav-ink: #b4b4be; --nav-hover: #313137;
    --nav-tone: rgba(253, 184, 39, .16); --nav-on: #fcd34d;

  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  .ic { flex: none; display: block; }
  .muted { color: var(--muted); }
  .narrow { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* The app fills the whole screen with position: fixed (not 100vh / 100dvh): on iPhone home-screen apps those units
     leave a gap at the bottom. Safe areas are padded inside: status bar on top, home indicator in the nav. */
  html { height: 100%; overflow: hidden; }
  body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  .main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- Splash / login ---------- */
  .splash, .login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(120% 90% at 50% 0%, #163a7a 0%, var(--navy) 55%, #06142f 100%); color: #fff; padding: 16px; }
  .logo-mark { width: 64px; height: 64px; border-radius: 18px; background: var(--gold); color: var(--navy);
    display: grid; place-items: center; font-weight: 900; font-size: 22px; letter-spacing: .04em; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .login-card { width: 100%; max-width: 360px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
  .login-card h1 { margin: 10px 0 2px; font-size: 24px; letter-spacing: -.01em; }
  .login-card .sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .login-card .logo-mark { width: 48px; height: 48px; font-size: 17px; border-radius: 14px; }

  .auth-alt { margin-top: 14px; text-align: center; font-size: 14.5px; color: var(--muted); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--pend); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .auth-h { margin: 0 0 8px; font-size: 18px; }
  .auth-note { font-size: 14.5px; margin: 0 0 12px; color: var(--ink); }
  .chooser { display: flex; flex-direction: column; gap: 8px; }
  .login-card { max-width: 420px; }

  /* ---------- Bottom nav ---------- */
  /* Navigation bar in the style of Skeleton UI: an elevated surface one step off the
     calendar, rounded tiles, and a tonal highlight on the active tile
     (navy tone in light mode, gold tone in dark mode). */
  .nav { flex: none; display: flex; gap: 4px; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: var(--nav-bg); border-top: 1px solid var(--nav-line); z-index: 5; }
  .nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 0; border-radius: 12px; background: none; color: var(--nav-ink); font-size: 14px; font-weight: 600; letter-spacing: .01em;
    cursor: pointer; position: relative; padding: 0 2px; transition: background-color .15s ease, color .15s ease; }
  .nav .nav-ic { display: grid; place-items: center; }
  .nav button:hover { background: var(--nav-hover); color: var(--ink); }
  .nav button span:not(.nav-ic) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .nav button.on { background: var(--nav-tone); color: var(--nav-on); font-weight: 800; }
  .nav button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .nav .dot { position: absolute; top: 2px; left: calc(50% + 6px); box-shadow: 0 0 0 2px var(--nav-bg); min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
    background: #b42318; color: #fff; font-size: 12px; line-height: 16px; font-weight: 800; }

  /* ---------- Controls ---------- */
  /* Buttons, segmented buttons and filter controls live in one place: "Controls (Material 3)" further down. */

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }

  input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--card-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; min-width: 0; width: 100%; }
  select { padding-right: 6px; }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > label, .lbl { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .err { color: var(--bad); font-size: 14.5px; font-weight: 600; min-height: 0; }
  .err:empty { display: none; }
  @media (max-width: 640px) { input, select, textarea { font-size: 18px; } }

  /* ---------- Calendar shell ---------- */
  .cal { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .calbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  .calbar .grp { display: flex; align-items: center; gap: 4px; }
  .back-month { font-weight: 800; }
  .view-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--accent); color: var(--on-accent); padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; }
  .calbar .lbl-date, .cal-top .lbl-date { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--ink); cursor: pointer;
    font-weight: 800; font-size: 17px; letter-spacing: -.01em; padding: 4px 8px; border-radius: 8px; white-space: nowrap; min-width: 0; }
  .calbar .lbl-date:hover, .cal-top .lbl-date:hover { background: var(--card-2); }
  .calbar .lbl-date .ic, .cal-top .lbl-date .ic { color: var(--muted); }
  .modal.narrow-m { max-width: 360px; }
  .mp-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .mp-y { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mp-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mp-m { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }
  .mp-m:hover { border-color: var(--muted); }
  .mp-m.now { box-shadow: inset 0 0 0 2px var(--gold); }
  .mp-m.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .calbar .push { margin-left: auto; }
  .cal-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 6px; background: var(--bg); }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 4; }

  /* ---------- Material-style calendar controls ---------- */
  /* Outlined date navigator: [ ‹ | label ⌄ | › ] */
  .datenav { display: inline-flex; align-items: stretch; height: 40px; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; background: transparent; }
  .datenav > button { border: 0; background: none; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .datenav > button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .datenav > button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .datenav .dn-arrow { width: 44px; flex: none; }
  .datenav .dn-arrow:first-child { border-right: 1px solid var(--line-strong); }
  .datenav .dn-arrow:last-child { border-left: 1px solid var(--line-strong); }
  .datenav .lbl-date { gap: 6px; padding: 0 18px !important; border-radius: 0 !important; font-size: 17px; font-weight: 700; letter-spacing: -.01em; min-width: 0; }
  .datenav .lbl-date .ic { color: var(--muted); }
  .req-bar { display: none; flex: none; padding: 8px; background: var(--card); border-top: 1px solid var(--line); }
  .req-bar .req-btn { width: 100%; }
  @media (max-width: 700px) {
    .datenav { height: 38px; flex: 1 1 auto; min-width: 0; } .datenav .dn-arrow { width: 38px; } .datenav .lbl-date { padding: 0 10px !important; font-size: 15.5px; }
    .calbar .req-btn { display: none; }
    .req-bar { display: block; }
  }

  /* ---------- Month ---------- */
  .month { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); box-shadow: var(--shadow); border-top: 1px solid var(--line); position: relative; }
  .dow-row { flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--card-2); border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-align: center; padding: 5px 0; }
  .month-grid { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(var(--weeks), minmax(0, 1fr)); }
  .week-row { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); min-height: 0; }
  .week-row:last-child { border-bottom: 0; }
  .cell { position: relative; min-width: 0; min-height: 0; border-left: 1px solid var(--line); cursor: pointer; user-select: none; }
  .cell:first-child { border-left: 0; }
  .cell:hover { background-color: color-mix(in srgb, var(--gold) 8%, transparent); }
  .cell.wknd { background-color: var(--wknd); }
  /* Days outside the month: hatched and dimmed, but the date stays legible. */
  .cell.out { background-color: var(--out-bg); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 8px); }
  .cell.out .dnum { color: var(--muted); font-weight: 600; }
  .cell.sel { background-color: color-mix(in srgb, var(--gold) 26%, var(--card)); }
  .cell.sel-a { box-shadow: inset 0 0 0 3px var(--navy); }
  :root[data-theme="dark"] .cell.sel-a { box-shadow: inset 0 0 0 3px var(--gold); }
  .cell-head { height: var(--head-h); display: flex; align-items: center; gap: 4px; padding: 0 4px; min-width: 0; }
  .dnum { border: 0; background: none; cursor: pointer; font-size: 15px; font-weight: 800; min-width: 28px; height: 26px; padding: 0 7px; border-radius: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dnum:hover { background: var(--card-2); }
  /* Daily P/B markers in each day header. */
  .qday { margin-left: auto; display: inline-flex; gap: 3px; }
  .qc-day { height: 22px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
    font-size: 13px; font-weight: 800; line-height: 20px; font-variant-numeric: tabular-nums; cursor: help; white-space: nowrap; }
  .qc-day.zero { color: var(--muted); font-weight: 600; }
  .qc-day.full { border-color: var(--warn); color: var(--warn); }
  .qc-day.over { background: #b42318; border-color: #b42318; color: #fff; }
  .qc-day.over { cursor: pointer; }
  .qc-day.over.ok { background: #15803d; border-color: #15803d; color: #fff; }
  .qc-day:hover { border-color: var(--ink); }
  .cell.out .qc-day { opacity: .7; }
  .more { position: absolute; left: 3px; right: 3px; bottom: 1px; z-index: 3; height: 16px; white-space: nowrap; overflow: hidden; border: 0; background: var(--card); border-radius: 4px; text-align: left; padding: 0 4px;
    font-size: 13px; font-weight: 800; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .cell.out .more, .cell.wknd .more { background: transparent; }

  /* Overlay grid: bands and bars run edge-to-edge across day cells. */
  .mo { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    align-content: start; pointer-events: none; overflow: hidden; }
  .mo > * { pointer-events: auto; min-width: 0; }

  /* Absence segments. Start: rounded left + chevron right. Middle: notch left + chevron right.
     End: notch left + rounded right. Chevrons overhang into the next day's notch so a
     person's absence reads as one interlocking bar. */
  .evs { position: relative; align-self: start; height: var(--bar-h); line-height: var(--bar-h); margin-bottom: 2px; padding: 0 8px;
    font-size: 14px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  /* Name row is a flex line so the tag, name and unit badge sit on the bar's exact vertical center. */
  .evs-t { display: flex; align-items: center; height: 100%; min-width: 0; }
  .evs.mid .evs-t { justify-content: center; }
  .evs-t .ln, .wpuck .n .ln { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evs-t .idb { flex: none; }
  .un { display: inline-flex; align-items: center; }
  .dl-who { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 4px; }
  .dl-who .idb { margin-right: 2px; }
  .evs.leave { background: var(--leave); color: var(--leave-ink); }
  .evs.pass { background: var(--gold); color: var(--navy); }
  /* Left-aligned names start 15px from the day's left edge on every segment type (margin + padding),
     so P/B/O tags line up vertically down a column. */
  .evs.single { margin-left: 4px; margin-right: 4px; padding-left: 11px; border-radius: 4px; } /* same rounded rectangle as other bars */
  .evs.start { margin-left: 4px; margin-right: -7px; padding-left: 11px; padding-right: 16px; border-radius: 4px 0 0 4px; z-index: 1;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); }
  .evs.mid { margin-left: 1px; margin-right: -7px; padding: 0 16px 0 14px; text-align: center; z-index: 1;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%); }
  .evs.end { margin-left: 1px; margin-right: 4px; padding-left: 14px; border-radius: 0 4px 4px 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 9px 50%); }
  /* Several people mid-absence in one category: one hatched bar, names on a solid label. */
  .evs.multi { display: flex; align-items: stretch; gap: 4px; padding: 0 14px 0 12px; cursor: default; }
  .mseg { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 6px; border-radius: 3px; cursor: pointer; }
  .mseg.leave { background: var(--leave); color: var(--leave-ink); }
  .mseg.pass { background: var(--gold); color: var(--navy); }
  .mseg.st-denied { background: var(--denied-bg); color: var(--denied-ink); text-decoration: line-through; }
  .mseg:hover { filter: brightness(1.1); }
  .mseg:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .mo.has-focus .mseg:not(.focus) { opacity: .45; }
  .mseg.focus { font-weight: 800; }
  .evs.leave.multi { background: repeating-linear-gradient(135deg, var(--leave) 0 6px, var(--leave-2) 6px 12px); }
  .evs.pass.multi { background: repeating-linear-gradient(135deg, var(--gold) 0 6px, var(--gold-2) 6px 12px); }
  .evs.denied.multi { background: repeating-linear-gradient(135deg, var(--denied-bg) 0 6px, var(--denied-2) 6px 12px); color: var(--denied-ink); }
  /* Duplicate (same member, overlapping requests): thick red underline on the bar or name. */
  .badge.dup { margin-left: 4px; background: #b42318; border-color: #b42318; color: #fff; }
  /* Combined ID badge [P|MKE]: one chip, --tag tall, position square + unit section.
     Position squares: P = white, B = black, O = gray. */
  .idb { display: inline-flex; flex: none; align-items: stretch; height: var(--tag); margin-right: 6px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 1.5px #0b1730, 0 0 0 2.5px rgba(255, 255, 255, .7); vertical-align: middle; font-weight: 900; font-style: normal;
    line-height: 1; letter-spacing: .02em; text-decoration: none; }
  .idb > span { display: inline-flex; align-items: center; justify-content: center; font-size: var(--pill-fs); }
  .idb-r { width: var(--tag); flex: none; }
  .idb-p { background: #ffffff; color: #0b1730; }
  .idb-b { background: #0b0b0f; color: #ffffff; }
  .idb-o { background: #a1a1aa; color: #0b0b0f; }
  .idb-u { padding: 0 5px; border-left: 1.5px solid #0b1730; letter-spacing: .04em; }
  /* Person badge: name section is white with dark text on every bar, so names always read the same.
     Bars stay solid; status is a mark after the name on the first day (✓ / clock / ✕); denied grays and strikes the name. */
  .idb.pb { flex: 0 1 auto; min-width: 0; max-width: 100%; margin-right: 0; }
  .idb-n { min-width: 0; padding: 0 7px; background: #ffffff; color: #0b1730; border-left: 1.5px solid #0b1730; font-weight: 800; letter-spacing: 0;
    font-size: calc(var(--tag) * .72) !important; justify-content: flex-start !important; overflow: hidden; }
  .idb-n { display: block !important; line-height: var(--tag); white-space: nowrap; text-overflow: ellipsis; }
  /* Status mark after the name on the first day. */
  .sti { display: inline-flex; vertical-align: -2px; margin-left: 5px; text-decoration: none; }
  .sti .ic { stroke-width: 3; }
  .sti-ok { color: #15803d; } .sti-pend { color: #b45309; } .sti-no { color: #dc2626; }
  .sti-chg { color: #c2410c; }
  .badge.chg { margin-left: 4px; background: #c2410c; border-color: #c2410c; color: #fff; }
  .nav .dot.warn { background: #c2410c; left: calc(50% - 22px); }
  .chg-msg .btn { margin-left: 6px; vertical-align: middle; }
  .chg-note { display: flex; gap: 10px; align-items: flex-start; margin: 8px; padding: 10px 12px; border-radius: 10px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid currentColor; font-size: 14.5px; }
  .chg-note b { color: var(--ink); }
  .idb.pb.st-denied .idb-n { background: #e4e4e7; color: #3f3f46; text-decoration: line-through; }
  .evs-t .idb.pb { flex: 0 1 auto; }
  td .idb, .dl-who .idb, .rrow .idb, .keypop .idb { box-shadow: 0 0 0 1.5px #0b1730; }
  /* Unit badges. Each style has its own fill; a ring in a contrasting color keeps it visible on bars. */
  /* Same height as the P/B/O tag (--tag) wherever they appear together. */
  .ub { display: inline-flex; align-items: center; flex: none; box-sizing: border-box; height: var(--tag); line-height: 1; padding: 0 5px; margin-right: 6px; border-radius: 4px;
    font-size: var(--pill-fs); font-weight: 900; letter-spacing: .04em; vertical-align: middle; text-decoration: none; font-style: normal; white-space: nowrap;
    box-shadow: 0 0 0 1.5px var(--ub-ring, #fff); }
  .ub-navy { background: #0A2351; color: #fff; }
  .ub-gold { background: #FFB612; color: #111; --ub-ring: #111; }
  .ub-crimson { background: #9f1239; color: #fff; }
  .ub-teal { background: #0f766e; color: #fff; }
  .ub-purple { background: #6b21a8; color: #fff; }
  .ub-slate { background: #334155; color: #fff; }
  .ub-orange { background: #c2410c; color: #fff; }
  .ub-black { background: #111111; color: #fff; }
  .ub-green { background: #166534; color: #fff; }
  td .ub, .dl-who .ub, .uhead .ub, .rrow .ub, .ub-prev .ub { box-shadow: none; }
  td .ub, .uhead .ub, .ub-prev .ub { margin-right: 0; }
  .ub-prev { min-width: 64px; }
  /* Pending: a lighter tint of the category color (no marker), applied the same way everywhere.
     In shared hatched bars, pending names are italic. */
  /* Denied: neutral gray with strike-through instead of fading, so text keeps full contrast. */
  .evs.st-denied, .wpuck.st-denied { background: var(--denied-bg) !important; color: var(--denied-ink) !important; text-decoration: line-through; }
    .evs:hover, .wpuck:hover { filter: brightness(1.1); }
  /* Focused request: everything else steps back so its single line stands out. */
  .mo.has-focus .evs:not(.focus) { opacity: .45; }
  .evs.focus { font-weight: 800; z-index: 3; }

  /* ---- Middle-day bars: one badge per position ---- */
  /* The strip clips overflow, so give the badges' outer outline (2.5px) room on the left. */
  .evs.mid { padding-left: 11px !important; }
  .evs.mid .evs-t { justify-content: flex-start; gap: 6px; overflow: hidden; padding-left: 3px; }
  .idb.rp { flex: 0 1 auto; }
  .rp-dot { margin: 0 5px; opacity: .55; font-weight: 900; }
  .rp-more { font-weight: 800; }
  .mn { cursor: pointer; border-radius: 2px; }
  .mn:hover { text-decoration: underline; }
  .mn:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .mn.st-denied { text-decoration: line-through; }
  .mo.has-focus .mn:not(.focus) { opacity: .5; }
  .mn.focus { font-weight: 900; }
  .evs.mid.st-denied { text-decoration: line-through; }

  .evs:focus-visible, .wpuck:focus-visible, .puck:focus-visible { clip-path: none; outline: 3px solid var(--focus); outline-offset: 1px; z-index: 4; }

  /* ---------- 4-month quadrant ---------- */
  .quad { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 0 0 8px; }
  .qmonth { min-height: 0; display: flex; flex-direction: column; background: var(--card); box-shadow: var(--shadow); border-top: 1px solid var(--line); }
  .qh { flex: none; text-align: left; border: 0; background: var(--card-2); border-bottom: 1px solid var(--line); padding: 6px 10px;
    font-size: 16px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .qh:hover { text-decoration: underline; text-underline-offset: 3px; }
  .qg { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .qwrow { flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .qw { font-size: 13px; font-weight: 800; letter-spacing: .06em; color: var(--muted); text-align: center; padding: 3px 0; border-bottom: 1px solid var(--line); text-transform: uppercase; }
  .qd { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 3px 0 3px;
    border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; background: var(--card); }
  .qd:nth-child(7n + 1) { border-left: 0; }
  .qd.wknd { background: var(--wknd); }
  .qd.blank { background: var(--out-bg); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 8px); cursor: default; }
  .qd:not(.blank):hover { background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
  .qd.sel { background: color-mix(in srgb, var(--gold) 26%, var(--card)); }
  .qd.over::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent #b42318 transparent transparent; }
  .qn { align-self: flex-start; margin-left: 3px; border: 0; background: none; padding: 0 5px; min-width: 24px; height: 22px; border-radius: 9px; font-size: 14px; font-weight: 700;
    color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
  .qd.open .qn { color: var(--muted); font-weight: 600; }
  /* Full-bleed strips: Leave always on the top line, Pass on the second, so a multi-day
     absence reads as one continuous band across the week. */
  .qm { display: flex; flex-direction: column; gap: 2px; }
  .qs { display: block; height: 19px; line-height: 19px; padding: 0 5px; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qs.leave { background: var(--leave); color: var(--leave-ink); }
  .qs.pass { background: var(--gold); color: var(--navy); }
  .qd { container-type: inline-size; }
  .qs .q-long { display: none; }
  @container (min-width: 96px) { .qs .q-short { display: none; } .qs .q-long { display: inline; } }
  .qopen { display: block; height: 40px; line-height: 40px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  @media (max-width: 760px) {
    .quad { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: minmax(300px, auto); overflow-y: auto; }
  }

  /* ---------- Filter dropdowns ---------- */
  .fsel { width: auto; min-height: 38px; border-color: var(--line-strong); background-color: transparent; padding: 5px 30px 5px 10px; font-size: 14.5px; font-weight: 700; border-radius: 9px; background-color: var(--card-2); }
  .fsel.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background-color: color-mix(in srgb, var(--accent) 12%, transparent); }


  /* Multi-select filters: chips on wide screens, checkbox dropdowns on narrow ones. */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .fdrop { display: none; position: relative; }
  .fdrop-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; cursor: pointer; text-align: left; }
  .fdrop-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fdrop-pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 170px; padding: 6px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); }
  .fdrop-pop[hidden] { display: none; }
  .fchk { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .fchk:hover { background: var(--card-2); }
  .fchk input { width: 18px; height: 18px; accent-color: var(--navy); }
  @media (max-width: 1100px) {
    .fchips { display: none; }
    .fdrop { display: block; }
  }

  /* ---------- Compact (phone) month ---------- */
  .month.compact .cell.cc { display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 4px 3px; border: 0; border-left: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .month.compact .cell.cc:first-child { border-left: 0; }
  .month.compact .cell.cc.out { background-color: var(--out-bg); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 8px); }
  .month.compact .cell.cc.out .cc-n { color: var(--muted); }
  .month.compact .cell.cc.unused::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 12px 12px 0; border-color: transparent #b42318 transparent transparent; }
  .cc-n { font-size: 15px; font-weight: 800; padding-left: 2px; }
  .day-groups { max-width: 900px; }

  .cf-state { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; border-radius: 10px; font-weight: 700; }
  .cf-state.cf-bad { background: var(--bad-bg); color: var(--bad); } .cf-state.cf-ok { background: var(--ok-bg); color: var(--ok); }
  .cf-note { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
  .cf-note.cf-bad { background: var(--bad-bg); color: var(--bad); } .cf-note.cf-ok { background: var(--ok-bg); color: var(--ok); }
  .cf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .cf-row .dl-who { flex: 1 1 200px; }
  .cf-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }

  /* MacroFactor-style P / B / O meters */
  .rm { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .rm-t { display: flex; align-items: baseline; gap: 3px; font-size: 11.5px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rm-t b { font-weight: 900; color: var(--rm); }
  .rm-c { font-weight: 800; color: var(--ink); }
  .rm-q { color: var(--muted); font-weight: 600; }
  .rm-bar { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .rm-bar i { display: block; height: 100%; border-radius: 2px; background: var(--rm); }
  .rm-p { --rm: #0d9488; } .rm-b { --rm: #7c3aed; } .rm-o { --rm: #64748b; }
  :root[data-theme="dark"] .rm-p { --rm: #2dd4bf; } :root[data-theme="dark"] .rm-b { --rm: #a78bfa; } :root[data-theme="dark"] .rm-o { --rm: #94a3b8; }
  .rm.full .rm-bar i { background: #d97706; }
  .rm.over .rm-bar i { background: #dc2626; }
  .rm.over .rm-c { color: #dc2626; }
  :root[data-theme="dark"] .rm.over .rm-c { color: #f87171; }
  .rm.zero .rm-t { opacity: .55; }
  .month.compact .cell.cc { gap: 4px; }
  .month.compact .cell.cc .rm-t { font-size: 11px; }
  /* Day view: three meters in a row */
  .rm-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); }
  .rm.lg .rm-t { font-size: 17px; gap: 5px; }
  .rm.lg .rm-bar { height: 6px; }

  /* ---------- Week ---------- */
  .week { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); box-shadow: var(--shadow); border-top: 1px solid var(--line); }
  .g7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .wk-head { flex: none; background: var(--card-2); border-bottom: 1px solid var(--line); }
  .wk-day { padding: 5px 2px 6px; text-align: center; border-left: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .wk-day:first-child { border-left: 0; }
  .wk-day:hover { background: color-mix(in srgb, var(--gold) 10%, transparent); }
  .wk-dow { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
  .wk-num { font-size: 22px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .wk-date { font-size: 13px; color: var(--muted); }
  .wk-q { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 6px; font-size: 13px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .wk-q .over { color: #fff; background: #b42318; border-radius: 4px; padding: 0 4px; }
  .bands { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .band { flex: 1 1 0; min-height: 84px; display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
  .band:last-child { border-bottom: 0; }
  .band-title { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .1em;
    color: var(--muted); background: var(--card-2); border-bottom: 1px solid var(--line); }
  .band-title .ct { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; letter-spacing: 0; }
  .band-body { flex: 1; min-height: 0; overflow-y: auto; }
  .band-inner { position: relative; min-height: 100%; }
  .band-slots { position: absolute; inset: 0; }
  .slot { border-left: 1px solid var(--line); cursor: pointer; } /* plain: only blackout days (.slot.bo) are slashed */
  .slot:first-child { border-left: 0; }
  .slot:hover { background-color: color-mix(in srgb, var(--gold) 8%, transparent); }
  .slot.sel { background-color: color-mix(in srgb, var(--gold) 24%, transparent); }
  .band-pucks { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 4px 0; padding: 6px 0; pointer-events: none; }
  .wpuck { pointer-events: auto; min-width: 0; margin: 0 4px; padding: 4px 8px; border-radius: 9px; cursor: pointer; line-height: 1.25; box-shadow: var(--shadow-sm); }
  .wpuck.leave { background: var(--leave); color: var(--leave-ink); }
  .wpuck.pass { background: var(--gold); color: var(--navy); }
    .wpuck.cont-l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .wpuck.cont-r { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .wpuck .n { display: flex; align-items: center; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wpuck .s { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Day ---------- */
  .dayv { flex: 1; min-height: 0; overflow-y: auto; background: var(--card); box-shadow: var(--shadow); border-top: 1px solid var(--line); }
  .dayv-in { padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px; }
  .dayv h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .dayv .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .meter { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .meter .mt { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--muted); }
  .meter .mv { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
  .meter .mv small { font-size: 15px; color: var(--muted); font-weight: 700; }
  .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; background: var(--ok); border-radius: 3px; }
  .meter.full .fill { background: var(--warn); } .meter.over .fill { background: var(--bad); }
  .meter.over .mv { color: var(--bad); }
  .empty { padding: 26px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px;
    background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 9px); }

  /* ---------- Pages / pucks ---------- */
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  .toolbar .title { font-weight: 800; font-size: 17px; padding: 0 4px; white-space: nowrap; }
  .toolbar .search { position: relative; flex: 1 1 180px; min-width: 140px; }
  .toolbar .search .ic { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .toolbar .search input { padding-left: 30px; }
  .toolbar select { width: auto; flex: 0 1 auto; padding: 6px 8px; font-size: 15px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px 18px; }
  .list { display: flex; flex-direction: column; gap: 8px; max-width: 1200px; margin: 0 auto; }
  .count { font-size: 14px; color: var(--muted); font-weight: 600; padding: 0 2px; }

  /* ---------- Requests table ---------- */
  .tbl-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tbl-count { flex: none; padding: 6px 12px; font-size: 14.5px; font-weight: 600; color: var(--muted); background: var(--bg); }
  .tbl-wrap { flex: 1; min-height: 0; overflow: auto; background: var(--card); }
  .panel .tbl-wrap { max-height: 60vh; border: 1px solid var(--line); border-radius: 10px; }
  .rtable { width: 100%; min-width: 1240px; border-collapse: separate; border-spacing: 0; font-size: 15.5px; }
  .rtable thead th { position: sticky; top: 0; z-index: 2; background: var(--card-2); border-bottom: 2px solid var(--line); text-align: left; padding: 0;
    font-size: 13.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .rtable thead th:not(:has(button)) { padding: 11px 12px; }
  .th-sort { display: flex; align-items: center; gap: 4px; width: 100%; padding: 11px 12px; border: 0; background: none; color: inherit; font: inherit;
    letter-spacing: inherit; text-transform: inherit; cursor: pointer; text-align: left; }
  .th-sort:hover, .th-sort.on { color: var(--ink); }
  .th-sort .arr { font-size: 11px; min-width: 9px; }
  .th-sort.sub { color: var(--ink); }
  .th-sort.sub .arr { opacity: .55; }
  .th-sort .lvl { display: inline-grid; place-items: center; min-width: 16px; height: 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 11px; letter-spacing: 0; }
  .rtable td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .rtable tbody tr { cursor: pointer; }
  .rtable tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--card-2) 55%, var(--card)); }
  .rtable tbody tr:hover td { background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
  .rtable tbody tr:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .rtable tr.st-denied td:not(.acts-cell) { color: var(--muted); }
  .rtable tr.st-denied .strong { text-decoration: line-through; }
  .rtable .strong { font-weight: 800; }
  .rtable .num { font-variant-numeric: tabular-nums; }
  .rtable .days { font-weight: 800; display: inline-block; min-width: 20px; }
  .rtable .flag { display: inline-flex; vertical-align: middle; margin-left: 4px; padding: 2px; border-radius: 4px; }
  .rtable .flag.caution { background: var(--warn-bg); color: var(--warn); }
  .rtable .flag.conflict { background: var(--bad-bg); color: var(--bad); }
  .rtable td.note { white-space: normal; min-width: 180px; max-width: 340px; color: var(--ink); }
  .rtable td.note .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rtable .th-acts, .rtable .acts-cell { position: sticky; right: 0; background: var(--card); }
  .rtable thead .th-acts { background: var(--card-2); z-index: 3; }
  .rtable .acts-cell { box-shadow: -1px 0 0 var(--line); }
  .row-acts { display: flex; gap: 4px; }
  .row-acts .btn { gap: 4px; }
  .btn.del { color: var(--bad); }
  /* On phones the action column would cover most of the screen, so let it scroll with the row. */
  @media (max-width: 760px) { .rtable .th-acts, .rtable .acts-cell { position: static; box-shadow: none; } }
  .ptable { min-width: 1140px; }
  .rtable th.num .th-sort { justify-content: flex-end; text-align: right; }
  .ptable td.num { text-align: right; padding-right: 16px; }
  .ptable .ok-t { color: var(--ok); font-weight: 700; } .ptable .bad-t { color: var(--bad); font-weight: 700; } .ptable .pend-t { color: var(--pend); font-weight: 700; }
  .rtable tfoot td { position: sticky; bottom: 0; background: var(--card-2); border-top: 2px solid var(--line); padding: 9px 10px; }
  .ptable tfoot td.num { padding-right: 16px; text-align: right; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .chk input { width: 16px; height: 16px; }
  .empty-row td { text-align: center; padding: 28px; color: var(--muted); cursor: default; }

  .puck { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--leave); border-radius: 12px; padding: 9px 12px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer; box-shadow: var(--shadow-sm); min-width: 0; }
    .puck.t-pass { border-left-color: var(--gold); }
  .puck:hover { border-color: var(--muted); }
  .puck.st-denied, .puck.st-cancelled { background: var(--card-2); }
  .puck .r1, .puck .r2 { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; min-width: 0; }
  .who { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .badge.t-leave { background: var(--leave); border-color: var(--leave); color: var(--leave-ink); }
    .badge.t-pass { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .badge.conflict { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
  .badge.caution { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  /* Status chips: neutral surface + full-contrast text; status color is a dot (≥3:1 against the chip). */
  .badge.ok, .s-approved, .s-pending, .s-denied { background: var(--card-2); border-color: var(--line-strong); color: var(--ink); }
  .s-approved::before, .s-pending::before, .s-denied::before, .badge.ok::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .s-approved::before, .badge.ok::before { background: var(--dot-ok); }
  .s-pending::before { background: var(--dot-pend); }
  .s-denied::before { background: var(--dot-bad); }
  .s-cancelled { text-decoration: line-through; }
  .dates { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta { font-size: 14.5px; color: var(--muted); white-space: nowrap; }
  .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); opacity: .6; }
  .acts { margin-left: auto; display: flex; gap: 6px; }
  @media (max-width: 640px) { .sep { display: none; } .acts { margin-left: 0; width: 100%; } .acts .btn { flex: 1; } }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; max-width: 1200px; margin: 0 auto 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow-sm); }
  .stat .k { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat.leave { border-top: 3px solid var(--leave); } .stat.pass { border-top: 3px solid var(--gold); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-sm); max-width: 1200px; margin: 0 auto 12px; width: 100%; }
  .panel h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .roster { display: flex; flex-direction: column; }
  .rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rrow:first-child { border-top: 0; }
  .rrow .who { flex: 1 1 200px; }
  .rrow.off { background: var(--card-2); } .rrow.off .who { color: var(--muted); }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(4, 12, 28, .55); backdrop-filter: blur(2px); animation: fade .12s ease-out; }
  .modal { width: 100%; max-width: 520px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden;
    background: var(--card); color: var(--ink); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.35); animation: pop .14s ease-out; }
  .modal.modal-wide { max-width: 620px; }
  .modal-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal-h h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
  .modal-b { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
  .modal-f { flex: none; display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--card-2); }
  .modal-f .btn { flex: 1; padding: 9px 12px; }
  .sect { padding: 12px 0; border-top: 1px solid var(--line); }
  .sect:first-child { border-top: 0; padding-top: 0; }
  .sect > .lbl { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  @media (max-width: 640px) {
    .overlay { align-items: flex-end; padding: 0; }
    .modal { max-width: none; border-radius: 18px 18px 0 0; max-height: 94dvh; }
    .modal-f { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }

  .uhead { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .uhead .nm { font-weight: 800; font-size: 18px; }
  .unlocked { display: inline-flex; align-items: center; gap: 5px; background: var(--ok-bg); color: var(--ok); font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 999px; }

  /* ---------- Day list ---------- */
  .dl-q { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .dl-q .pill.over { background: #b42318; border-color: #b42318; color: #fff; }
  .dl-sec { margin-bottom: 14px; }
  .dl-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
    padding-bottom: 6px; border-bottom: 2px solid var(--line); margin-bottom: 4px; }
  .dl-h .sw { width: 14px; height: 14px; border-radius: 4px; }
  .dl-h.leave .sw { background: var(--leave); } .dl-h.leave { border-bottom-color: var(--leave); }
  .dl-h.pass .sw { background: var(--gold); } .dl-h.pass { border-bottom-color: var(--gold); }
  .dl-h.denied .sw { background: var(--denied-bg); }
  .dl-h .ct { margin-left: auto; background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; letter-spacing: 0; }
  .dl-list { list-style: none; margin: 0; padding: 0; }
  .dl-row { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    background: none; padding: 8px 4px; cursor: pointer; color: var(--ink); }
  .dl-row:hover { background: var(--card-2); }
  .dl-who { flex: 1 1 220px; font-size: 16px; }
  .dl-meta { font-size: 14.5px; color: var(--muted); }
  .dl-none { padding: 8px 4px; color: var(--muted); font-size: 15px; }

  /* ---------- Request details: conflict summary and tapped-day detail ---------- */
  .cc-sum { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin: 2px 0 10px; }
  .cc-sum.bad { color: var(--bad); } .cc-sum.ok { color: var(--ok); }
  .cc-detail:empty { display: none; }
  .cc-detail { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .cc-dh { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  .cc-why { margin: 4px 0; font-size: 14px; font-weight: 600; color: var(--bad); }
  .tip { position: fixed; z-index: 100; display: none; max-width: 320px; padding: 8px 10px; border-radius: 8px; background: #18181b; color: #fafafa;
    font-size: 13.5px; font-weight: 600; line-height: 1.35; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); pointer-events: none; }
  :root[data-theme="dark"] .tip { background: #fafafa; color: #18181b; }

  /* ---------- Wizard ---------- */
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps div { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .steps div::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
  .steps div.on { color: var(--ink); } .steps div.on::before, .steps div.done::before { background: var(--gold); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { text-align: left; border: 2px solid var(--line); background: var(--card-2); border-radius: 14px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .choice b { font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .choice small { color: var(--muted); font-size: 14px; line-height: 1.35; }
  .choice .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .choice.on.leave { border-color: var(--leave-2); background: color-mix(in srgb, var(--leave) 12%, var(--card)); }
    .choice.on.pass { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--card)); }
  .newuser { background: var(--card-2); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 12px 2px; margin-top: 8px; }
  .mini { border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 4px 0 10px; }
  .mini-h { display: flex; align-items: center; justify-content: space-between; font-weight: 800; margin-bottom: 4px; }
  .mini-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
  .mini-g .dw { font-size: 13px; font-weight: 800; color: var(--muted); padding: 2px 0; }
  .mini-g button { border: 0; background: none; height: 38px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini-g button:hover { background: var(--card-2); }
  .mini-g button.out { color: var(--muted); font-weight: 500; }
  .dur { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; margin-bottom: 8px; }
  .msgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; font-weight: 600; padding: 8px 10px; border-radius: 10px; }
  .msg.e { background: var(--bad-bg); color: var(--bad); } .msg.w { background: var(--warn-bg); color: var(--warn); } .msg.i { background: var(--ok-bg); color: var(--ok); }
  .review { display: flex; flex-direction: column; gap: 10px; }
  .rv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card-2); }
  .rv .lbl { margin-bottom: 4px; display: block; }
  .rv .big { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .rv .note { white-space: pre-wrap; overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  .kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
    pointer-events: none; transition: .18s ease; z-index: 80; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast > div { display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #toast .error { background: #991b1b; }
  #toast .hint-t { background: var(--gold); color: var(--navy); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .calbar { gap: 5px; padding: 5px 6px; }
    .calbar .lbl-date, .cal-top .lbl-date { font-size: 16px; flex: 1; }
    .calbar .lbl-date, .cal-top .lbl-date { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .meters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .meter { padding: 6px 8px; } .meter .mt span:last-child { display: none; } .meter .mv { font-size: 20px; margin: 0 0 4px; }
    .dayv .top > div:last-child { width: 100%; } .dayv .top .btn { flex: 1; }
    .calbar .push { margin-left: 0; }
    .seg button { padding: 5px 8px; font-size: 14px; }
    .pill { font-size: 12.5px; padding: 3px 7px; }
    :root { --bar-h: 20px; --head-h: 24px; }
    .evs, .wpuck { --tag: 15px; --pill-fs: 10px; }
    .evs { font-size: 13px; padding: 0 4px; } .mseg { padding: 0 4px; }
    .evs.start, .evs.single { padding-left: 7px; } .evs.start { padding-right: 11px; } .evs.mid { padding: 0 11px 0 10px; } .evs.end { padding-left: 10px; } .evs.multi { padding: 0 10px; }
    .un, .evs .idb-u, .mseg .idb-u { display: none; }
    .wide { display: none; } .narrow { display: inline; }
    .qc-day { font-size: 11px; padding: 0 2px; height: 15px; line-height: 13px; } .qc-day:not(.over) { display: none; }
    .more { padding: 0 3px; font-size: 13px; }
    .wk-num { font-size: 18px; }
    .wpuck { padding: 3px 5px; margin: 0 2px; } .wpuck .n { font-size: 13px; } .wpuck .s { display: none; }
  }


  /* ---------- One pill spec everywhere ----------
     Every pill/badge/chip is the same height (--pill-h), 4px radius, same type size and weight.
     Inside calendar bars the height drops to fit the bar (--tag 18px) but the shape is identical. */
  .badge, .pill, .qc-day { box-sizing: border-box; display: inline-flex; align-items: center; gap: 5px; height: var(--pill-h); padding: 0 8px;
    border-radius: 4px; font-size: var(--pill-fs); font-weight: 800; line-height: 1; white-space: nowrap; vertical-align: middle; }
  .idb, .ub { height: var(--tag); border-radius: 4px; }
  .evs, .wpuck, .mo { --tag: 18px; --pill-fs: 11.5px; }
  .ub-prev .ub, td .ub, .uhead .ub { margin-right: 0; }
  @media (max-width: 640px) {
    .evs, .wpuck, .mo { --tag: 15px; --pill-fs: 10px; }
    .qc-day { height: 16px; padding: 0 3px; font-size: 10.5px; }
  }

  /* =====================================================================
     Design system (Material 3 principles, Brewers palette)
     - Color roles: primary = Brewers navy, secondary container = Brewers gold,
       surfaces = white / near-white; dark mode uses the tonal equivalents
       (primary tone 80, containers tone 30) so contrast holds.
     - Buttons: one height (40px; 32px dense in tables), fully rounded, 15px/600 label,
       18px leading icon, 8% hover / 10% focus+press state layer.
       Variants: filled (primary), filled success (Add Request), tonal (secondary),
       tonal success / error (Approve / Deny), outlined (default), text (ghost / destructive text).
     - Selection (segmented buttons, filter chips, nav): secondary container + check.
     ===================================================================== */
  :root {
    --primary: #0A2351; --on-primary: #ffffff; --primary-container: #dbe2f9; --on-primary-container: #0A2351;
    --secondary: #7a5a00; --secondary-container: #FDB827; --on-secondary-container: #261a00;
    --success: #1e6b35; --on-success: #ffffff; --success-container: #c9eed1; --on-success-container: #00210c;
    --error: #b3261e; --on-error: #ffffff; --error-container: #f9dedc; --on-error-container: #410e0b;
    --surface: #ffffff; --surface-low: #f6f7fb; --surface-mid: #eef0f6; --surface-high: #e6e8f0;
    --on-surface: #1a1b20; --on-surface-variant: #464851; --outline: #767883; --outline-variant: #c6c7d0;
    --bg: var(--surface-mid); --card: var(--surface); --card-2: var(--surface-low); --ink: var(--on-surface); --muted: var(--on-surface-variant);
    --line: var(--outline-variant); --line-strong: var(--outline); --accent: var(--primary); --on-accent: var(--on-primary);
    --nav-bg: var(--surface-low); --nav-line: var(--outline-variant); --nav-ink: var(--on-surface-variant);
    --focus: #1b4fd1;
    /* Selected state: a pale Brewers-navy tonal fill (a solid navy fill means Leave). Selected (open) day ring = Brewers yellow. */
    --sel-bg: #d3dcec; --sel-ink: #12284B; --sel-ring: #FFC52F;
    /* Filled go / stop (Add Request, Approve, Deny, conflict). All text pairs ≥ 4.5:1. */
    --go-bg: #1e6b35; --go-ink: #ffffff; --no-bg: #b3261e; --no-ink: #ffffff;
  }
  :root[data-theme="dark"] {
    --primary: #b4c5ff; --on-primary: #0f2a63; --primary-container: #2a3f70; --on-primary-container: #dbe2ff;
    --secondary: #FDB827; --secondary-container: #4f3b00; --on-secondary-container: #ffdf9e;
    --success: #86d99a; --on-success: #00391a; --success-container: #0f5227; --on-success-container: #a3f5b4;
    --error: #ffb4ab; --on-error: #690005; --error-container: #93000a; --on-error-container: #ffdad6;
    --surface: #17181d; --surface-low: #1d1e24; --surface-mid: #111216; --surface-high: #292a31;
    --on-surface: #e4e3ea; --on-surface-variant: #c5c6d0; --outline: #8f909a; --outline-variant: #44464f;
    --nav-bg: #1d1e24; --focus: #ffd37a;
    --sel-bg: #d3dcef; --sel-ink: #12284B; --sel-ring: #FFC52F;
    --go-bg: #86d99a; --go-ink: #17181d; --no-bg: #ffb4ab; --no-ink: #17181d;
  }

  /* ---- Buttons ---- */
  .btn { position: relative; overflow: hidden; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; min-height: 40px; padding: 0 24px; border-radius: 20px; border: 1px solid var(--outline); background: transparent; color: var(--on-surface);
    font-size: 15px; font-weight: 600; letter-spacing: .01em; line-height: 1; white-space: nowrap; cursor: pointer; transition: box-shadow .15s ease; }
  .btn:has(> .ic:first-child) { padding-left: 16px; }
  .btn .ic { width: 18px; height: 18px; }
  .btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s ease; z-index: -1; }
  .btn:hover::before { opacity: .08; }
  .btn:focus-visible::before, .btn:active::before { opacity: .10; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn:hover { border-color: var(--outline); }
  .btn:disabled { opacity: 1; cursor: not-allowed; background: color-mix(in srgb, var(--on-surface) 12%, transparent); border-color: transparent; color: color-mix(in srgb, var(--on-surface) 38%, transparent); }
  .btn:disabled::before { display: none; }
  .btn.sm { height: 32px; min-height: 32px; padding: 0 14px; border-radius: 16px; font-size: 13.5px; gap: 6px; }
  .btn.sm:has(> .ic:first-child) { padding-left: 10px; }
  .btn.sm .ic { width: 16px; height: 16px; }
  .btn.block { width: 100%; }
  /* Icon button (Material 3 "standard icon button"): 40×40 circle, no outline, centered 20px icon. */
  .btn.icon-btn, .btn.icon-btn:has(> .ic:first-child) { width: 40px; min-width: 40px; height: 40px; padding: 0; gap: 0; justify-content: center;
    border-color: transparent; background: transparent; border-radius: 50%; color: var(--on-surface-variant); }
  .btn.icon-btn .ic { width: 20px; height: 20px; margin: 0; }
  .btn.icon-btn:hover { border-color: transparent; }
  /* filled */
  .btn.primary, :root[data-theme="dark"] .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .btn.req-btn, .req-bar .req-btn { height: 40px; padding: 0 24px 0 16px; gap: 6px; border-radius: 20px; background: var(--go-bg); border-color: var(--go-bg); color: var(--go-ink); font-size: 15px; font-weight: 600; }
  .btn.req-btn:hover { box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  /* filled approve / deny */
  .btn.ok { background: var(--go-bg); border-color: var(--go-bg); color: var(--go-ink); }
  .btn.bad { background: var(--no-bg); border-color: var(--no-bg); color: var(--no-ink); }
  /* outlined (default) */
  .btn.today-btn { padding: 0 24px; }
  /* Today is "selected" whenever the view includes today. */
  .btn.today-btn.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 800; }
  /* text */
  .btn.ghost { border-color: transparent; background: transparent; color: var(--primary); }
  .btn.del { border-color: transparent; color: var(--error); }
  .modal-h .btn.ghost.icon-btn { color: var(--on-surface-variant); }
  .linkbtn { color: var(--primary); }

  /* ---- Segmented buttons (view switch, filter chips) & date navigator: 40px, fully rounded, outline ---- */
  .seg, .calbar .seg { height: 40px; padding: 0; gap: 0; border: 1px solid var(--outline); border-radius: 20px; background: transparent; overflow: hidden; }
  .seg { display: inline-flex; }
  .seg button { position: relative; height: 100%; min-height: 0; padding: 0 16px; border: 0; border-radius: 0; background: none; color: var(--on-surface);
    font-size: 14.5px; font-weight: 600; line-height: 1.2; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--outline); }
  /* Selected segment: tonal fill + bold text, no checkmark (widths never change). */
  .seg button.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 800; }
  .seg button.on + button.on { border-left-color: color-mix(in srgb, var(--sel-ink) 30%, transparent); }
  .seg button:not(.on):hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); color: var(--on-surface); }
  .seg.full { display: flex; }
  .seg.full button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 8px; }
  .datenav { height: 40px; border: 1px solid var(--outline); border-radius: 20px; }
  .datenav .dn-arrow:first-child { border-right-color: var(--outline); } .datenav .dn-arrow:last-child { border-left-color: var(--outline); }
  .datenav > button { color: var(--on-surface); }
  .fsel, .fdrop-btn { height: 40px; min-height: 40px; border: 1px solid var(--outline); border-radius: 20px; background-color: transparent; color: var(--on-surface); font-weight: 600; padding: 0 14px 0 16px; }
  .fsel.on, .fdrop-btn.on { background-color: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 800; }
  .fdrop-pop, .modal, .keypop { background: var(--surface); }
  .fchk input { accent-color: var(--primary); }

  /* ---- Navigation bar: surface container, gold secondary-container indicator pill ---- */
  .nav { background: var(--nav-bg); border-top: 1px solid var(--outline-variant); }
  .nav button { color: var(--on-surface-variant); background: none !important; border-radius: 0; font-weight: 600; }
  .nav button .nav-ic { width: 64px; height: 32px; border-radius: 16px; transition: background-color .2s ease; }
  .nav button:hover .nav-ic { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .nav button.on { color: var(--on-surface); font-weight: 800; }
  .nav button.on .nav-ic { background: var(--sel-bg); color: var(--sel-ink); }
  .nav button:focus-visible { outline: none; } .nav button:focus-visible .nav-ic { outline: 3px solid var(--focus); outline-offset: 1px; }

  /* ---- Today: the ring + date pill is the "Day marker" block at the end of this file. Small date grids only get an outline. ---- */
  .mini-g button.today { box-shadow: inset 0 0 0 1px var(--primary); }
  .cell.sel-a, :root[data-theme="dark"] .cell.sel-a { box-shadow: inset 0 0 0 2px var(--primary); }

  /* Shared middle-day bar (2+ people): diagonal slash pattern in the type color; badges stay solid on top. */
  .evs.mid.shared.leave { background: repeating-linear-gradient(135deg, var(--leave) 0 6px, var(--leave-2) 6px 12px); }
  .evs.mid.shared.pass { background: repeating-linear-gradient(135deg, var(--gold) 0 6px, var(--gold-2) 6px 12px); }
  .evs.mid.shared.denied { background: repeating-linear-gradient(135deg, var(--denied-bg) 0 6px, var(--denied-2) 6px 12px) !important; }


  /* Leave / Pass toggle buttons: two separate pills, each independently on/off.
     On = filled in its bar color (white on leave blue 6.7:1, navy on pass gold 8.8:1); off = outlined. */
  .tchips { display: inline-flex; gap: 8px; }
  .tchip { position: relative; overflow: hidden; isolation: isolate; height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid var(--outline);
    background: transparent; color: var(--on-surface); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tchip::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; z-index: -1; transition: opacity .15s ease; }
  .tchip:hover::before { opacity: .08; }
  .tchip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .tchip.on { font-weight: 700; }
  .tchip-leave.on { background: var(--leave); border-color: var(--leave); color: #ffffff; }
  .tchip-pass.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }


  /* ---------- Calendar bar layout ----------
     Wide screens: [view · Today · Add Request]   [ ‹ date › ] centered   [status · position · Leave|Pass] */
  .cb-left, .cb-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .cb-center { display: flex; justify-content: center; }
  .cb-right { margin-left: auto; }
  @media (min-width: 1101px) {
    /* Equal side columns keep the date exactly centered; side groups wrap to a second line if they run out of room. */
    .calbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 12px; }
    .cb-left { justify-self: start; }
    .cb-center { justify-self: center; }
    .cb-right { justify-self: stretch; justify-content: flex-end; margin-left: 0; }
  }
  @media (min-width: 1680px) {
    .cb-left, .cb-right { flex-wrap: nowrap; }
  }
  /* Phones: date + Today on top, then view switch, then filters */
  /* Phones: row 1 date picker (full width) · row 2 view switch + Today · row 3 filters. Add Request is the bar under the calendar. */
  @media (max-width: 700px) {
    .cb-left, .cb-right, .cb-center { display: contents; }
    .calbar .datenav { order: 1; flex: 1 1 100%; }
    .calbar .back-month { order: 2; }
    .calbar .cb-views > .seg { order: 3; flex: 1 1 auto; }
    .calbar .cb-views > .seg button { flex: 1; padding: 0 8px; }
    .calbar .today-btn { order: 4; }
    .calbar .filters > * { order: 5; }
  }
  /* Leave / Pass button group: joined like the other groups; each side fills with its bar color when on. */
  .seg.tgroup .tchip { height: 100%; border: 0; border-radius: 0; padding: 0 18px; }
  .seg.tgroup .tchip + .tchip { border-left: 1px solid var(--outline); }
  .seg.tgroup .tchip-leave.on { background: var(--leave); color: #ffffff; }
  .seg.tgroup .tchip-pass.on { background: var(--gold); color: var(--navy); }
  .seg.tgroup .tchip.on + .tchip.on { border-left-color: transparent; }

  /* Right side: status, position and Leave/Pass packed together against the right edge. */
  .cb-right { justify-content: flex-end; }
  /* Phones: the three filters share one row. */
  @media (max-width: 700px) {
    .calbar .filters > .fdrop, .calbar .filters > .tgroup { flex: 1 1 0; min-width: 0; }
    .calbar .filters .fdrop-btn { width: 100%; padding: 0 8px 0 12px; font-size: 13.5px; }
    .calbar .filters .tgroup { display: flex; height: 40px; }
    .calbar .filters .tgroup .tchip { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 13.5px; }
    /* Filters get their own full-width row that never wraps; view switch + Today share the row above. */
    .calbar .cb-right.filters { display: flex; order: 5; flex: 1 1 100%; flex-wrap: nowrap; gap: 6px; min-width: 0; }
    .calbar .filters > * { order: 0; }
    .calbar .cb-views > .seg { min-width: 0; }
    .calbar .cb-views > .seg button { min-width: 0; padding: 0 6px; }
    .calbar .back-month, .calbar .today-btn { flex: none; }
  }

  /* ---------- Day view: week strip, day summary, Leave / Pass sections ---------- */
  .dayv { display: flex; flex-direction: column; }
  .dstrip { display: flex; align-items: center; gap: 4px; padding: 10px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
  .ds-arrow { flex: none; width: 40px; height: 56px; display: grid; place-items: center; border: 0; border-radius: 12px; background: none; color: var(--on-surface, var(--ink)); cursor: pointer; }
  .ds-arrow:hover { background: var(--card-2); }
  .dstrip { justify-content: center; }
  .ds-days { flex: 0 1 760px; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 760px; margin: 0 auto; }
  .ds-d { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 12px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .ds-d:hover { background: var(--card-2); }
  .ds-w { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .ds-n { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .ds-dots { display: flex; gap: 3px; height: 6px; }
  .ds-dots i { width: 6px; height: 6px; border-radius: 50%; }
  .ds-dots .lv { background: var(--leave); } .ds-dots .ps { background: var(--gold); } .ds-dots .ov { background: var(--bad); }
  .ds-d.today .ds-n, .ds-d.today .ds-w { color: var(--primary); }
  .dsum { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .dsum-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
  .dsum-h .muted { font-weight: 600; letter-spacing: .02em; text-transform: none; font-size: 14px; color: var(--muted); }
  .dsum .rm-grid { border: 0; background: none; padding: 0; }
  .dayv .dayv-in { padding: 0 14px; gap: 8px; }
  .dayv .dayv-in:not(:empty) { padding: 12px 14px 0; }
  .day-groups { padding: 12px 0 20px; }
  .day-groups .empty { padding: 24px 14px; color: var(--muted); text-align: center; }
  .day-groups .dl-sec { margin: 0 0 12px; }
  .day-groups .dl-h { margin: 0; padding: 0 14px; height: 40px; border: 0; justify-content: center; position: relative; font-size: 13.5px; letter-spacing: .1em; }
  .day-groups .dl-h .sw { display: none; }
  .day-groups .dl-h .ct { position: absolute; right: 14px; background: rgba(0, 0, 0, .18); border: 0; color: inherit; }
  .day-groups .dl-h.leave { background: var(--leave); color: #fff; }
  .day-groups .dl-h.pass { background: var(--gold); color: var(--navy); }
  .day-groups .dl-h.denied { background: var(--card-2); color: var(--muted); }
  .day-groups .dl-list, .day-groups .dl-none { padding: 0 14px; }
  .day-groups .dl-row { padding: 12px 4px; }

  /* Phone Day view: [‹ Back] [+ Add Request] share the bottom bar; the top-bar Month button is hidden there. */
  @media (max-width: 700px) {
    .req-bar { display: flex; gap: 8px; }
    .req-bar .req-btn { flex: 1; width: auto; }
    .req-bar .back-btn { flex: none; }
    .calbar .back-month { display: none; }
  }


  /* ---------- Person filter: dropdown-style button + picker sheet ---------- */
  .fp { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .fp .fperson { flex: 1 1 auto; min-width: 0; max-width: 200px; }
  .fp-clear { flex: none; }
  .fp.in-drop { width: 100%; margin: 2px 0 0; } .fp.in-drop .fperson { max-width: none; display: flex; }
  .fdrop-sep { margin: 6px 8px 4px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 1100px) { .fp.wide-only { display: none; } }
  .pp-sheet { max-width: 440px; height: min(640px, calc(100dvh - 32px)); }
  .pp-search { flex: none; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .pp-search .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--outline); border-radius: 22px; color: var(--muted); }
  .pp-search input { flex: 1; min-width: 0; height: 100%; border: 0; padding: 0; background: transparent; color: var(--on-surface); font-size: 16px; outline: none; }
  .pp-list { padding: 4px 0 12px; }
  .pp-h { position: sticky; top: 0; z-index: 1; padding: 12px 16px 6px; background: var(--surface); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pp-row { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 6px 16px; border: 0; background: transparent; color: var(--on-surface); font: inherit; font-size: 16px; text-align: left; cursor: pointer; }
  .pp-row:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .pp-row:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .pp-row.on { background: color-mix(in srgb, var(--sel-bg) 16%, transparent); }
  .pp-row .idb { margin-right: 0; }
  .pp-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-ck { flex: none; width: 24px; display: grid; place-items: center; color: var(--primary); }
  .pp-row[hidden], .pp-g[hidden] { display: none; }
  .pp-none { padding: 24px 16px; color: var(--muted); text-align: center; }
  @media (max-width: 640px) { .pp-sheet { height: 88dvh; } }

  /* ---------- Qtr view cells: P / B / O meters, or one person's Leave / Pass bars ---------- */
  .qd { justify-content: flex-start; gap: 4px; }
  .quad:not(.q-person) .qm { padding: 0 5px 2px; gap: 3px; margin-top: auto; }
  .quad .qm .rm-t { font-size: 11px; }
  .quad .qm .rm-bar { height: 3px; }
  .qbar { display: block; height: 20px; line-height: 20px; padding: 0 6px; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; margin: 0 -1px; }
  .qbar.leave { background: var(--leave); color: #ffffff; }
  .qbar.pass { background: var(--gold); color: var(--navy); }
  .qbar.st-denied { background: var(--denied-bg); color: var(--denied-ink); text-decoration: line-through; }
  .qbar.b-s { margin-left: 4px; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .qbar.b-e { margin-right: 4px; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  @media (max-width: 760px) {
    .quad { grid-auto-rows: auto; }
    .quad .qmonth { min-height: auto; }
    .quad .qg { flex: none; grid-auto-rows: minmax(78px, auto); }
    .quad .qd { overflow: hidden; }
  }

  /* Phones: request actions (Approve / Deny / Edit / Delete) become icon-only circular buttons — see DESIGN.md §Buttons. */
  @media (max-width: 700px) {
    .btn.act, .btn.act:has(> .ic:first-child) { width: 40px; min-width: 40px; height: 40px; padding: 0; gap: 0; border-radius: 50%; flex: none; }
    .btn.act.sm, .btn.act.sm:has(> .ic:first-child) { width: 36px; min-width: 36px; height: 36px; }
    .btn.act .bl { display: none; }
    .btn.act .ic { width: 20px; height: 20px; }
    .btn.act.del { border: 1px solid var(--outline); color: var(--error); }
    .modal-f:has(.btn.act) { gap: 10px; }
    /* In the dialog footer they are icon-only pills that share the width equally. */
    .modal-f .btn.act, .modal-f .btn.act:has(> .ic:first-child) { flex: 1 1 0; width: auto; border-radius: 20px; }
  }
  /* Phone dialog footers: Delete / Deny / Approve are 40px icon circles; Cancel and Edit (.act-lbl) keep their words as pills sharing the rest.
     If the footer is too tight (admin: five buttons), Edit drops to a circle too — Cancel never does. */
  @media (max-width: 700px) {
    .modal-f .btn.act:not(.act-lbl), .modal-f .btn.act:not(.act-lbl):has(> .ic:first-child) { flex: none; width: 40px; padding: 0; border-radius: 50%; }
    .modal-f .btn.act.act-lbl .bl { display: inline; }
    .modal-f .btn.act.act-lbl, .modal-f .btn.act.act-lbl:has(> .ic:first-child) { gap: 6px; padding: 0 14px; }
