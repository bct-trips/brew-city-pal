    const gs = D.weekStart(ms);
    const weeks = Math.ceil((D.dow(ms) + D.diff(ms, D.addMonths(ms, 1))) / 7);
    const reqs = calRequests();
    let html = '<div class="month"><div class="dow-row">' + DOW.map(d => '<div>' + d + '</div>').join('') + '</div>' +
      '<div class="month-grid" id="monthGrid" style="--weeks:' + weeks + '">';
    weekCarry = new Map(); // request id -> lane in the week above, so bars that carry over keep their order
    for (let w = 0; w < weeks; w++) html += renderMonthWeek(D.add(gs, w * 7), month, reqs);
    weekCarry = null;
    return html + '</div></div>';
  }

  // Segments that continue an absence already on screen are placed before new ones.
  const cont = sg => (sg.kind === 'mid' || sg.kind === 'end') ? 1 : 0;
  // Vertical stacking order on the calendar: a focused request first, then Leave, Pass, and denied
  // requests last. Within a type, bars that include you sort first.
  /** Stacking order: Leave, Pass, then added event types, denied last (a real array — the lane packer concatenates it). */
  const stackList = () => typeNames().concat(['Denied']);
  function pinnedIds() {
    const ids = [];
    if (S.focus && IDX.live.some(r => r.id === S.focus)) ids.push(S.focus);
    return ids;
  }
  // Your own requests (and shared bars that include you) always take the top lanes, so you can always see when you're out.
  const stackOrder = () => pinnedIds().map(id => 'pin:' + id).concat(['me'], stackList());
  // Only a focused request is lifted out of the shared middle-day bars; your own requests merge like everyone
  // else's (one bar per type) and are simply sorted first within their type.
  const isPinned = r => r.id === S.focus;
  const hasMe = sg => sg.people.some(r => r.userId === S.me) ? 1 : 0;
  const stackCat = r => isPinned(r) ? 'pin:' + r.id : r.userId === S.me ? 'me' : r.status === 'Denied' ? 'Denied' : r.type;
  const stackRank = r => r.id === S.focus ? -2 : r.userId === S.me ? -1 : stackList().indexOf(r.status === 'Denied' ? 'Denied' : r.type);
  const byLast = (a, b) => lastName(userOf(a.userId)).localeCompare(lastName(userOf(b.userId)));

  /** Requests with the same dates and type (not denied, not the focused one) share one bar: "[P|MKE|Smith] / [B|PIT|Jones]".
   *  Returns { groups: [[r, r, …], …] (2+ people each), solo: [r, …] }. */
  function sameDateGroups(reqs) {
    const by = new Map();
    reqs.forEach(r => {
      if (r.status === 'Denied' || isPinned(r)) return;
      const k = r.type + '|' + r.start + '|' + r.end;
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(r);
    });
    const groups = [...by.values()].filter(g => g.length > 1).map(g => g.slice().sort(byLast));
    const inGroup = new Set(groups.flat().map(r => r.id));
    return { groups, solo: reqs.filter(r => !inGroup.has(r.id)) };
  }
  /** One shared bar's label. People with the same position AND unit share one badge — [P|MKE|Ilich, N · Ilich, L] —
   *  and different position/unit pairs get their own badge, separated by "/". Each name opens that person's request. */
  function groupBadges(list, withStatus, from, to) {
    const buckets = [];
    // You first: your own request leads its badge, and the badge that includes you comes first.
    const meFirst = (a, b) => (a.userId === S.me ? 0 : 1) - (b.userId === S.me ? 0 : 1);
    list = list.slice().sort(meFirst);
    const allIds = list.map(r => r.id).join(','); // "… +N" lists everyone on the shared request
    // A shared puck (more than one person): any tap opens the list of everyone on it; one person: their request.
    const tapAttr = r => list.length > 1 ? 'data-act="groupList" data-ids="' + esc(allIds) + '"' : 'data-act="openReq" data-id="' + esc(r.id) + '"';
    list.forEach(r => {
      const u = userOf(r.userId), k = (u.role || 'Other') + '|' + u.unit;
      const b = buckets.find(x => x.k === k);
      if (b) b.list.push(r); else buckets.push({ k, u, list: [r] });
    });
    return buckets.map(b => {
      if (b.list.length === 1) {
        const r = b.list[0];
        return '<span class="gb" role="button" tabindex="0" ' + tapAttr(r) + ' title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' +
          personBadge(r, withStatus, from, to) + '</span>';
      }
      const L = roleL(b.u.role), un = unitsList().find(x => x.code === b.u.unit), r0 = b.list[0];
      const same = b.list.every(r => r.status === r0.status);
      // At most three names, then "… +N" (hover the bar for everyone).
      const shown = b.list.slice(0, 3), extra = b.list.length - shown.length;
      const names = shown.map(r => '<span class="mn" role="button" tabindex="0" ' + tapAttr(r) + ' title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' +
        barMarks(r) + esc(calName(userOf(r.userId))) + nowDot(r, from, to) + (withStatus && !onNow(r, from, to) ? statusIcon(r.status) : '') + '</span>').join('<span class="rp-dot" aria-hidden="true">·</span>') +
        (extra ? '<span class="rp-dot" aria-hidden="true">·</span><span class="mn mn-more" role="button" tabindex="0" data-act="groupList" data-ids="' + esc(allIds) + '" title="Show all ' + list.length + '" aria-label="Show everyone on this request (' + list.length + ')">… +' + extra + '</span>' : '');
      return '<span class="idb pb gbb' + (same ? ' st-' + r0.status.toLowerCase() : '') + '"><span class="idb-r ' + roleCls(b.u.role) + '" aria-hidden="true">' + L + '</span>' +
        '<span class="idb-u ub-' + (un ? un.style : 'slate') + '" aria-hidden="true">' + esc(b.u.unit) + '</span>' +
        '<span class="idb-n">' + names + '</span></span>';
    }).join('<span class="gsl" aria-hidden="true">·</span>');
  }
  /** Everyone on a shared request: every request visible on the calendar (current filters) with the same type and dates as
   *  the puck you tapped — across ALL positions, even when Week shows them in separate bands — in sections by position
   *  (Pilots, Booms, then the rest A–Z), you first within yours. Tap a person for their request. */
  function openGroupList(ids) {
    const picked = ids.map(findReq).filter(Boolean);
    if (!picked.length) return;
    const r0 = picked[0];
    const seen = new Set();
    const list = picked.concat(calRequests().filter(r => r.status !== 'Denied' && r.type === r0.type && r.start === r0.start && r.end === r0.end))
      .filter(r => !seen.has(r.id) && seen.add(r.id));
    const roles = [...new Set(list.map(r => userOf(r.userId).role))].sort((a, b) => posRank(a).localeCompare(posRank(b)));
    const row = r => { const u = userOf(r.userId);
      return '<li><button class="dl-row" data-act="openReq" data-id="' + esc(r.id) + '" aria-label="' + esc(describe(r)) + '">' +
        '<span class="dl-who">' + idBadge(u) + nameHtml(u) + '</span>' +
        '<span class="badge s-' + r.status.toLowerCase() + '">' + r.status + '</span></button></li>'; };
    const sections = roles.map(role => {
      const rs = list.filter(r => userOf(r.userId).role === role).sort((a, b) => (a.userId === S.me ? 0 : 1) - (b.userId === S.me ? 0 : 1) || byPosName(a, b));
      return '<div class="dl-sec"><div class="dl-h"><span>' + esc(roleGroup(role)) + '</span><span class="ct">' + rs.length + '</span></div><ul class="dl-list">' + rs.map(row).join('') + '</ul></div>';
    }).join('');
    const html = modalHead(esc(r0.type) + ' · ' + list.length + (list.length === 1 ? ' person' : ' people'), 'users') +
      '<div class="modal-b"><p class="meta" style="margin:0 0 8px">' + esc(D.short(r0.start)) + ' → ' + esc(D.short(r0.end)) + ' · ' + plural(D.days(r0.start, r0.end), 'day') + '</p>' + sections + '</div>' +
      '<div class="modal-f"><button class="btn block" data-act="closeModal">Close</button></div>';
    openModal('group', html);
  }
  /** Month bars for one week row. Every request is ONE unbroken bar across its days in this row (its badge at the left).
   *  Requests with the same dates and type share one slashed bar. Bars are never split into shared middle stretches. */
  function monthSegments(ws, reqs) {
    const we = D.add(ws, 6);
    const all = reqs.filter(r => r.start <= we && r.end >= ws);
    const { groups, solo } = sameDateGroups(all);
    const seg = (list, group) => {
      const r0 = list[0], first = r0.start >= ws, last = r0.end <= we;
      const cat = isPinned(r0) ? stackCat(r0) : list.some(r => r.userId === S.me) ? 'me' : stackCat(r0);
      return { kind: first && last ? 'single' : first ? 'start' : last ? 'end' : 'mid', group, cat, type: r0.type,
        a: D.diff(ws, D.max(r0.start, ws)), b: D.diff(ws, D.min(r0.end, we)), people: list, ws };
    };
    return groups.map(g => seg(g, true)).concat(solo.map(r => seg([r], false)));
  }

  /* Phone month view: no names (they can't fit) — each day shows a blue Leave count and a gold Pass count.
     Tap a day for Day view with everyone listed. */
  /* MacroFactor-style meter: letter, "count/max", thin bar. Each position has its own color;
     the bar and number turn red when the daily max is exceeded. */
  function roleMeter(role, c, size) {
    const q = quota(role), over = q && c > q, full = q && c === q;
    const pct = q ? Math.min(100, c / q * 100) : Math.min(100, c * 25);
    return '<span class="rm rm-' + roleKey(role) + (over ? ' over' : full ? ' full' : '') + (c ? '' : ' zero') + (size ? ' ' + size : '') + '"' + roleVar(role) + ' title="' + esc(rolePl(role)) + '">' +
      '<span class="rm-t"><span class="rm-l ' + roleCls(role) + '">' + esc(roleL(role)) + '</span><span class="rm-c">' + c + '</span>' + (q ? '<span class="rm-q">/' + q + '</span>' : '') + '</span>' +
      '<span class="rm-bar"><i style="width:' + pct + '%"></i></span></span>';
  }
  /** Leave slots used per position on a day: Leave only (passes have no daily max), honoring the
   *  status and person filters but not the Leave/Pass toggle, so the meters always show slot usage. */
  function filteredRoleCounts(d) {
    const out = { Pilot: 0, Boom: 0, Other: 0 };
    IDX.live.forEach(r => {
      if (r.type !== 'Leave' || r.start > d || r.end < d || !countable(r) || !S.f.status.includes(r.status) || (S.f.person && !personIds(S.f).includes(r.userId))) return;
      out[userOf(r.userId).role]++;
    });
    return out;
  }
  /* Phone month view: each day shows P / B / O meters (count vs daily max) for the current filters.
     Tap a day for Day view with everyone listed. */
  /* Phone month view: event strips like the Week view. Each request is one bar per week row, labeled with the
     person puck [P|MKE|Lastname ✓] at the start of the bar in each row. Up to 3 lanes per row; extra people on a day show "+N".
     Tap a day (or "+N") for Day view; tap a bar to open the request. */
  function renderMonthCompact() {
    if (S.monthMode === 'stats' && !S.priv) return renderMonthStats(); // no P / B / O stats when schedules are hidden
    const ms = D.monthStart(S.cursor), month = ms.slice(0, 7), gs = D.weekStart(ms);
    const weeks = Math.ceil((D.dow(ms) + D.diff(ms, D.addMonths(ms, 1))) / 7);
    const all = calRequests();
    const live = all.filter(countable);
    const roles = ROLES.filter(r => S.f.role.includes(r));
    // Lanes per week row: as many 22px bars as fit the measured row height (1–3), so the month fits the screen without scrolling.
    const MAXL = S.phoneLanes || 3;
    let html = '<div class="month compact strips" style="--lanes:' + MAXL + '"><div class="dow-row">' + DOW.map(d => '<div>' + d[0] + '</div>').join('') + '</div>' +
      '<div class="month-grid" style="--weeks:' + weeks + '">';
    for (let w = 0; w < weeks; w++) {
      const ws = D.add(gs, w * 7), we = D.add(ws, 6);
      const days = Array.from({ length: 7 }, (_, i) => D.add(ws, i));
      // Same dates and type share one bar (its first person stands in for sorting); everyone else gets their own.
      const sg = sameDateGroups(all.filter(r => r.start <= we && r.end >= ws));
      // Your own bars (or shared bars that include you) first, so they take the top lanes.
      const itRank = it => it.r.id === S.focus ? -2 : (it.g || [it.r]).some(r => r.userId === S.me) ? -1 : stackRank(it.r);
      const evs = sg.solo.map(r => ({ r })).concat(sg.groups.map(g => ({ r: g[0], g })))
        .sort((x, y) => itRank(x) - itRank(y) || (x.r.start < y.r.start ? -1 : x.r.start > y.r.start ? 1 : D.diff(y.r.start, y.r.end) - D.diff(x.r.start, x.r.end)) || byLast(x.r, y.r));
      // Lane packing: each bar takes the first lane free across all its days. Blackouts go first (top lanes).
      const lanes = [], placed = [];
      blackouts().filter(b => b.start <= we && b.end >= ws).forEach(b => {
        const a = D.diff(ws, D.max(b.start, ws)), z = D.diff(ws, D.min(b.end, we));
        let l = 0;
        while ((lanes[l] || []).slice(a, z + 1).some(Boolean)) l++;
        lanes[l] = lanes[l] || [];
        for (let i = a; i <= z; i++) lanes[l][i] = true;
        placed.push({ bo: b, a, z, l });
      });
      evs.forEach(({ r, g }) => {
        const a = D.diff(ws, D.max(r.start, ws)), z = D.diff(ws, D.min(r.end, we));
        let l = 0;
        while ((lanes[l] || []).slice(a, z + 1).some(Boolean)) l++;
        lanes[l] = lanes[l] || [];
        for (let i = a; i <= z; i++) lanes[l][i] = true;
        placed.push({ r, g, a, z, l });
      });
      // Lanes above the last are always shown. The last lane shows a bar only if none of its days overflow;
      // on days that do, that slot holds "+N" for everyone not shown.
      const over = days.map((_, i) => placed.filter(p => p.l >= MAXL && p.a <= i && p.z >= i).length > 0);
      const shown = p => p.l < MAXL - 1 || (p.l === MAXL - 1 && !over.slice(p.a, p.z + 1).some(Boolean));
      const hidden = days.map((_, i) => placed.filter(p => !p.bo && !shown(p) && p.a <= i && p.z >= i).reduce((n, p) => n + (p.g ? p.g.length : 1), 0));
      const bars = placed.filter(shown).map(p => {
        if (p.bo) return boBar(p.bo, 'cs-bo' + (p.bo.start >= ws ? ' b-s' : '') + (p.bo.end <= we ? ' b-e' : ''), 'grid-row:' + (p.l + 1) + ';grid-column:' + (p.a + 1) + '/' + (p.z + 2));
        const r = p.r, u = userOf(r.userId), first = r.start >= ws, last = r.end <= we;
        if (p.g) {
          const same = p.g.every(x => x.status === r.status);
          return '<span class="' + ['cs-bar grp', tcls(r.type), same ? 'st-' + r.status.toLowerCase() : '', first ? 'b-s' : '', last ? 'b-e' : '', p.g.some(x => x.userId === S.me) ? 'mine' : ''].join(' ') +
            '" style="grid-row:' + (p.l + 1) + ';grid-column:' + (p.a + 1) + '/' + (p.z + 2) + '" role="button" tabindex="0" data-act="groupList" data-ids="' + esc(p.g.map(x => x.id).join(',')) + '">' + groupBadges(p.g, true, D.max(r.start, ws), D.min(r.end, we)) + '</span>';
        }
        const cls = ['cs-bar', tcls(r.type), 'st-' + r.status.toLowerCase(), first ? 'b-s' : '', last ? 'b-e' : '', r.userId === S.me ? 'mine' : ''].join(' ');
        return '<span class="' + cls + '" style="grid-row:' + (p.l + 1) + ';grid-column:' + (p.a + 1) + '/' + (p.z + 2) + '" role="button" tabindex="0" data-act="openReq" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' +
          personBadge(r, true, D.max(r.start, ws), D.min(r.end, we)) + '</span>';
      }).join('') + hidden.map((n, i) => n ? '<span class="cs-more" style="grid-row:' + MAXL + ';grid-column:' + (i + 1) + '" data-act="pickDay" data-date="' + days[i] + '">+' + n + '</span>' : '').join('');
      html += '<div class="week-row">';
      days.forEach(d => {
        const c = filteredRoleCounts(d);
        const over = roles.filter(role => quota(role) && c[role] > quota(role));
        const av = dayWarn(d);
        const label = D.f(d, { weekday: 'long', month: 'long', day: 'numeric' }) + ': ' + (S.priv
          ? ({ 'av-open': 'slots open', 'av-over': 'slots overbooked', 'av-full': 'slots full' })[av] || ''
          : roles.map(role => c[role] + ' ' + roleLow(role) + ' on leave' + (quota(role) ? ' of ' + quota(role) : '')).join(', ') + (over.length ? '. Over daily max for ' + over.join(' and ') : ''));
        html += '<button class="cell cc' + (d.slice(0, 7) !== month ? ' out' : '') + (d === S.today ? ' today' : '') + (D.dow(d) % 6 === 0 ? ' wknd' : '') + boCls(d) + (over.length && !S.priv ? ' over' : '') + (av ? ' ' + av : '') + '" data-act="pickDay" data-date="' + d + '" aria-label="' + esc(label) + '">' +
          '<span class="cc-n">' + Number(d.slice(8)) + '</span></button>';
      });
      html += '<div class="cs-lanes">' + bars + '</div></div>';
    }
    return html + '</div></div>';
  }


  /* Phone month, Stats mode: each day shows P / B / O meters (count vs daily max) for the current filters. */
  function renderMonthStats() {
    const ms = D.monthStart(S.cursor), month = ms.slice(0, 7), gs = D.weekStart(ms);
    const weeks = Math.ceil((D.dow(ms) + D.diff(ms, D.addMonths(ms, 1))) / 7);
    const reqs = calRequests().filter(countable);
    const roles = ROLES.filter(r => S.f.role.includes(r));
    let html = '<div class="month compact"><div class="dow-row">' + DOW.map(d => '<div>' + d[0] + '</div>').join('') + '</div>' +
      '<div class="month-grid" style="--weeks:' + weeks + '">';
    for (let w = 0; w < weeks; w++) {
      html += '<div class="week-row">';
      for (let i = 0; i < 7; i++) {
        const d = D.add(gs, w * 7 + i);
        const c = filteredRoleCounts(d);
        const over = roles.filter(role => quota(role) && c[role] > quota(role));
        const label = D.f(d, { weekday: 'long', month: 'long', day: 'numeric' }) + ': ' +
          roles.map(role => c[role] + ' ' + roleLow(role) + ' on leave' + (quota(role) ? ' of ' + quota(role) : '')).join(', ') + (over.length ? '. Over daily max for ' + over.join(' and ') : '');
        html += '<button class="cell cc' + (d.slice(0, 7) !== month ? ' out' : '') + (d === S.today ? ' today' : '') + (D.dow(d) % 6 === 0 ? ' wknd' : '') + boCls(d) + '" data-act="pickDay" data-date="' + d + '" aria-label="' + esc(label) + '">' +
          '<span class="cc-n">' + Number(d.slice(8)) + '</span>' + roles.map(role => roleMeter(role, c[role])).join('') + '</button>';
      }
      html += '</div>';
    }
    return html + '</div></div>';
  }

  /** Lane packing, stacked Leave → Pass → Denied, continuing each person's bar in the lane it was already in.
   *  Returns the sorted segments (each with .lane) and lanes[l] = last column used. */
  let weekCarry = null;
  /** Lane a segment's bar had in the week above (lowest of its people), or Infinity if it didn't carry over. */
  const carryLane = sg => weekCarry ? Math.min.apply(null, sg.people.map(r => weekCarry.has(r.id) ? weekCarry.get(r.id) : Infinity)) : Infinity;
  function packMonthWeek(segs) {
    // Same start column: continuing pieces first; among those, the one whose request runs longest claims the shared lane,
    // so the longest bar stays unbroken on top and a bar that is about to end drops down instead.
    const lastEnd = sg => sg.people.reduce((m, r) => r.end > m ? r.end : m, '');
    const byRun = (x, y) => cont(x) && cont(y) ? (lastEnd(y) > lastEnd(x) ? 1 : lastEnd(y) < lastEnd(x) ? -1 : 0) : 0;
    // Bars carried over from the week above keep the order they had there (Ilich above Matthews stays that way).
    const byCarry = (x, y) => { const a = carryLane(x), b = carryLane(y); return a === b ? 0 : a < b ? -1 : 1; };
    segs.sort((x, y) => x.a - y.a || cont(y) - cont(x) || byCarry(x, y) || byRun(x, y) || hasMe(y) - hasMe(x) || (y.b - y.a) - (x.b - x.a) || byLast(x.people[0], y.people[0]));
    const lanes = [];
    const laneOf = new Map();    // request id -> lane of its most recent segment
    const ends = new Map();      // request id -> column its most recent segment ended
    let base = 0;
    const place = sg => {
      const free = l => lanes[l] === undefined || lanes[l] < sg.a;
      // Continue on the HIGHEST line any of its people were on the day before (a shared bar keeps the top person's line,
      // so that person's bar stays unbroken and a newcomer can't jump above it).
      let l = -1;
      for (const r of sg.people) {
        const pl = laneOf.get(r.id);
        if (pl !== undefined && ends.get(r.id) === sg.a - 1 && free(pl) && (l < 0 || pl < l)) l = pl;
      }
      // A bar that continues from the previous day keeps its lane, so each person reads as one straight line.
      // Only new bars take the highest free lane.
      if (l < 0) { l = base; while (!free(l)) l++; }
      lanes[l] = sg.b;
      sg.lane = l;
      sg.people.forEach(r => { laneOf.set(r.id, l); ends.set(r.id, sg.b); });
    };
    stackOrder().forEach(cat => {
      segs.filter(sg => sg.cat === cat).forEach(place);
      base = lanes.length;
    });
    return { segs, lanes };
  }

  function renderMonthWeek(ws, month, reqs) {
    const days = Array.from({ length: 7 }, (_, i) => D.add(ws, i));
    const m = monthMetrics();
    const lineH = m.barH + 2, moreH = 16;
    const avail = m.rowH - m.headH - 2;
    // One unbroken bar per request (or per same-dates group); rows that don't fit show "+N more".
    const { segs, lanes } = packMonthWeek(monthSegments(ws, reqs));
    if (weekCarry) { weekCarry.clear(); segs.forEach(sg => sg.people.forEach(r => { const l = weekCarry.get(r.id); if (l === undefined || sg.lane < l) weekCarry.set(r.id, sg.lane); })); }

    // Blackouts take the top lanes of the week (everyone sees them, even with Hide user schedules on).
    const we = days[6], wbo = blackouts().filter(b => b.start <= we && b.end >= ws);
    segs.forEach(sg => { sg.lane += wbo.length; });
    // Fit to the measured row height.
    let ln = lanes.length + wbo.length;
    if (ln * lineH > avail) while (ln > wbo.length && ln * lineH + moreH > avail) ln--;

    const hidden = days.map(() => 0);
    let overlay = wbo.map((b, i) => {
      const a = D.diff(ws, D.max(b.start, ws)), z = D.diff(ws, D.min(b.end, we));

  /* Per-day "P: 1/2" / "B: 3/2" markers: Leave only (Approved + Pending); passes have no limit. Red when over the admin-set max. */

  function quotaMsg(d, role, type) {

  /* ---------- Conflict days ----------

  /** Positions over a daily cap on day d, one entry per position and event type. */
  function dayConflicts(d, only) {

      const q = quota(role, type);

  /** Conflict chip for a request that puts its day over the daily leave max: "Conflict · 3/2" (worst day).

  /** In progress today (not denied): the member is out right now. */
  const isNow = r => r.status !== 'Denied' && r.start <= S.today && r.end >= S.today;

  const dupBadge = r => dupsOf(r).length ? '<span class="badge dup" title="Overlaps ' + esc(dupText(r)) + '">' + icon('alert', 12) + 'Overlap</span>' : '';
  /* Combined ID badge: [P|MKE] — position square on the left, unit section on the right, one button-like chip.

  function idBadge(u) {
    const L = roleL(u.role);
    const un = unitsList().find(x => x.code === u.unit);
    return '<span class="idb" aria-hidden="true"><span class="idb-r ' + roleCls(u.role) + '">' + esc(L) + '</span>' +
      '<span class="idb-u ub-' + (un ? un.style : 'slate') + '">' + esc(u.unit) + '</span></span>';

  /* Full person badge on calendar bars: [P|MKE|Lastname] as one chip. Approved = green border. */
  /** Green "going on now" dot after a name — only on the bar that covers today (from–to = the dates that bar shows). */
  // On leave / pass right now = APPROVED and today is inside the dates (pending or denied isn't "on leave", even on those days).
  // The green dot sits to the RIGHT of the name, in the ✓'s place, on every bar of that request (all weeks).
  const onNow = r => r.status === 'Approved' && isNow(r);

  function rolePuck(role, list, from, to, unit) {
    list = list.slice().sort((a, b) => (a.userId === S.me ? 0 : 1) - (b.userId === S.me ? 0 : 1) || byLast(a, b));
    const L = roleL(role), un = unit && unitsList().find(x => x.code === unit);
    const title = rolePl(role) + ': ' + list.map(r => fullName(userOf(r.userId)) + ' (' + r.status + ')').join('; ');

      ? '<span class="rp-more">4+ ' + esc(rolePl(role)) + '</span>'
      : list.map(r => '<span class="mn' + (dupsOf(r).length ? ' dup' : '') + (r.id === S.focus ? ' focus' : '') + (r.status === 'Denied' ? ' st-denied' : '') +
          '" role="button" tabindex="0" ' + (list.length > 1 ? 'data-act="groupList" data-ids="' + esc(list.map(x => x.id).join(',')) + '"' : 'data-act="openReq" data-id="' + esc(r.id) + '"') + ' aria-label="' + esc(describe(r)) + '">' + barMarks(r) + esc(calName(userOf(r.userId))) + nowDot(r, from, to) + (onNow(r) ? '' : statusIcon(r.status)) + '</span>')

  /** Fiscal year (1 Oct – 30 Sep) containing day d: [start, end, 'FY27']. */
  function fyOf(d) {
    const y = Number(d.slice(0, 4)), fy = Number(d.slice(5, 7)) >= 10 ? y + 1 : y;
    return [(fy - 1) + '-10-01', fy + '-09-30', 'FY' + String(fy).slice(2)];
  }
  /**
   * Leave-days counter shown under every request calendar (request form and request details).
   * Counts the member's Leave days in the fiscal year of the selection: approved + pending (other requests),
   * plus the days of the current selection when it is Leave. excludeId = the request being edited / viewed,
   * so it is counted once, as the selection.
   */
  function leaveTally(userId, type, start, end, excludeId) {
    if (!userId) return '';
    const anchor = D.valid(start) ? start : S.today, [fs, fe, label] = fyOf(anchor);
    const inFy = (a, b) => { const x = D.max(a, fs), y = D.min(b, fe); return x <= y ? D.days(x, y) : 0; };
    let appr = 0, pend = 0;
    IDX.live.forEach(r => {
      if (r.userId !== userId || r.type !== 'Leave' || r.id === excludeId) return;
      if (r.status === 'Approved') appr += inFy(r.start, r.end);
      else if (r.status === 'Pending') pend += inFy(r.start, r.end);
    });
    const hasSel = D.valid(start) && D.valid(end) && end >= start;
    const sel = hasSel && type === 'Leave' ? inFy(start, end) : 0;
    const who = userId === S.me ? 'Your' : esc(lastName(userOf(userId))) + '’s';
    return '<div class="lv-tally" aria-live="polite"><div class="lt-h">' + who + ' leave days · ' + label + '</div>' +
      '<span class="lt-n"><b>' + appr + '</b> approved</span><span class="lt-n"><b>' + pend + '</b> pending</span>' +
      (type === 'Leave'
        ? '<span class="lt-n lt-sel"><b>+' + sel + '</b> ' + (hasSel ? 'this request' : 'pick dates') + '</span>'
        : '<span class="lt-n lt-sel">Passes don’t use leave days</span>') +
      '<span class="lt-total">' + plural(appr + pend + sel, 'day') + '</span></div>';
  }
  function periodRange(p) {
    const y = Number(S.today.slice(0, 4)), m = Number(S.today.slice(5, 7));
    if (p === 'fy') { const fy = m >= 10 ? y + 1 : y; return [(fy - 1) + '-10-01', fy + '-09-30', 'FY' + String(fy).slice(2) + ' (1 Oct ' + (fy - 1) + ' – 30 Sep ' + fy + ')']; }
    if (p === 'cy') return [y + '-01-01', y + '-12-31', 'Calendar Year ' + y];
    if (p === '12m') return [D.add(S.today, -365), '9999-12-31', 'Past 12 months + upcoming'];
    return ['0000-01-01', '9999-12-31', 'All Time'];
  }
  const PEOPLE_COLS = [
    ['unit', 'Unit'], ['last', 'Last Name'], ['first', 'First Name'], ['rank', 'Rank'], ['role', 'Position'],
    ['count', 'Requests', 1], ['req', 'Days Requested', 1], ['appr', 'Days Approved', 1], ['den', 'Days Denied', 1], ['pend', 'Days Pending', 1],
    ['leave', 'Leave Approved', 1], ['pass', 'Pass Approved', 1]
  ];
  function peopleStats() {
    const P = S.people, rng = periodRange(P.period), q = P.q.trim().toLowerCase();
    // Quick filters: positions and units (null = all of them).
    const okRole = u => !P.roles || P.roles.includes(u.role), okUnit = u => !P.units || P.units.includes(u.unit);
    const rows = S.users.filter(u => (P.inactive || u.active) && okRole(u) && okUnit(u) && (!q || (u.rank + ' ' + u.name + ' ' + u.unit + ' ' + u.role).toLowerCase().indexOf(q) >= 0)).map(u => {
      const m = { u, count: 0, req: 0, appr: 0, den: 0, pend: 0, leave: 0, pass: 0 };
      S.requests.forEach(r => {
        if (r.userId !== u.id || r.status === 'Cancelled' || r.start < rng[0] || r.start > rng[1]) return;
        const n = D.days(r.start, r.end);

  let modalOpener = null;
  function openModal(kind, html, wide) {
    // Going from one dialog straight to another (e.g. Filters → Person) reuses the open overlay, so nothing re-animates or flashes.
    const box = S.modal && $('#modal .overlay > .modal');
    S.modal = kind;
    if (box) { box.className = 'modal' + (wide ? ' modal-wide' : ''); box.innerHTML = html; box.scrollTop = 0; }
    else {
      // Remember what opened the dialog so focus can go back there when it closes.
      modalOpener = document.activeElement;
      $('#modal').innerHTML = '<div class="overlay" data-overlay="1"><div class="modal' + (wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' + html + '</div></div>';
    }
    autoFocus($('#modal [autofocus]')); // phones: no keyboard popping up on its own
  }
  function closeModal() {
    // Closing the person picker returns to whatever opened it (the request form or the Filters sheet).
    if (S.modal === 'person' && S.ppMode === 'assign' && S.wiz) { ppAssignDone(); return; }
    if ((S.modal === 'req' || S.modal === 'member') && S.backToNotes) { S.backToNotes = false; openNotesDrawer(); return; }
    S.backToNotes = false;
    if (S.modal === 'year' && S.yearFrom) { const id = S.yearFrom; S.yearFrom = null; openMemberCard(id); return; }
    if (S.modal === 'person' && S.ppFromSheet) { S.ppFromSheet = false; openFilterSheet(S.ppScope); return; }
    if (S.modal === 'wizard' && S.boReturn) { const b = S.boReturn; S.boReturn = null; S.wiz = null; openBoResolve(b); return; } // edited from the blackout resolver
    if (S.modal === 'wizard' && S.cfReturn) { const cd = S.cfReturn; S.cfReturn = null; S.wiz = null; openConflict(cd, S.cfRole); return; }
    hideTip(); S.modal = null; S.wiz = null; $('#modal').innerHTML = '';
    if (modalOpener && document.contains(modalOpener) && modalOpener.focus) modalOpener.focus({ preventScroll: true });
    modalOpener = null;
  }

  /* ---------- Profile (a page, laid out like the Admin page) ---------- */
  /* ================================================================ */
  /* Notifications: inbox (stored on the server) + Web Push on this device */
  /* ================================================================ */
  // Push needs the GitHub Pages build (service worker on our own origin) and, on iPhone, the home-screen app.
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  /* Home-screen app (iOS standalone): iOS gives these apps no access to saved passwords, so on ANY password-type field its
     only offer is "Use Strong Password" — even on sign-in. So in the home-screen app no field is a password field: PIN
     boxes become plain number boxes masked as dots (same look, number keypad), and iOS has nothing to offer. In Safari
     (and on desktop) they stay real password fields, so saved-password AutoFill keeps working there. */
  (function () {
    if (!isStandalone()) return;
    const mask = root => (root.querySelectorAll ? root.querySelectorAll('input[type="password"]') : []).forEach(i => {
      i.type = 'text'; i.classList.add('pin-mask');
      i.setAttribute('autocomplete', 'off'); i.setAttribute('autocorrect', 'off'); i.setAttribute('autocapitalize', 'off'); i.spellcheck = false;
      if (!i.getAttribute('inputmode')) i.setAttribute('inputmode', 'numeric');
      i.setAttribute('data-1p-ignore', ''); i.setAttribute('data-lpignore', 'true');
    });
    mask(document);
    new MutationObserver(list => list.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) { if (n.matches && n.matches('input[type="password"]')) mask(n.parentNode); else mask(n); } })))
      .observe(document.documentElement, { childList: true, subtree: true });
  })();
  const pushCapable = () => !!(window.PAL_API_URL && window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
  let swReg = null;
  function setBadge() {

  /** Settings → About: is the deployed Apps Script running the Code.gs this page expects? */

    // a refresh fixes it — tapping it offers the update like any other (Not Now · Update). Out of Date (red, does

  /* ---------- Request detail ---------- */
  /* ---------- Approval conflict calendar ---------- */
  /** Per day of r: who else of the same position is out (approved/pending), whether the daily max is exceeded,
   *  and any of the member's own overlapping requests (duplicates). */
  /** "Conflicts With" table: every request this one clashes with on any of its days (over the daily max, or the member's
   *  own overlapping requests) — name, type, dates, days, status; tap a row to open it. Admin mode, or schedules not
   *  hidden. With Hide user schedules on, members only see how many other requests are involved. */
  function conflictsWithHtml(r) {
    const cs = [...reqConflicts(r).values()].filter(c => c.bad), seen = new Set(), who = [];
    cs.forEach(c => c.peers.concat(c.dups).forEach(x => { if (!seen.has(x.id)) { seen.add(x.id); who.push(x); } }));
    if (S.priv && !S.isAdmin) { const n = Math.max(0, ...cs.map(c => c.n)); return n ? '<div class="cc-with"><span class="cc-with-h">Conflicts With</span><span class="muted">' + plural(n, 'other request') + '</span></div>' : ''; }
    if (!who.length) return cs.some(c => c.bo) ? '<div class="cc-with"><span class="cc-with-h">Conflicts With</span><span class="muted">Blackout Days</span></div>' : '';
    who.sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0) || byPosName(a, b));
    return '<div class="cc-with"><span class="cc-with-h">Conflicts With</span><div class="tbl-wrap bo-tbl cc-tbl"><table class="rtable"><thead><tr>' +
      '<th scope="col">Name</th><th scope="col">Type</th><th scope="col">Dates</th><th scope="col" class="num">Days</th><th scope="col">Status</th></tr></thead><tbody>' +
      who.map(x => { const u = userOf(x.userId);
        return '<tr data-act="openReq" data-id="' + esc(x.id) + '" tabindex="0" aria-label="' + esc(describe(x)) + '"><td class="strong">' + personBadge(x, false) + '</td>' +
          '<td><span class="badge t-' + tcls(x.type) + '">' + esc(x.type) + '</span></td>' +
          '<td>' + esc(D.short(x.start)) + ' → ' + esc(D.short(x.end)) + '</td><td class="num">' + D.days(x.start, x.end) + '</td>' +
          '<td><span class="badge s-' + x.status.toLowerCase() + '">' + x.status + '</span></td></tr>'; }).join('') + '</tbody></table></div></div>';
  }
  function reqConflicts(r) {
    const u = userOf(r.userId), q = quota(u.role, r.type), out = new Map();
    for (let d = r.start; d <= r.end; d = D.add(d, 1)) {
      const others = IDX.live.filter(x => x.id !== r.id && x.status !== 'Denied' && x.start <= d && x.end >= d);
      // Only a type with a cap for this position uses a slot; other members' requests of the same type count against it.
      const peers = q ? others.filter(x => x.type === r.type && x.userId !== r.userId && userOf(x.userId).role === u.role).sort(byLast) : [];
      // Hide user schedules: other people's requests are only a count (server day totals minus this request).
      const self = r.status !== 'Denied' ? 1 : 0;
      const n = S.priv ? (q ? Math.max(0, countOn(d, u.role, r.type) - self) : 0) : peers.length;
      const dups = others.filter(x => x.userId === r.userId);
      const over = !!q && n + 1 > q;
      const bo = r.boOk !== 'true' && blackoutsOn(d, r.type).length > 0;
      out.set(d, { peers, n, dups, over, bo, bad: over || bo || dups.length > 0, q, role: u.role });
    }
    return out;
  }
  const r_bo_text = d => 'a blackout day (' + blackoutsOn(d).map(b => boLabel(b).toLowerCase() + (b.note ? ' — ' + b.note : '')).join('; ') + ')';
  function conflictText(d, c) {
    const day = D.f(d, { weekday: 'short', month: 'short', day: 'numeric' });
    if (!c.bad) return day + ': no conflict' + (c.n ? ' (' + (c.n + 1) + (c.q ? ' of ' + c.q : '') + ' ' + roleLow(c.role) + ' out)' : '') + '.';
    const parts = [];
    if (c.over) parts.push('over the ' + roleLow(c.role) + ' max (' + (c.n + 1) + ' of ' + c.q + ') with ' + (S.priv ? plural(c.n, 'other leave request')
      : c.peers.map(x => fullName(userOf(x.userId)) + ' – ' + x.type.toLowerCase() + ', ' + x.status.toLowerCase()).join('; ')));
    if (c.bo) parts.push(r_bo_text(d));
    if (c.dups.length) parts.push('duplicate of own ' + c.dups.map(x => x.type.toLowerCase() + ' ' + D.short(x.start) + '–' + D.short(x.end)).join(', '));
    return day + ': conflicts — ' + parts.join('. ') + '.';
  }
  /** Request details calendar: the same month grid as the request form, with the request's range colored
   *  green (no conflict) or red (conflict). Every day in the range is tappable to see who else is out. */
  function reqCalendar(r) {
    const cf = reqConflicts(r);
    const months = [];
    for (let m = D.monthStart(r.start); m <= r.end && months.length < 3; m = D.addMonths(m, 1)) months.push(m);
    return months.map(m0 => {
      const gs = D.weekStart(m0), mon = m0.slice(0, 7);
      let cells = DOW.map(x => '<div class="dw">' + x[0] + '</div>').join('');
      for (let i = 0; i < 42; i++) {
        const d = D.add(gs, i);
        if (i === 35 && d.slice(0, 7) !== mon) break;
        if (d.slice(0, 7) !== mon) { cells += '<span class="blank"></span>'; continue; }
        const today = d === S.today ? ' today' : '', c = cf.get(d);
        if (!c) { cells += '<span class="' + (today + boCls(d, r.type)).trim() + '">' + Number(d.slice(8)) + '</span>'; continue; }
        const txt = conflictText(d, c);
        cells += '<button type="button" class="in ' + (c.bad ? 'rg-full' : 'rg-ok') + (d === r.start ? ' r-s' : '') + (d === r.end ? ' r-e' : '') + today + '"' +
          ' data-act="confDay" data-date="' + d + '" data-id="' + esc(r.id) + '" aria-label="' + esc(txt) + '" title="' + esc(txt) + '">' + Number(d.slice(8)) + '</button>';
      }
      return '<div class="mini"><div class="mini-h"><span>' + D.f(m0, { month: 'long', year: 'numeric' }) + '</span></div><div class="mini-g">' + cells + '</div></div>';
    }).join('');
  }

        liveTypes().map(t => '<button type="button" tabindex="-1" aria-disabled="true" class="' + (t === r.type ? 'on' : '') + '">' + esc(t) + '</button>').join('') + '</div></div></div>' +
      (isCaution(r) ? '<div class="msg w">' + icon('alert', 15) + '<span>' + esc(cautionText(r)) + '</span></div>' : '') +
      (blackoutDaysOf(r).length && r.status !== 'Cancelled' ? (r.boOk === 'true'
        ? '<div class="msg i">' + icon('check', 15) + '<span>Falls on blackout days (' + esc(blackoutDaysOf(r).map(D.short).join(', ')) + ') — allowed by an admin.</span></div>'
        : '<div class="msg e bo-msg">' + icon('ban', 15) + '<span>Falls on blackout days: ' + esc(blackoutDaysOf(r).map(D.short).join(', ')) + '. ' +
          (S.isAdmin ? 'Allow it, change the dates, deny or delete it.' : 'An admin needs to review it.') + '</span>' +
          (S.isAdmin && r.status !== 'Denied' ? '<button class="btn sm" data-act="allowBlackout" data-id="' + esc(r.id) + '">' + icon('check', 13) + 'Allow</button>' : '') + '</div>') : '') +
      (isChanged(r) ? '<div class="msg w chg-msg">' + icon('alert', 15) + '<span>' + esc(changeText(r)) +

      (S.isAdmin || r.userId === S.me ? '<div class="field"><span class="lbl">Trip Reason &amp; Notes</span><div class="ro-val ro-note">' + (r.note ? esc(r.note) : '<span class="muted">No note provided.</span>') + '</div></div>' : '') +

  /* ---------- Roster: one member's year (6 months back, this month, 5 ahead) ---------- */
  function openPersonYear(uid) {
    const u = S.users.find(x => x.id === uid);
    if (!u) return;
    const first = D.addMonths(D.monthStart(S.today), -6), months = Array.from({ length: 12 }, (_, i) => D.addMonths(first, i));
    const from = first, to = D.add(D.addMonths(first, 12), -1);
    const reqs = IDX.live.filter(r => r.userId === uid && r.status !== 'Cancelled' && r.end >= from && r.start <= to);
    const RANK = { Approved: 0, Pending: 1, Denied: 2 };
    // One request per day: approved beats pending beats denied (overlaps are rare and flagged elsewhere).
    const dayReq = d => reqs.filter(r => r.start <= d && r.end >= d).sort((a, b) => RANK[a.status] - RANK[b.status])[0];
    const cls = r => r.status === 'Approved' ? 'y-ap-' + tcls(r.type) : r.status === 'Pending' ? 'y-pend' : 'y-den';
    const blocks = months.map(m0 => {
      const gs = D.weekStart(m0), mon = m0.slice(0, 7);
      let cells = DOW.map(x => '<span class="y-dw">' + x[0] + '</span>').join('');
      for (let i = 0; i < 42; i++) {
        const d = D.add(gs, i);
        if (i === 35 && d.slice(0, 7) !== mon) break;
        if (d.slice(0, 7) !== mon) { cells += '<span class="y-d y-blank"></span>'; continue; }
        const r = dayReq(d), today = d === S.today ? ' y-today' : '';
        cells += r
          ? '<button type="button" class="y-d ' + cls(r) + today + '" data-act="yearDay" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(D.f(d, { month: 'long', day: 'numeric' }) + ': ' + r.type + ', ' + r.status) + '">' + Number(d.slice(8)) + '</button>'
          : '<span class="y-d' + today + '">' + Number(d.slice(8)) + '</span>';
      }
      const divider = m0.slice(5, 7) === '01' && m0 !== first ? '<div class="y-year" role="separator"><span>' + m0.slice(0, 4) + '</span></div>' : '';
      return divider + '<div class="y-m' + (mon === S.today.slice(0, 7) ? ' y-now' : '') + '"><div class="y-t">' + D.f(m0, { month: 'long', year: 'numeric' }) + '</div><div class="y-g">' + cells + '</div></div>';
    }).join('');
    // Only the calendars: month blocks with a year divider before each January; Close is the only action.
    const html = modalHead(esc(nameText(u, true)), 'calendar') + '<div class="modal-b y-body"><div class="y-grid">' + blocks + '</div></div>' +
      '<div class="modal-f"><button class="btn" data-act="closeModal">Close</button></div>';
    openModal('year', html, true);
    // Open on the current month (phones: a scrolling list of months, so earlier months are a scroll up).
    const now = $('#modal .y-now'), body = $('#modal .y-body');
    if (now && body && isCompact()) body.scrollTop = now.offsetTop - body.offsetTop - 8;
  }

  function userFields(p, u, pinRequired) {
    // [value, label] pairs; a plain string is both.

    // First / middle / last. Admins can adjust these so members who share a last name read clearly on the calendar.
    const t = String(u.name || '').trim().split(/\s+/).filter(Boolean);
    // A one-word name (the seeded roster is last names only) is the last name; the admin fills in the first name.
    const nf = t.length > 1 ? t[0] : '', nl = t.length ? t[t.length - 1] : '', nm = t.slice(1, -1).join(' ');

  const wizIds = () => { const w = S.wiz; return w.creating ? [] : w.editId ? [w.assigneeId].concat(w.extra || []) : (w.assignees || []); };
  const wizWho = () => { const w = S.wiz; return w.creating ? w.nu.rank + ' ' + w.nu.name + ' (' + w.nu.unit + ')' : wizIds().map(id => fullName(userOf(id))).join(', '); };
  function wizCheck() {
    const w = S.wiz, errs = [], warns = [];
    let n = 0;
    if (!D.valid(w.start) || !D.valid(w.end)) {
      errs.push('Select departure and return dates.');
    } else if (w.end < w.start) {
      errs.push('Return date must be on or after the departure date.');
    } else if (w.type === 'Blackout') {
      n = D.days(w.start, w.end);
      if (n > 366) errs.push('A blackout can be at most a year long.');
      const hit = boFlagged({ start: w.start, end: w.end, types: w.boTypes });
      if (hit.length) warns.push(plural(hit.length, 'request') + ' already on these days will show a Blackout conflict for you to review.');
    } else {
      n = D.days(w.start, w.end);
      const rule = lenRule(w.type), tn = w.type;
      if (n > rule.max) (rule.mode === 'limit' ? errs : warns).push(rule.mode === 'limit'
        ? tn + ' is limited to ' + rule.max + ' days — you selected ' + n + '.'
        : 'Caution: ' + tn.toLowerCase() + ' over ' + rule.max + ' days is flagged for leadership review.');
      if (n > 60) errs.push('Requests are limited to 60 days.');
      // Daily max per position: every member on this request adds one to their position's count.
      const roleN = {};
      (w.creating ? [w.nu.role] : wizIds().map(id => userOf(id).role)).forEach(r => { roleN[r] = (roleN[r] || 0) + 1; });
      Object.keys(roleN).forEach(role => {
        const q = quota(role, w.type);
        if (!q) return;
        const hits = [];
        // When editing, the request's current days are already in the counts.
        const self0 = w.editId && w.editStatus !== 'Denied' ? S.requests.find(r => r.id === w.editId) : null;
        const self = self0 && self0.type === w.type ? self0 : null;
        for (let d = w.start; d <= w.end && hits.length < 40; d = D.add(d, 1)) {
          const own = self && d >= self.start && d <= self.end ? 1 : 0;
          if (countOn(d, role, w.type) - own + roleN[role] > q) hits.push(d);
        }
        if (hits.length) warns.push(role + ' ' + w.type.toLowerCase() + ' max (' + q + '/day) would be exceeded on ' + hits.map(D.short).join(', ') + '. Leadership will see a conflict flag.');
      });
      if (!w.creating) {
        const ids = wizIds(), many = ids.length > 1;
        const clash = IDX.live.filter(r => r.id !== w.editId && ids.includes(r.userId) && (r.status === 'Pending' || r.status === 'Approved') && r.start <= w.end && r.end >= w.start);
        if (clash.length) warns.push('Overlap: these dates overlap ' + clash.map(c => (many ? lastName(userOf(c.userId)) + '’s ' : 'an existing ') + c.type.toLowerCase() + ' (' + D.short(c.start) + ' → ' + D.short(c.end) + ', ' + c.status.toLowerCase() + ')').join(' and ') + '. A member can’t be on leave and a pass at the same time — leadership will see a conflict warning.');
      }
      if (w.start < S.today) warns.push('Departure date is in the past.');
      const bo = blackoutDaysOf({ type: w.type, start: w.start, end: w.end });
      if (bo.length) warns.push('Blackout: ' + bo.map(D.short).join(', ') + ' ' + (bo.length === 1 ? 'is a' : 'are') + ' ' + w.type.toLowerCase() + ' blackout day' + (bo.length === 1 ? '' : 's') + '. You can still submit, but it will show as a conflict for an admin to review.');
    }
    return { errs, warns, n };
  }

    wizExisting() { S.wiz.creating = false; S.wiz.error = ''; renderWizard(); },
    wizEdit() { S.wiz.step = 'form'; S.wiz.error = ''; renderWizard(); },
    /** One-page form → Review: check the new member (if any) and the dates first. */
    wizReview() {
      const w = S.wiz, err = m => { const e = $('#wizErr'); if (e) e.textContent = m; toast(m, 'error'); };
      if (w.creating) {
        w.nu = readUserFields('nu');
        if (!w.nu.last) return err('Enter at least the new member’s last name.');
        if (S.users.find(u => u.name.toLowerCase() === w.nu.name.toLowerCase() && u.unit === w.nu.unit)) return err(w.nu.name + ' (' + w.nu.unit + ') is already on the roster — choose them from the list.');
      }
      if (S.isAdmin && !w.creating && w.type !== 'Blackout' && !wizIds().length) return err('Choose who this request is for.');
      if (!D.valid(w.start)) return err('Pick your departure date on the calendar.');
      if (!D.valid(w.end)) return err('Now pick your return date — tap the same day again for a one-day request.');
      const c = wizCheck();
      if (c.errs.length) return err(c.errs[0]);
      w.error = ''; w.step = 3; renderWizard();
    },
    wizBoTypes(el) { S.wiz.boTypes = el.dataset.v; renderWizard(); },
    wizEditType(el) {
      const was = S.wiz.type;
      S.wiz.type = el.dataset.v;
      if (was === 'Blackout' || S.wiz.type === 'Blackout') { S.wiz.boTypes = S.wiz.boTypes || 'Both'; S.wiz.note = ($('#wzN') || {}).value || S.wiz.note; renderWizard(); return; }
      $$('#modal [data-act="wizEditType"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.wiz.type));
      refreshWizDates();
    },
    wizDates() {
      const w = S.wiz;
      // A return date before the departure is cleared, never replaced with a guess.
      if (D.valid(w.start) && D.valid(w.end) && w.end < w.start) w.end = '';
      if (D.valid(w.start)) w.mini = D.monthStart(w.start);
      w.picking = D.valid(w.start) && !D.valid(w.end);
      refreshWizDates();
    },
    miniNav(el) { S.wiz.mini = D.addMonths(S.wiz.mini, Number(el.dataset.v)); refreshWizDates(); },
    miniPick(el) {
      if (Date.now() - miniSwipedAt < 400) return;
      const w = S.wiz, d = el.dataset.date;
      // First tap = Departure (Return stays empty); second tap = Return. Tap the same day twice for a one-day request.
      if (!w.picking) { w.start = d; w.end = ''; w.picking = true; }
      else { const a = D.min(w.start, d), b = D.max(w.start, d); w.start = a; w.end = b; w.picking = false; }
      refreshWizDates();
    },
    /* A NEW request waits for the server behind the full-screen "Submitting…" cover, so nobody closes the app before it's
       saved; if it fails, the form stays open with the error. Edits (requests and blackouts) are optimistic. */
    async wizSubmit() {
      const w = S.wiz, c = wizCheck();
      if (c.errs.length) { $('#wizErr').textContent = c.errs[0]; return; }
      if (w.type === 'Blackout') {
        const b = { id: w.editBoId || '', start: w.start, end: w.end, types: w.boTypes, note: w.note.trim().slice(0, 80) };
        // Optimistic: shows at once; the ring spins on the Admin icon until the server has it (a failure undoes it and says so).
        S.nextSyncTab = 'admin';
        save(() => {
          const list = blackouts().filter(x => x.id !== b.id);
          S.settings.blackouts = list.concat([Object.assign({}, b, { id: b.id || 'tmp_' + Date.now() })]).sort((x, y) => x.start < y.start ? -1 : 1);
        }, 'apiSaveBlackout', S.token, b);
        closeModal(); render();
        // Leave / passes already on those days (approved or pending): decide what to do with each right away.
        if (boFlagged(b).length) { openBoResolve(b); return; }
        toast(w.editBoId ? 'Blackout updated' : 'Blackout added', 'ok', 2200);
        return;
      }
      const payload = { type: w.type, start: w.start, end: w.end, note: w.note.trim() };
      let done, many = 0, added = 0;
      if (w.editId) {
        // Edits are optimistic: the change shows at once and the ring spins on the nav while it saves
        // (a failure reloads from the server, undoing it, and says so).
        const id = w.editId;
        save(() => {
          const r = findReq(id); if (!r) return;
          Object.assign(r, payload);
          if (!S.isAdmin && r.status === 'Denied') r.status = 'Pending'; // a member's edit resubmits a denied request
        }, 'apiUpdateRequest', S.token, id, payload);
        // Members an admin added while editing get their own copy of the (edited) request (they appear once saved).
        if (S.isAdmin && (w.extra || []).length) { added = w.extra.length; save(null, 'apiCreateRequests', S.token, payload, w.extra.slice()); }
        closeModal(); render();
        toast('Request updated' + (added ? ' · adding ' + plural(added, 'member') : ''), 'ok', 2200);
        if (S.cfReturn) { const cd = S.cfReturn; S.cfReturn = null; openConflict(cd, S.cfRole); } // edited from the conflict screen
        return;
      } else {
        const ids = wizIds();
        many = S.isAdmin && !w.creating && ids.length > 1 ? ids.length : 0;
        showBlocker('Submitting…');
        if (many) done = save(null, 'apiCreateRequests', S.token, payload, ids);
        else {
          if (S.isAdmin && w.creating) payload.newUser = w.nu;
          else if (S.isAdmin) payload.assigneeId = ids[0];
          done = save(null, 'apiCreateRequest', S.token, payload);
        }
      }
      const data = await done;
      await saveChain; // let the confirmed data apply
      hideBlocker();
      if (!data) { if (S.wiz) $('#wizErr') && ($('#wizErr').textContent = 'Not saved — check your connection and try again.'); return; }
      closeModal();
      if (!w.editId && isCalView()) S.cursor = w.start;
      render();
      toast(many ? many + ' requests submitted — pending approval' : 'Request submitted — pending approval', 'ok', 2200);
      if (S.cfReturn) { const cd = S.cfReturn; S.cfReturn = null; openConflict(cd, S.cfRole); } // edited from the conflict screen
    }
  };

  /* ================================================================ */
  /* Event wiring                                                       */
  /* ================================================================ */
  // Admin PIN box: readonly until focused so password managers don't autofill the sign-in PIN into it.
  // pointerdown runs before focus, so iPhone still opens the number pad on the first tap; focusin covers keyboard users.
  // New-PIN boxes (data-arm) work the same way, and start drawing their own dots (dotPin) when first touched.
  const armPasskey = ev => {
    const t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute('data-arm')) dotPin(t);
    if (t && t.readOnly && (t.id === 'passkey' || (t.hasAttribute && t.hasAttribute('data-arm')))) { t.readOnly = false; if (t.id === 'passkey') t.value = ''; }
  };
  /** New-PIN box: shows • for each digit while the digits stay in JS. el.value reads / writes the digits (so every save
   *  and clear works unchanged); the box itself only ever holds dots, so iOS sees a plain number field. Digits only,
   *  max 8; deleting removes from the end. */
  const NATIVE_VALUE = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  function dotPin(el) {
    if (el._dots) return;
    el._dots = true;
    let raw = String(NATIVE_VALUE.get.call(el) || '').replace(/\D/g, '').slice(0, 8);
    const show = () => {
      const d = '•'.repeat(raw.length);
      NATIVE_VALUE.set.call(el, d);
      if (document.activeElement === el) { try { el.setSelectionRange(d.length, d.length); } catch (e) { /* ignore */ } }
    };
    Object.defineProperty(el, 'value', { configurable: true, get: () => raw, set: v => { raw = String(v == null ? '' : v).replace(/\D/g, '').slice(0, 8); show(); } });
    el.addEventListener('input', () => {
      const shown = NATIVE_VALUE.get.call(el), kept = (shown.match(/•/g) || []).length, typed = shown.replace(/[^0-9]/g, '');
      raw = (raw.slice(0, kept) + typed).slice(0, 8);
      show();
    });
    show();
  }
  document.addEventListener('pointerdown', armPasskey, true);
  document.addEventListener('focusin', armPasskey);
  document.addEventListener('click', ev => {
    // A click outside an open filter menu only closes the menu — it doesn't also open a day, request, etc.
    if (S.openDrop && !ev.target.closest('.fdrop')) {
      S.openDrop = null; $$('.fdrop-pop').forEach(p => { p.hidden = true; }); $$('.fdrop-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
      ev.preventDefault(); ev.stopPropagation();
      return;
    }
    const ov = ev.target.closest('[data-overlay]');
    if (ov && ev.target === ov) { closeModal(); return; }
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') return;
    ev.preventDefault();
    ev.stopPropagation();
    fn(el, ev);
  });
  document.addEventListener('click', ev => {
    if (S.periodOpen && !(ev.target.closest && ev.target.closest('.pdrop'))) { S.periodOpen = false; render(); }
  }, true);
  document.addEventListener('input', ev => {
    const t = ev.target, m = t.dataset && t.dataset.model;
    if (!t.dataset) return;
    if (m) setPath(m, t.value);
    if (t.dataset.live && A[t.dataset.live]) A[t.dataset.live](t, ev);
  });
  document.addEventListener('change', ev => {
    const t = ev.target, m = t.dataset && t.dataset.model;
    if (m) setPath(m, t.value);
    if (t.dataset && t.dataset.change && A[t.dataset.change]) A[t.dataset.change](t, ev);
    if (m === 'wiz.assigneeId') { /* role may change quota checks later */ }
  });
  document.addEventListener('mouseover', ev => {
    if (!S.sel) return;
    const el = ev.target.closest('[data-act="pickDay"]');
    if (el && el.dataset.date !== S.sel.hover) { S.sel.hover = el.dataset.date; paintSel(); }
  });
  document.addEventListener('keydown', ev => {
    // Non-button event elements (bars, chips, pucks) act like buttons for keyboard users.
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-act], article[data-act], tr[data-act][tabindex]')) {
      ev.preventDefault();
      ev.target.click();
      return;
    }
    if (ev.key !== 'Escape') return;
    if (S.modal) { closeModal(); return; }
    if (S.dayPanel && $('.dpanel')) { S.dayPanel = null; store.set('dpClosed', true); render(); return; }
    if (S.sel) { S.sel = null; paintSel(); hideToast(); }
    else if (S.focus) clearFocus();
  });
  // Hover / keyboard-focus tooltip for elements with data-tip (conflict calendar days).
  let tipEl = null, tipTimer = 0;
  function showTip(el) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.textContent = el.dataset.tip;
    tipEl.style.display = 'block';
    const b = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
    let x = b.left + b.width / 2 - t.width / 2, y = b.top - t.height - 8;
    x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
    if (y < 8) y = b.bottom + 8;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
  document.addEventListener('scroll', hideTip, true);

  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (!S.me || !isCalView() || S.cal !== 'month') return;
      // Switch between the phone (counts) and full (names) month layouts when crossing the breakpoint.
      if (!!$('.month.compact') !== isCompact()) render(); else fitMonth();
    }, 120);
  });

  /* Keep data fresh: changes made elsewhere (another admin, another tab, the sheet) show up without a reload.
     Refreshes every 60s while visible, when the tab regains focus, and when the request form or a person picker opens.
     The page behind an open dialog re-renders; an open person picker is rebuilt in place with the new list. */
  let refreshing = false;
  let saveGen = 0;   // bumped by every save(); lets a background refresh detect it raced a save
  async function refreshData() {
    if (!S.token || !S.me || S.busy || S.sel || S.pending || refreshing) return;
    const a = document.activeElement;
    if (!S.modal && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    refreshing = true;
    const gen = saveGen;
    try {
      const data = await call('apiBootstrap', S.token);
      // A save started while this was in flight: its result is newer than this snapshot, so drop the snapshot.
      if (S.pending || gen !== saveGen) return;
      apply(data);
      if (!S.modal) render();
      else if (S.modal === 'person') {
        // Rebuild the open picker with the fresh list, keeping whatever was typed in its search box.
        const q = S.ppq; openPersonPicker(S.ppScope, S.ppMode);
        const box = $('#modal .pp-search input'); if (q && box) { box.value = q; S.ppq = q; A.ppFilter(); }
      }
    } catch (e) { /* transient; the next refresh retries */ }
    finally { refreshing = false; }
  }
  setInterval(() => { if (!document.hidden) refreshData(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshData(); syncWithServer(false); } });
  window.addEventListener('focus', () => refreshData());

  /* ================================================================ */
  /* Boot                                                               */
  /* ================================================================ */
  /* Keep the page in step with the server. If the deployed Code.gs is NEWER than this page was built for, this copy of
     the page is stale (browser / Home Screen cache): reload it, bypassing the cache, to get the matching page. Only once per
     server version, so it can never loop. (An OLDER server can't be fixed from here — Settings → About says so.) */
  /* ---------- Updates ----------
     Opening or refreshing the app takes an update straight away (nothing typed yet to lose). While the app is open —
     including coming back to it from another app — an update never reloads on its own. Like most web apps, it shows a
     snackbar above the nav bar: "A new version is available" · Not now · Update. It doesn't block anything, so a
     half-typed entry is never lost. Not now leaves "Update Available" at the top of Profile → Notifications; tapping
     it brings the snackbar back. */
  /* A page that just reloaded for an update carries &u=1 in its address: it never updates again on that load, so an
     update can't loop (no matter what the browser's storage keeps). The marker is taken off the address right away. */
  const JUST_UPDATED = /[?&]u=1(&|$)/.test(location.search);
  if (JUST_UPDATED) { try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&]u=1(?=&|$)/, '').replace(/^&/, '?') + location.hash); } catch (e) { /* ignore */ } }
  /** Reload to the newest page. GitHub Pages: a cache-busted address. Apps Script: the whole web-app page (the app runs
   *  in Google's frame, so reloading just the frame wouldn't work). If nothing has happened after 12 s, the "Updating…"
   *  cover goes away with a note to close and reopen — it can never hang there. */
  function goFresh(build) {
    if (window.PAL_API_URL) location.replace(location.pathname + '?v=' + encodeURIComponent(build || Date.now()) + '&u=1' + location.hash);
    else if (S.execUrl) window.open(S.execUrl, '_top');
    else location.reload();
    setTimeout(() => { hideBlocker(); toast('Couldn’t restart the app. Close it and open it again to finish updating.', 'error', 9000); }, 12000);
  }
  /** An update is ready. apply(go) records it as handled on this device and, when go is true, reloads.
   *  launch = the page is just opening: take it now (GitHub Pages copy only — an Apps Script page always arrives fresh,
   *  and a page that just updated doesn't update again). Otherwise remember it and offer it in the snackbar. */
  function offerUpdate(apply, launch) {
    if (launch) {
      if (!window.PAL_API_URL || JUST_UPDATED) { apply(false); return false; }
      if (S.pending) return false; // never drop unsaved changes
      showBlocker('Updating…', ''); apply(true); return true;
    }
    S.update = () => apply(true);
    if (S.updateLater) { renderNavOnly(); redrawNotes(); return false; } // said Not now: only the notification offers it again
    askUpdate();
    return false;
  }
  function askUpdate() {
    if (!S.update) return;
    let bar = document.getElementById('updBar');
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'updBar'; bar.className = 'snackbar'; bar.setAttribute('role', 'status'); bar.setAttribute('aria-live', 'polite');
      bar.innerHTML = icon('refresh', 18) + '<span class="ub-t">A new version is available</span>' +
        '<button type="button" class="ub-b" data-act="updateNo">Not Now</button><button type="button" class="ub-b ub-go" data-act="updateYes">Update</button>';
      document.body.appendChild(bar);
    }
    document.body.classList.add('has-upd');
    hidePushBar(); // one snackbar at a time: the update wins
  }
  function hideUpdateBar() { const b = document.getElementById('updBar'); if (b) b.remove(); document.body.classList.remove('has-upd'); askPush(); }
  /** Admin → Update all devices: the server's FORCE_RELOAD time. A device updates once for each new push it hasn't seen
   *  (remembered on the device); the first time a device meets the setting it just records it. */
  function checkForceReload(at, launch) {
    at = Number(at) || 0;
    let seen = 0;
    try { seen = Number(localStorage.getItem('pal.reloadSeen') || 0); } catch (e) { return false; }
    // Never pushed yet: mark this device as ready (1), so the first push updates it too.
    if (!at) { if (!seen) try { localStorage.setItem('pal.reloadSeen', '1'); } catch (e) { /* storage unavailable */ } return false; }
    // A device meeting an existing push for the first time just loaded the newest page: record it, no reload.
    if (!seen) { try { localStorage.setItem('pal.reloadSeen', String(at)); } catch (e) { /* storage unavailable */ } return false; }
    if (at <= seen) return false;
    return offerUpdate(go => {
      try { localStorage.setItem('pal.reloadSeen', String(at)); } catch (e) { /* storage unavailable */ }
      if (go) goFresh();
    }, launch);
  }
  /* Keep the page in step with the server. If the deployed Code.gs is NEWER than this page was built for, this copy of
     the page is stale (browser / Home Screen cache) and needs the matching page — once per server version, so it can never
     loop. (An OLDER server can't be fixed from here — Settings → About says so.) */
  async function syncWithServer(launch) {
    let b = '', info = null;
    try { info = await call('apiServerInfo'); b = info.build || ''; } catch (e) { return; } // old server without the check, or offline
    S.execUrl = info.url || S.execUrl || '';
    if (checkForceReload(info.reloadAt, launch)) return;
    // Apps Script serves the App.html you deployed, so reloading there can't fix a newer server (Settings → About says so).
    if (!window.PAL_API_URL || !b || b <= EXPECTED_SERVER) return;
    let tried = '';
    try { tried = sessionStorage.getItem('pal.reloadedFor') || ''; } catch (e) { /* storage unavailable */ }
    if (tried === b) return;
    offerUpdate(go => {
      try { sessionStorage.setItem('pal.reloadedFor', b); } catch (e) { /* storage unavailable */ }
      if (go) goFresh();
    }, launch);
  }
  // GitHub Pages copy: its head script found a newer page build while the app was open (see build-pages.py).
  document.addEventListener('pal-update', e => offerUpdate(go => {
    try { sessionStorage.setItem('pal.freshFor', e.detail); } catch (err) { /* storage unavailable */ }
    if (go) goFresh(e.detail);
  }, false));
  async function boot() {
    applyTheme();
    initPush();
    syncWithServer(true);
    if (S.token) {
      try { apply(await call('apiBootstrap', S.token)); render(); if (location.hash) openLink(location.hash); return; }
      catch (e) { if (/new PIN/.test(e.message)) return; S.token = null; store.del('token'); }
    }
    showLogin();
  }
  boot();
})();
</script>
