  .cs-bar { --tag: 18px; --pill-fs: 11.5px; pointer-events: auto; min-width: 0; height: 22px; display: flex; align-items: center; gap: 3px; padding: 0 3px; margin: 0 -1px; overflow: hidden;
    font-size: 11.5px; font-weight: 700; line-height: 1; white-space: nowrap; cursor: pointer; }
  .cs-bar.leave { background: var(--leave); color: #ffffff; }
  .cs-bar.pass { background: var(--gold); color: var(--navy); }
  .cs-bar.st-denied { background: var(--denied-bg); color: var(--denied-ink); }
  .cs-bar.st-denied .cs-n { text-decoration: line-through; }
  .cs-bar.b-s { margin-left: 2px; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .cs-bar.b-e { margin-right: 2px; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .cs-r { flex: none; width: 13px; height: 13px; display: grid; place-items: center; border-radius: 3px; font-size: 9.5px; font-weight: 900; background: rgba(0, 0, 0, .28); color: inherit; }
  .cs-bar.pass .cs-r { background: var(--navy); color: var(--gold); }
  .cs-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cs-bar .sti { margin-left: 0; flex: none; } .cs-bar .sti .ic { width: 11px; height: 11px; }
  .cs-bar:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; z-index: 2; }
  .cs-more { pointer-events: auto; align-self: center; justify-self: center; font-size: 11.5px; font-weight: 800; color: var(--muted); cursor: pointer; }

  /* Phone month fills the space between the toolbar and Add Request: equal rows, no scrolling. */
  .month.compact .month-grid { grid-template-rows: repeat(var(--weeks), minmax(0, 1fr)); overflow: hidden; }
  .month.compact .week-row { min-height: 0; }
  .month.compact .cell.cc { overflow: hidden; }
  .month.compact:not(.strips) .cell.cc { gap: 2px; }
  .month.compact:not(.strips) .cell.cc .rm-bar { height: 3px; }
  /* Phone month strips carry the standard person puck [P|MKE|Lastname] (DESIGN.md §Pills). */
  .cs-bar .idb.pb { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .cs-bar .idb-u { display: inline-flex; }
  .idb.pb.no-unit .idb-u { display: none !important; }

  /* ---------- Qtr availability tint (one position: mine, else the first selected) ---------- */
  :root { --av-open: #b9e6c4; --av-over: #fcc98f; --av-full: #f7aaa4; --av-open-dot: #1e7a3a; --av-over-dot: #c2560a; --av-full-dot: #b3261e; }
  /* Dark mode: vivid "trading app" good / caution / bad — green #00C805, orange #FF9F0A, red #FF3B30 over the dark surface. */
  :root[data-theme="dark"] { --av-open: color-mix(in srgb, #00C805 34%, #17181d); --av-over: color-mix(in srgb, #FF9F0A 40%, #17181d); --av-full: color-mix(in srgb, #FF3B30 42%, #17181d);
    --av-open-dot: #00C805; --av-over-dot: #FF9F0A; --av-full-dot: #FF3B30; }
  .qd.av-open, .qd.av-open.wknd { background: var(--av-open); }
  .qd.av-over, .qd.av-over.wknd { background: var(--av-over); }
  .qd.av-full, .qd.av-full.wknd { background: var(--av-full); }
  .qkey { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 4px 12px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .qk-t { font-weight: 800; color: var(--on-surface); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  .qk { display: inline-flex; align-items: center; gap: 6px; }
  .qk i { width: 14px; height: 14px; border-radius: 4px; }
  .qk.av-open i { background: var(--av-open); box-shadow: inset 0 0 0 2px var(--av-open-dot); }
  .qk.av-over i { background: var(--av-over); box-shadow: inset 0 0 0 2px var(--av-over-dot); }
  .qk.av-full i { background: var(--av-full); box-shadow: inset 0 0 0 2px var(--av-full-dot); }

  /* Request and Stats tables: Last Name (.stk) stays pinned to the left edge while the rest scrolls sideways. */
  .rtable .stk { position: sticky; left: 0; box-shadow: inset -1px 0 0 var(--line), 6px 0 8px -6px rgba(0, 0, 0, .35); }
  .rtable tbody td.stk { z-index: 1; background: var(--card); }
  .rtable tbody tr:nth-child(even) td.stk { background: color-mix(in srgb, var(--card-2) 55%, var(--card)); }
  .rtable tbody tr:hover td.stk { background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
  .rtable thead th.stk { z-index: 3; }

  /* ---------- Profile page (same panel layout as Admin) ---------- */
  .profile-page .panel { max-width: 720px; }
  .profile-page #passkey { max-width: 220px; }

  /* ---------- Admin page (settings only) — mobile first ---------- */
  .admin-page .toolbar { flex-wrap: nowrap; padding: 8px 12px; gap: 8px; }
  .admin-page .cfg-tools { margin-left: auto; display: flex; gap: 8px; }
  .admin-page a.btn { text-decoration: none; }
  .admin-page .panel { max-width: 760px; padding: 16px; }
  .admin-page .panel h3 { margin: 0 0 6px; }
  .admin-page .panel h3 .ct { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .cfg-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cfg-h h3 { margin: 0 !important; }
  .cfg-help { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .cfg-search { position: relative; margin-bottom: 6px; }
  .cfg-search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .cfg-search input { height: 44px; padding-left: 38px; border-radius: 22px; border: 1px solid var(--outline); background: transparent; }
  .cfg-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .cfg-row:first-child { border-top: 0; }
  .cfg-row[hidden] { display: none; }
  .cfg-row .idb { margin-right: 0; }

  /* ---------- All / Mine list bar: same controls and order as the calendar bar ----------

  .lbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
  .lsearch { flex: 1 1 160px; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 20px; color: var(--muted); }

  .choices .choice.pass:hover, .choices .choice.pass.on { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  @media (max-width: 700px) {

  .fs-sheet { max-width: 440px; }

  .fs-sheet .modal-f .btn { flex: 1; }

  /* Swipe cue: a round ‹ / › chip that fades in at the edge you swiped toward, then out (≈0.6s). */
  .swipe-cue { position: fixed; top: 50%; z-index: 60; width: 52px; height: 52px; margin-top: -26px; display: grid; place-items: center; border-radius: 50%;
    background: var(--sel-bg); color: var(--sel-ink); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; animation: swipeCue .6s ease-out forwards; }

  @keyframes swipeCue { 0% { opacity: 0; transform: translateX(var(--sx)); } 25% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }

  /* Disabled buttons look disabled, whatever their variant (e.g. Approve on an approved request, Deny on a denied one). */
  .btn:disabled, .btn.ok:disabled, .btn.bad:disabled, .btn.primary:disabled, .btn.req-btn:disabled, .btn.del:disabled {

  /* Sync indicator: the Profile tab icon spins a ring while changes save; a red dot if a save failed. */
  .nav-ic { position: relative; }

    border: 2.5px solid color-mix(in srgb, var(--primary) 25%, transparent); border-top-color: var(--primary); animation: spin .8s linear infinite; }

  @media (prefers-reduced-motion: reduce) { .nav-ic.syncing::after { animation-duration: 2.4s; } }
  /* Admin → Request length */
  .cfg-len { display: grid; grid-template-columns: 64px minmax(0, 110px) minmax(0, 200px); gap: 12px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }

  /* Conflict chip on request rows: red while any request in the over-max day is pending, grey once all approved. Opens the resolver. */
  .cfl { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; margin-left: 6px; border-radius: 4px; border: 0; font: inherit; font-size: 12.5px; font-weight: 800; white-space: nowrap; cursor: pointer; vertical-align: middle; }

  .st-cell { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
  .cfl-count { display: inline-flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 800; }
  /* Home-screen (standalone) app on iPhone: keep the top bar clear of the status bar / notch (0 everywhere else).
     The status-bar strip is painted in the top bar's colour, so iOS's edge fade there blends into a solid colour
     instead of fading the controls; the bottom (home indicator) area is the nav's own colour. */
  #app { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  #app::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--card); z-index: 50; pointer-events: none; }
  html, body { background: var(--nav-bg); }

  /* Request form, date step: calendar first, compact date fields under it. */
  .wiz-dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 2px 0 8px; }
  .wiz-dates .field { min-width: 0; }
  .wiz-dates input[type="date"] { display: block; width: 100%; min-width: 0; max-width: 100%; height: 44px; padding: 0 10px; box-sizing: border-box;
    font-size: 16px; -webkit-appearance: none; appearance: none; text-align: left; }
  .wiz-dates input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  /* Selected range: green where it fits, orange where it would overbook, red where slots are already full. */
  :root { --rg-ok: #1e7a3a; --rg-ok-ink: #ffffff; --rg-over: #c2560a; --rg-over-ink: #ffffff; --rg-full: #b3261e; --rg-full-ink: #ffffff; }
  :root[data-theme="dark"] { --rg-ok: #86d99a; --rg-ok-ink: #17181d; --rg-over: #fdba74; --rg-over-ink: #17181d; --rg-full: #ffb4ab; --rg-full-ink: #17181d; }
  .mini-g button.in { border-radius: 0; font-weight: 800; }
  .mini-g button.rg-ok { background: var(--rg-ok); color: var(--rg-ok-ink); }
  .mini-g button.rg-over { background: var(--rg-over); color: var(--rg-over-ink); }
  .mini-g button.rg-full { background: var(--rg-full); color: var(--rg-full-ink); }
  .mini-g button.r-s { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }

  .mini-g button.dot-over::after, .mini-g button.dot-full::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; margin: -2px auto 0; }
  .mini-g button.dot-over::after { background: var(--rg-over); } .mini-g button.dot-full::after { background: var(--rg-full); }
  .mini-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
  .mk { width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; } .mk-ok { background: var(--rg-ok); } .mk-over { background: var(--rg-over); } .mk-full { background: var(--rg-full); }
  .wiz-type .seg { display: flex; width: 100%; height: 44px; } .wiz-type .seg button { flex: 1 1 0; }

  /* Full-screen "Submitting…" cover (request submit / save). */

  .blocker-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 32px; border-radius: 20px; background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,.4); text-align: center; }
  .blocker-spin { width: 56px; height: 56px; border-radius: 50%; border: 5px solid color-mix(in srgb, var(--primary) 22%, transparent); border-top-color: var(--primary); animation: spin .9s linear infinite; }
  .blocker-t { font-size: 20px; font-weight: 800; color: var(--on-surface); }

  /* Week view: today's column gets a light tint behind the bars. */

  /* ---------- Request tables (All / Mine): Leave / Pass bands, status icons, approved tint ---------- */
  .rtable tbody.grp .grp-h th { padding: 0; background: var(--surface-high); border-top: 2px solid var(--outline); border-bottom: 1px solid var(--outline);

  /* ---------- Day marker: ONE implementation for Month (desktop + phone), Stats, Week, Qtr and the day strip ----------

    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'

  function icon(name, size, cls) {

    return '<svg class="ic ' + (cls || '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  /* ================================================================ */
  /* Utilities                                                          */
  /* ================================================================ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bcpal.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bcpal.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem('bcpal.' + k); } catch (e) { /* storage unavailable */ } }
  };

  // All calendar math uses 'YYYY-MM-DD' strings and UTC to avoid DST drift.
  const D = {
    parse(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); },
    fmt(dt) { return dt.toISOString().slice(0, 10); },
    add(s, n) { return D.fmt(new Date(D.parse(s).getTime() + n * 864e5)); },
    diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
    days(a, b) { return D.diff(a, b) + 1; },
    dow(s) { return D.parse(s).getUTCDay(); },
    addMonths(s, n) { const d = D.parse(s); return D.fmt(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1))); },
    monthStart(s) { return s.slice(0, 8) + '01'; },
    weekStart(s) { return D.add(s, -D.dow(s)); },
    f(s, o) { return D.parse(s).toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, o)); },
    short(s) { return D.f(s, { month: 'short', day: 'numeric' }); },
    min(a, b) { return a < b ? a : b; },
    max(a, b) { return a > b ? a : b; },
    valid(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
  };
  function localToday() {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }
  const fmtTs = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const ROLES = ['Pilot', 'Boom', 'Other'];
  const RANKS = ['Col', 'Lt Col', 'Maj', 'Capt', '1st Lt', '2d Lt', 'CMSgt', 'SMSgt', 'MSgt', 'TSgt', 'SSgt', 'SrA', 'A1C', 'Amn', 'Civ'];
  const ROLE_LABEL = { Pilot: 'Pilots', Boom: 'Booms', Other: 'Other' };

  /* ================================================================ */
  /* State                                                              */
  /* ================================================================ */
  const S = {
    token: store.get('token', null),
    me: null, isAdmin: false, users: [], requests: [], sheetUrl: '',
    settings: { pilotQuota: 2, boomQuota: 2, otherQuota: 0, leaveMaxDays: 10, leaveMode: 'warn', passMaxDays: 4, passMode: 'limit' },
    today: localToday(),
    view: store.get('view', 'calendar'),
    cal: store.get('cal', 'month'),
    cursor: localToday(),
    // Calendar filters: any combination of each group (at least one stays selected).
    f: { status: ['Approved', 'Pending', 'Denied'], role: ['Pilot', 'Boom', 'Other'], type: ['Leave', 'Pass'], person: '' }, openDrop: null, monthMode: (() => { try { return localStorage.getItem('pal.monthMode') || 'events'; } catch (e) { return 'events'; } })(),
    list: store.get('list', { q: '', status: 'All', role: 'All', type: 'All', sort: 'submitted', dir: 'desc' }),
    mine: { status: 'All', sort: 'start', dir: 'desc' },
    mf: { status: ['Approved', 'Pending', 'Denied'], type: ['Leave', 'Pass'] }, mineMode: store.get('mineMode', 'list'), mineConf: false,
    people: { period: '12m', q: '', sort: 'last', dir: 'asc', inactive: false },
    sel: null,
    theme: store.get('theme', 'system'),
    modal: null, wiz: null, rowH: 0, busy: false, focus: null
  };
  S.list.q = '';
  S.list.sort = ({ depart: 'start', ret: 'end', name: 'last', duration: 'days' })[S.list.sort] || S.list.sort;
  // Multi-level sort: sorts[0] is the main sort; earlier choices stay as tie-breakers (max 3).
  [S.list, S.mine, S.people].forEach(st => { if (!Array.isArray(st.sorts)) st.sorts = [{ k: st.sort, dir: st.dir }]; });
  if (S.view === 'admin' || S.view === 'people' || S.view === 'roster') S.view = 'calendar';

  let IDX = { users: new Map(), live: [], counts: new Map(), ytd: new Map(), disp: new Map() };
  function reindex() {
    const users = new Map(S.users.map(u => [u.id, u]));
    const live = S.requests.filter(r => r.status !== 'Cancelled' && users.has(r.userId) && D.valid(r.start) && D.valid(r.end));
    const counts = new Map();
    // Daily max counts Leave only; Passes have no limit.
    live.forEach(r => {
      if (r.status === 'Denied' || r.type !== 'Leave') return;
      const role = users.get(r.userId).role;
      for (let d = r.start; d <= r.end; d = D.add(d, 1)) counts.set(d + '|' + role, (counts.get(d + '|' + role) || 0) + 1);
    });
    const yr = S.today.slice(0, 4), ytd = new Map();
    live.forEach(r => {
      if (r.status !== 'Approved') return;
      const s = D.max(r.start, yr + '-01-01'), e = D.min(r.end, D.min(S.today, yr + '-12-31'));
      if (s > e) return;
      const t = ytd.get(r.userId) || { Leave: 0, Pass: 0 };
      t[r.type] += D.days(s, e);
      ytd.set(r.userId, t);
    });
    // Duplicates: the same member with overlapping (non-denied) requests — leave with pass, or any two.
    const dups = new Map();
    const active = live.filter(r => r.status !== 'Denied');
    active.forEach(a => active.forEach(b => {
      if (a.id !== b.id && a.userId === b.userId && a.start <= b.end && a.end >= b.start) {
        if (!dups.has(a.id)) dups.set(a.id, []);
        dups.get(a.id).push(b);
      }
    }));
    // Calendar labels: last name, plus initials only when needed to tell members apart (Smith, J · Smith, JN).
    const disp = new Map(), act = S.users.filter(u => u.active !== false && u.active !== 'false');
    const parts = u => { const t = u.name.trim().split(/\s+/); return { l: t[t.length - 1], f: (t[0] || '').charAt(0).toUpperCase(), m: t.length > 2 ? t[1].charAt(0).toUpperCase() : '' }; };
    S.users.forEach(u => {
      const p = parts(u), same = act.filter(x => x.id !== u.id && parts(x).l.toLowerCase() === p.l.toLowerCase());
      if (!same.length) return disp.set(u.id, p.l);
      const sameF = same.filter(x => parts(x).f === p.f);
      disp.set(u.id, p.l + ', ' + p.f + (sameF.length && p.m ? p.m : ''));
    });
    IDX = { users, live, counts, ytd, dups, disp };
  }
  const userOf = id => IDX.users.get(id) || { id, rank: '', name: 'Unknown', role: 'Other', unit: '—' };
  const lastName = u => u.name.trim().split(/\s+/).pop();
  /** Name on calendar bars and filters: last name, with initials added only when another member shares it. */
  const calName = u => IDX.disp.get(u.id) || lastName(u);
  /* Unit badges (MKE, PIT, …). Admins manage the list and each badge's colour in Admin → Unit badges. */
  const BADGE_STYLES = ['navy', 'gold', 'crimson', 'teal', 'purple', 'slate', 'orange', 'black', 'green'];
  const unitsList = () => (S.settings.units && S.settings.units.length) ? S.settings.units : [{ code: 'MKE', name: 'Milwaukee', style: 'navy' }, { code: 'PIT', name: 'Pittsburgh', style: 'gold' }];
  function unitBadge(code) {
    const un = unitsList().find(x => x.code === code);
    return '<span class="ub ub-' + (un ? un.style : 'slate') + '" title="' + esc(un ? un.name : code) + '">' + esc(code) + '</span>';
  }
  const fullName = u => (u.rank ? u.rank + ' ' : '') + u.name + ' (' + u.unit + ')';
  const initials = u => u.name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
  function quota(role) {
    const q = role === 'Pilot' ? S.settings.pilotQuota : role === 'Boom' ? S.settings.boomQuota : S.settings.otherQuota;
    return Number(q) || 0; // 0 = unlimited
  }
  const countOn = (d, role) => IDX.counts.get(d + '|' + role) || 0;
  function conflictDays(r) {
    const u = userOf(r.userId), q = quota(u.role);
    if (!q || r.type !== 'Leave' || r.status === 'Denied' || r.status === 'Cancelled') return [];
    const out = [];
    for (let d = r.start; d <= r.end; d = D.add(d, 1)) if (countOn(d, u.role) > q) out.push(d);
    return out;
  }
  /** Length rule for a request type (Admin → Request length): max days, and 'limit' (blocked) or 'warn' (flagged). */
  const lenRule = t => t === 'Pass'
    ? { max: S.settings.passMaxDays || 4, mode: S.settings.passMode || 'limit' }
    : { max: S.settings.leaveMaxDays || S.settings.leaveCautionDays || 10, mode: S.settings.leaveMode || 'warn' };
  /** Over its type's max days (flagged for leadership when the rule is Warn). */
  const isCaution = r => D.days(r.start, r.end) > lenRule(r.type).max;
  const cautionText = r => (r.type === 'Pass' ? 'Pass' : 'Leave') + ' over ' + lenRule(r.type).max + ' days';
  /** The calendar is showing: the Calendar tab, or My Requests in Calendar mode. */
  const isCalView = () => S.view === 'calendar' || (S.view === 'mine' && S.mineMode === 'cal');
  /** My Requests calendar: my requests (status / type filters), plus — with Show conflicts on — other members'
   *  leave or passes in my position that overlap my own leave or passes (same type). */
  function mineCalRequests() {
    const F = S.mf, myRole = (IDX.users.get(S.me) || {}).role;
    const mine = IDX.live.filter(r => r.userId === S.me && F.status.includes(r.status) && F.type.includes(r.type));
    if (!S.mineConf) return mine;
    const active = mine.filter(r => r.status !== 'Denied');
    const others = IDX.live.filter(r => r.userId !== S.me && r.status !== 'Denied' && F.type.includes(r.type) && userOf(r.userId).role === myRole &&
      active.some(m => m.type === r.type && m.start <= r.end && m.end >= r.start));
    return mine.concat(others);
  }
  /** Conflict mode: a leave request on a day where its position is over the daily max. */
  const inConflict = r => conflictDays(r).length > 0;
  /** Over the daily max on some day and not yet resolved (not every request in that conflict is approved). */
  const openConflictOf = r => r.status !== 'Denied' && conflictDays(r).some(d => conflictState(d, userOf(r.userId).role) === 'bad');
  /** Marks before a name on calendar bars: green dot = out today, red triangle = unresolved conflict. */
  const barMarks = r => (isNow(r) ? '<i class="now-dot" title="Active now"></i>' : '') +
    (openConflictOf(r) ? '<span class="cf-tri" title="Unresolved conflict" aria-label="Unresolved conflict">' + icon('alert', 12) + '</span>' : '');
  /** Conflict mode with a person picked: their requests that are over the max, plus the other requests (same position,
   *  not denied) on those same over-max days — i.e. who they conflict with. */
  function conflictsWith(pid) {
    const mine = IDX.live.filter(r => r.userId === pid && inConflict(r));
    const keep = new Set(mine.map(r => r.id));
    mine.forEach(m => {
      const role = userOf(m.userId).role, days = conflictDays(m);
      IDX.live.forEach(r => { if (r.type === 'Leave' && r.status !== 'Denied' && userOf(r.userId).role === role && days.some(d => r.start <= d && r.end >= d)) keep.add(r.id); });
    });
    return keep;
  }
  /** Shared filter test for person + conflict mode (calendar, All, day view). */
  function personConfOk(r, F) {
    if (!F.conf) return !F.person || r.userId === F.person;
    if (!F.person) return inConflict(r);
    if (!(F._cw && F._cwFor === F.person && F._cwIdx === IDX)) { F._cwFor = F.person; F._cwIdx = IDX; F._cw = conflictsWith(F.person); } // cached until data changes
    return F._cw.has(r.id);
  }
  function calRequests() {
    if (S.view === 'mine') return mineCalRequests();
    return IDX.live.filter(r => S.f.status.includes(r.status) && S.f.role.includes(userOf(r.userId).role) && S.f.type.includes(r.type) && personConfOk(r, S.f));
  }

  /* ================================================================ */
  /* Server bridge                                                      */
  /* ================================================================ */
  /* Server bridge. Served by Apps Script (doGet) → google.script.run. Served elsewhere (GitHub Pages) →
     POST {fn, args} to the Apps Script web-app URL in window.PAL_API_URL (config.js); doPost answers {ok, result|error}. */
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    const fail = (err, reject) => {
      const raw = (err && err.message) || String(err);
      const msg = raw.replace(/^(Exception|Error):\s*/i, '');
      if (/AUTH:/.test(msg)) { signOutLocal(); return reject(new Error(msg.replace(/.*AUTH:\s*/, ''))); }
      if (/MUSTCHANGE:/.test(msg)) { closeModal(); showSetPin(null); return reject(new Error('Set a new PIN to continue.')); }
      reject(new Error(msg));
    };
    return new Promise((resolve, reject) => {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(err => fail(err, reject))[fn].apply(null, args);
        return;
      }
      const url = window.PAL_API_URL;
      if (!url || /PASTE/.test(url)) return reject(new Error('This copy of the app isn’t connected yet — set the web-app URL in config.js.'));
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), redirect: 'follow' })
        .then(r => { if (!r.ok) throw new Error('The server could not be reached (' + r.status + '). Try again.'); return r.json(); })
        .then(res => res && res.ok ? resolve(res.result) : fail(new Error((res && res.error) || 'Unknown server error.'), reject))
        .catch(err => fail(/Failed to fetch|NetworkError|Load failed/i.test(err.message) ? new Error('No connection to the server. Check your signal and try again.') : err, reject));
    });
  }
  /** Call the server with a busy toast; returns null on failure (error is toasted). */
  async function run(label, fn) {
    if (S.busy) return null;
    S.busy = true;
    toast(label, 'busy', 0);
    try {
      const res = await call.apply(null, Array.prototype.slice.call(arguments, 1));
      hideToast();
      return res;
    } catch (e) {
      toast(e.message, 'error', 4500);
      return null;
    } finally { S.busy = false; }
  }
  /* ---------- Background saves ----------
     save(mutate, fn, ...args): change the local copy now (mutate), redraw, and send the change to the server in the
     background. Saves run one at a time, in order. When the last one finishes the app takes the server's copy; if any
     failed, it reloads from the server (undoing what didn't save) and shows the error. While saves are pending the
     Profile icon spins and closing the page asks for confirmation. */
  let saveChain = Promise.resolve(), lastSaved = null, resync = false;

    const args = Array.prototype.slice.call(arguments, 1);

    S.pending = (S.pending || 0) + 1; S.syncErr = false; saveGen++; syncUI();
    const done = saveChain.then(() => call.apply(null, args)).then(
      data => { lastSaved = data; return data; },
      e => { resync = true; toast(e.message, 'error', 6000); return null; });
    saveChain = done.then(async () => {
      S.pending--;
      if (!S.pending) {
        if (resync) {
          resync = false; S.syncErr = true;
          try { apply(await call('apiBootstrap', S.token)); } catch (e) { /* the next refresh retries */ }
        } else if (lastSaved) apply(lastSaved);
        lastSaved = null;
        redrawAfterSave();

      syncUI();

  }

  function filterSummary(sc) {

    icon('alert', 18) + '<span class="bl">Conflicts</span></button>';
  /** Conflict mode banner: red bar with the count and an ✕ to leave the mode. */
  function confBanner(n) {
    if (!S.f.conf) return '';
    return '<div class="conf-banner" role="status">' + icon('alert', 18) + '<span><b>Conflict mode</b> · ' + (S.f.person ? esc(fullName(userOf(S.f.person))) + ' and who they conflict with · ' + plural(n, 'request')

      // With a person picked, lead with their badge and "Last, First" (as in the picker) instead of the sliders icon.
      (person ? idBadge(userOf(st.person)) + '<span>' + nameHtml(userOf(st.person), true) + (parts.length > 1 ? ' · ' + esc(parts.slice(1).join(' · ')) : '') + '</span>'

        (S.mineConf ? icon('check', 18) : '') + 'Show conflicts</button><p class="fs-help">Adds other members’ leave and passes in your position that overlap yours.</p>') : '') +
      '</div><div class="modal-f"><button class="btn" data-act="resetFilters"' + scAttr(sc) + '>Reset</button><button class="btn primary" data-act="closeModal">Done</button></div>';

  const isCompact = () => window.matchMedia('(max-width: 700px)').matches;

  function renderMonth() {

    const reqs = calRequests();
    let html = '<div class="month"><div class="dow-row">' + DOW.map(d => '<div>' + d + '</div>').join('') + '</div>' +

  // Segments that continue an absence already on screen are placed before new ones.

  // requests last. Within a type, bars that include you sort first.
  const STACK = ['Leave', 'Pass', 'Denied'];
  function pinnedIds() {
    const ids = [];
    if (S.focus && IDX.live.some(r => r.id === S.focus)) ids.push(S.focus);
    return ids;
  }
  const stackOrder = () => pinnedIds().map(id => 'pin:' + id).concat(STACK);
  // Only a focused request is lifted out of the shared middle-day bars; your own requests merge like everyone
  // else's (one bar per type) and are simply sorted first within their type.
  const isPinned = r => r.id === S.focus;
  const hasMe = sg => sg.people.some(r => r.userId === S.me) ? 1 : 0;
  const stackCat = r => isPinned(r) ? 'pin:' + r.id : r.status === 'Denied' ? 'Denied' : r.type;
  const stackRank = r => r.id === S.focus ? -2 : r.userId === S.me ? -1 : STACK.indexOf(r.status === 'Denied' ? 'Denied' : r.type);
  const byLast = (a, b) => lastName(userOf(a.userId)).localeCompare(lastName(userOf(b.userId)));

  /** split = true: every request that starts this week is its own continuous bar. Requests carried over from the
   *  previous week are always merged into one shared middle bar per type (Leave / Pass) at the start of the row. */
  function monthSegments(ws, reqs, split) {
    const we = D.add(ws, 6);
    const days = Array.from({ length: 7 }, (_, i) => D.add(ws, i));
    const evs = reqs.filter(r => r.start <= we && r.end >= ws);
    const segs = [];
    evs.forEach(r => {
      const cat = stackCat(r);
      if (r.start === r.end) segs.push({ kind: 'single', cat, type: r.type, a: D.diff(ws, r.start), b: D.diff(ws, r.start), people: [r] });
      else {
        if (r.start >= ws) segs.push({ kind: 'start', cat, type: r.type, a: D.diff(ws, r.start), b: D.diff(ws, r.start), people: [r] });
        if (r.end <= we) segs.push({ kind: 'end', cat, type: r.type, a: D.diff(ws, r.end), b: D.diff(ws, r.end), people: [r] });
      }
    });
    // Pinned requests (or every request, when split) get their own middle segment instead of joining a shared bar.
    evs.filter(r => ((split && r.start >= ws) || isPinned(r)) && D.days(r.start, r.end) > 2).forEach(r => {
      const a = D.max(D.add(r.start, 1), ws), b = D.min(D.add(r.end, -1), we);
      if (a <= b) segs.push({ kind: 'mid', cat: stackCat(r), type: r.type, a: D.diff(ws, a), b: D.diff(ws, b), people: [r] });
    });

      let cur = null;
      days.forEach((d, i) => {

        const key = set.map(r => r.id).join('|');
        if (cur && key && key === cur.key) { cur.b = i; return; }
        cur = key ? { kind: 'mid', cat: t, type: set[0].type, a: i, b: i, people: set, key } : null;
        if (cur) segs.push(cur);
      });
    });
    return segs;
  }

  /* Phone month view: no names (they can't fit) — each day shows a blue Leave count and a gold Pass count.
     Tap a day for Day view with everyone listed. */
  /* MacroFactor-style meter: letter, "count/max", thin bar. Each position has its own colour;
     the bar and number turn red when the daily max is exceeded. */
  function roleMeter(role, c, size) {
    const q = quota(role), over = q && c > q, full = q && c === q;
    const pct = q ? Math.min(100, c / q * 100) : Math.min(100, c * 25);
    return '<span class="rm rm-' + role[0].toLowerCase() + (over ? ' over' : full ? ' full' : '') + (c ? '' : ' zero') + (size ? ' ' + size : '') + '">' +
      '<span class="rm-t"><b>' + role[0] + '</b><span class="rm-c">' + c + '</span>' + (q ? '<span class="rm-q">/' + q + '</span>' : '') + '</span>' +
      '<span class="rm-bar"><i style="width:' + pct + '%"></i></span></span>';
  }
  /** Leave slots used per position on a day: Leave only (passes have no daily max), honouring the
   *  status and person filters but not the Leave/Pass toggle, so the meters always show slot usage. */
  function filteredRoleCounts(d) {
    const out = { Pilot: 0, Boom: 0, Other: 0 };
    IDX.live.forEach(r => {
      if (r.type !== 'Leave' || r.start > d || r.end < d || !countable(r) || !S.f.status.includes(r.status) || (S.f.person && r.userId !== S.f.person)) return;
      out[userOf(r.userId).role]++;
    });
    return out;
  }
  /* Phone month view: each day shows P / B / O meters (count vs daily max) for the current filters.
     Tap a day for Day view with everyone listed. */
  /* Phone month view: event strips like the Week view. Each request is one bar per week row, labelled with the
     person puck [P|MKE|Lastname ✓] at the start of the bar in each row. Up to 3 lanes per row; extra people on a day show "+N".
     Tap a day (or "+N") for Day view; tap a bar to open the request. */
  function renderMonthCompact() {
    if (S.monthMode === 'stats') return renderMonthStats();
    const ms = D.monthStart(S.cursor), month = ms.slice(0, 7), gs = D.weekStart(ms);
    const weeks = Math.ceil((D.dow(ms) + D.diff(ms, D.addMonths(ms, 1))) / 7);
    const all = calRequests();
    const live = all.filter(countable);
    const roles = ROLES.filter(r => S.f.role.includes(r));
    // Lanes per week row: as many 22px bars as fit the measured row height (1–3), so the month fits the screen without scrolling.
    const MAXL = S.phoneLanes || 3;
    let html = '<div class="month compact strips" style="--lanes:' + MAXL + '"><div class="dow-row">' + DOW.map(d => '<div>' + d[0] + '</div>').join('') + '</div>' +
      '<div class="month-grid" style="--weeks:' + weeks + '">';
    for (let w = 0; w < weeks; w++) {
      const ws = D.add(gs, w * 7), we = D.add(ws, 6);
      const days = Array.from({ length: 7 }, (_, i) => D.add(ws, i));
      const evs = all.filter(r => r.start <= we && r.end >= ws)
        .sort((x, y) => stackRank(x) - stackRank(y) || (x.start < y.start ? -1 : x.start > y.start ? 1 : D.diff(y.start, y.end) - D.diff(x.start, x.end)) || byLast(x, y));
      // Lane packing: each bar takes the first lane free across all its days.
      const lanes = [], placed = [];
      evs.forEach(r => {
        const a = D.diff(ws, D.max(r.start, ws)), z = D.diff(ws, D.min(r.end, we));
        let l = 0;
        while ((lanes[l] || []).slice(a, z + 1).some(Boolean)) l++;
        lanes[l] = lanes[l] || [];
        for (let i = a; i <= z; i++) lanes[l][i] = true;
        placed.push({ r, a, z, l });
      });
      // Lanes above the last are always shown. The last lane shows a bar only if none of its days overflow;
      // on days that do, that slot holds "+N" for everyone not shown.
      const over = days.map((_, i) => placed.filter(p => p.l >= MAXL && p.a <= i && p.z >= i).length > 0);
      const shown = p => p.l < MAXL - 1 || (p.l === MAXL - 1 && !over.slice(p.a, p.z + 1).some(Boolean));
      const hidden = days.map((_, i) => placed.filter(p => !shown(p) && p.a <= i && p.z >= i).length);
      const bars = placed.filter(shown).map(p => {
        const r = p.r, u = userOf(r.userId), first = r.start >= ws, last = r.end <= we;
        const cls = ['cs-bar', r.type === 'Leave' ? 'leave' : 'pass', 'st-' + r.status.toLowerCase(), first ? 'b-s' : '', last ? 'b-e' : '', r.userId === S.me ? 'mine' : ''].join(' ');
        return '<span class="' + cls + '" style="grid-row:' + (p.l + 1) + ';grid-column:' + (p.a + 1) + '/' + (p.z + 2) + '" role="button" tabindex="0" data-act="openReq" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' +
          personBadge(r, true) + '</span>';
      }).join('') + hidden.map((n, i) => n ? '<span class="cs-more" style="grid-row:' + MAXL + ';grid-column:' + (i + 1) + '" data-act="pickDay" data-date="' + days[i] + '">+' + n + '</span>' : '').join('');
      html += '<div class="week-row">';
      days.forEach(d => {
        const c = filteredRoleCounts(d);
        const over = roles.filter(role => quota(role) && c[role] > quota(role));
        const label = D.f(d, { weekday: 'long', month: 'long', day: 'numeric' }) + ': ' +
          roles.map(role => c[role] + ' ' + ROLE_PLURAL[role] + ' on leave' + (quota(role) ? ' of ' + quota(role) : '')).join(', ') + (over.length ? '. Over daily max for ' + over.join(' and ') : '');
        html += '<button class="cell cc' + (d.slice(0, 7) !== month ? ' out' : '') + (d === S.today ? ' today' : '') + (over.length ? ' over' : '') + '" data-act="pickDay" data-date="' + d + '" aria-label="' + esc(label) + '">' +
          '<span class="cc-n">' + Number(d.slice(8)) + '</span></button>';
      });
      html += '<div class="cs-lanes">' + bars + '</div></div>';
    }
    return html + '</div></div>';
  }


  /* Phone month, Stats mode: each day shows P / B / O meters (count vs daily max) for the current filters. */
  function renderMonthStats() {
    const ms = D.monthStart(S.cursor), month = ms.slice(0, 7), gs = D.weekStart(ms);
    const weeks = Math.ceil((D.dow(ms) + D.diff(ms, D.addMonths(ms, 1))) / 7);
    const reqs = calRequests().filter(countable);
    const roles = ROLES.filter(r => S.f.role.includes(r));
    let html = '<div class="month compact"><div class="dow-row">' + DOW.map(d => '<div>' + d[0] + '</div>').join('') + '</div>' +
      '<div class="month-grid" style="--weeks:' + weeks + '">';
    for (let w = 0; w < weeks; w++) {
      html += '<div class="week-row">';
      for (let i = 0; i < 7; i++) {
        const d = D.add(gs, w * 7 + i);
        const c = filteredRoleCounts(d);
        const over = roles.filter(role => quota(role) && c[role] > quota(role));
        const label = D.f(d, { weekday: 'long', month: 'long', day: 'numeric' }) + ': ' +
          roles.map(role => c[role] + ' ' + ROLE_PLURAL[role] + ' on leave' + (quota(role) ? ' of ' + quota(role) : '')).join(', ') + (over.length ? '. Over daily max for ' + over.join(' and ') : '');
        html += '<button class="cell cc' + (d.slice(0, 7) !== month ? ' out' : '') + (d === S.today ? ' today' : '') + '" data-act="pickDay" data-date="' + d + '" aria-label="' + esc(label) + '">' +
          '<span class="cc-n">' + Number(d.slice(8)) + '</span>' + roles.map(role => roleMeter(role, c[role])).join('') + '</button>';
      }
      html += '</div>';
    }
    return html + '</div></div>';
  }

  /** Lane packing, stacked Leave → Pass → Denied, continuing each person's bar in the lane it was already in.
   *  Returns the sorted segments (each with .lane) and lanes[l] = last column used. */
  function packMonthWeek(segs) {
    // Same start column: continuing pieces first; among those, the one whose request runs longest claims the shared lane,
    // so the longest bar stays unbroken on top and a bar that is about to end drops down instead.
    const lastEnd = sg => sg.people.reduce((m, r) => r.end > m ? r.end : m, '');
    const byRun = (x, y) => cont(x) && cont(y) ? (lastEnd(y) > lastEnd(x) ? 1 : lastEnd(y) < lastEnd(x) ? -1 : 0) : 0;
    segs.sort((x, y) => x.a - y.a || cont(y) - cont(x) || byRun(x, y) || hasMe(y) - hasMe(x) || (y.b - y.a) - (x.b - x.a) || byLast(x.people[0], y.people[0]));
    const lanes = [];
    const laneOf = new Map();    // request id -> lane of its most recent segment
    const ends = new Map();      // request id -> column its most recent segment ended
    let base = 0;
    const place = sg => {
      const free = l => lanes[l] === undefined || lanes[l] < sg.a;
      let l = -1;
      for (const r of sg.people) {
        const pl = laneOf.get(r.id);
        if (pl !== undefined && ends.get(r.id) === sg.a - 1 && free(pl)) { l = pl; break; }
      }
      // A bar that continues from the previous day keeps its lane, so each person reads as one straight line.
      // Only new bars take the highest free lane.
      if (l < 0) { l = base; while (!free(l)) l++; }
      lanes[l] = sg.b;
      sg.lane = l;
      sg.people.forEach(r => { laneOf.set(r.id, l); ends.set(r.id, sg.b); });
    };
    stackOrder().forEach(cat => {
      segs.filter(sg => sg.cat === cat).forEach(place);
      base = lanes.length;
    });
    return { segs, lanes };
  }

  function renderMonthWeek(ws, month, reqs) {
    const days = Array.from({ length: 7 }, (_, i) => D.add(ws, i));
    const m = monthMetrics();
    const lineH = m.barH + 2, moreH = 16;
    const avail = m.rowH - m.headH - 2;
    // Prefer one unbroken bar per person. Only when those don't all fit in the row are middle days
    // merged into shared (hatched) bars per type.
    let { segs, lanes } = packMonthWeek(monthSegments(ws, reqs, true));
    if (lanes.length * lineH > avail) ({ segs, lanes } = packMonthWeek(monthSegments(ws, reqs, false)));
    // A one-person middle bar whose start puck is in this row doesn't repeat the name.
    const startIds = new Set(segs.filter(sg => sg.kind === 'start').map(sg => sg.people[0].id));
    segs.forEach(sg => { sg.quiet = sg.kind === 'mid' && sg.people.length === 1 && startIds.has(sg.people[0].id); });

    // Fit to the measured row height.
    let ln = lanes.length;
    if (ln * lineH > avail) while (ln > 0 && ln * lineH + moreH > avail) ln--;

    const hidden = days.map(() => 0);
    let overlay = '';
    segs.forEach(sg => {
      if (sg.lane >= ln) { for (let i = sg.a; i <= sg.b; i++) hidden[i] += sg.people.length; return; }
      overlay += segHtml(sg);
    });
    const rowsTpl = Array.from({ length: ln }, () => lineH + 'px').join(' ') || 'none';

    let html = '<div class="week-row">';
    days.forEach((d, i) => {
      const over = ROLES.filter(role => quota(role) && countOn(d, role) > quota(role));
      const cls = ['cell', d.slice(0, 7) !== month ? 'out' : '', d === S.today ? 'today' : '', (i === 0 || i === 6) ? 'wknd' : ''].join(' ');
      html += '<div class="' + cls + '" data-act="pickDay" data-date="' + d + '">' +
        '<div class="cell-head"><button class="dnum" data-act="gotoDay" data-date="' + d + '" aria-label="Open day view for ' + D.f(d, { weekday: 'long', month: 'long', day: 'numeric' }) + '">' + Number(d.slice(8)) + '</button>' +
        '<span class="qday">' + qChip(d, 'Pilot') + qChip(d, 'Boom') + qChip(d, 'Other') + '</span>' +
        '</div>' +
        (hidden[i] ? '<button class="more" data-act="dayList" data-date="' + d + '" aria-label="Show all ' + (hidden[i]) + ' more on ' + D.short(d) + '">+' + hidden[i] + '<span class="wide"> more</span></button>' : '') +
        '</div>';
    });
    return html + '<div class="mo' + (S.focus ? ' has-focus' : '') + '" style="top:' + m.headH + 'px;grid-template-rows:' + rowsTpl + '">' + overlay + '</div></div>';
  }

  /* Per-day "P: 1/2" / "B: 3/2" markers: Leave only (Approved + Pending); passes have no limit. Red when over the admin-set max. */
  const ROLE_PLURAL = { Pilot: 'pilots', Boom: 'booms', Other: 'other personnel' };
  function quotaMsg(d, role) {
    const c = countOn(d, role), q = quota(role), day = D.f(d, { weekday: 'short', month: 'short', day: 'numeric' });
    if (!q) return c + ' ' + ROLE_PLURAL[role] + ' requested leave on ' + day + ' (no daily max set).';
    if (c > q) return 'More than ' + q + ' ' + ROLE_PLURAL[role] + ' have requested leave on ' + day + ' — ' + c + ' requested, max is ' + q + '. Passes don’t count.';
    return c + ' of ' + q + ' ' + ROLE_PLURAL[role] + ' requested leave on ' + day + '. Passes don’t count.';
  }
  function qChip(d, role) {
    const c = countOn(d, role), q = quota(role), over = q && c > q;
    const ok = over && conflictState(d, role) === 'ok';
    const msg = quotaMsg(d, role) + (over ? (ok ? ' All approved.' : '') + ' Click to review the conflict.' : '');
    const st = over ? ' over' + (ok ? ' ok' : '') : q && c === q ? ' full' : c ? '' : ' zero';
    return '<button class="qc-day' + st + '" data-act="quotaInfo" data-date="' + d + '" data-role="' + role + '" title="' + esc(msg) + '" aria-label="' + esc(msg) + '">' +
      role[0] + ': ' + c + (q ? '/' + q : '') + '</button>';
  }

  /* ---------- Conflict days ----------
     A day is in conflict when a position is over its daily max (approved + pending). The flag is red while
     any request in the conflict is still pending, and green once every one of them has been approved —
     until a new request joins the conflict and it turns red again. */
  function dayConflicts(d, only) {
    return ROLES.filter(role => (!only || role === only) && quota(role) && countOn(d, role) > quota(role)).map(role => ({
      role, q: quota(role),
      list: IDX.live.filter(r => r.type === 'Leave' && r.status !== 'Denied' && r.start <= d && r.end >= d && userOf(r.userId).role === role).sort(byLast)
    }));
  }
  /** Conflict chip for a request that puts its day over the daily leave max: "Conflict · 3/2" (worst day).
   *  Red while any request in the conflict is pending; grey "Over max · approved" once all are approved.
   *  Opens the conflict resolver for that day. */
  function conflictBadge(r, compact) {
    const cd = conflictDays(r);
    if (!cd.length) return '';
    const role = userOf(r.userId).role, q = quota(role);
    const worst = cd.reduce((a, d) => countOn(d, role) > countOn(a, role) ? d : a, cd[0]);
    const bad = cd.some(d => conflictState(d, role) === 'bad');
    const tip = (bad ? 'Conflict' : 'Over the daily max (all approved)') + ': ' + countOn(worst, role) + ' of ' + q + ' ' + ROLE_PLURAL[role] + ' on leave on ' +
      cd.map(D.short).join(', ') + '. Click to resolve.';
    return '<button type="button" class="cfl ' + (bad ? 'cfl-bad' : 'cfl-ok') + (compact ? ' cfl-sm' : '') + '" data-act="openConflict" data-date="' + worst + '" data-role="' + role + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' +
      icon('alert', compact ? 13 : 14) + (compact ? '' : '<span>' + (bad ? 'Conflict' : 'Over max') + '</span>') + '</button>';
  }
  function conflictState(d, only) {
    const cs = dayConflicts(d, only);
    if (!cs.length) return null;
    return cs.every(c => c.list.every(r => r.status === 'Approved')) ? 'ok' : 'bad';
  }
  function openConflict(d, only) {
    S.cfRole = only || null;
    const cs = dayConflicts(d, only);
    if (!cs.length) { closeModal(); toast('No conflict on ' + D.short(d) + ' anymore'); return; }
    const st = conflictState(d, only), pending = cs.some(c => c.list.some(r => r.status === 'Pending'));
    const row = r => {
      const u = userOf(r.userId);
      let acts = '';
      // Every row: Approve / Deny / Edit / Delete for admins; Edit / Delete on your own rows for members.
      // Each action returns to this screen (Edit after saving), so a conflict can be worked through in one place.
      const b = (cls, act, ic, label, extra) => '<button class="btn sm act' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" data-id="' + esc(r.id) + '" data-date="' + d + '"' + (extra || '') +
        ' aria-label="' + esc(label + ' — ' + fullName(u)) + '" title="' + esc(label) + '">' + icon(ic, 14) + '<span class="bl">' + label + '</span></button>';
      if (S.isAdmin) {
        acts = '<span class="cf-acts">' +
          b('del', 'cfDelete', 'trash', 'Delete') +
          b('bad', 'cfSet', 'ban', 'Deny', ' data-v="Denied"' + (r.status === 'Denied' ? ' disabled' : '')) +
          b('ok', 'cfSet', 'check', 'Approve', ' data-v="Approved"' + (r.status === 'Approved' ? ' disabled' : '')) +
          b('', 'cfEdit', 'pencil', 'Edit') + '</span>';
      } else if (r.userId === S.me) {
        acts = '<span class="cf-acts">' + (canDelete(r) ? b('del', 'cfDelete', 'trash', 'Delete') : '') + (canEdit(r) ? b('', 'cfEdit', 'pencil', 'Edit') : '') + '</span>';
      }
      return '<li class="cf-row"><span class="dl-who">' + personBadge(r, true) + '</span>' +
        '<span class="dl-meta">' + r.type + ' · ' + D.short(r.start) + ' → ' + D.short(r.end) + ' · ' + plural(D.days(r.start, r.end), 'day') + '</span>' +
        '<span class="badge s-' + r.status.toLowerCase() + '">' + r.status + '</span>' + acts + '</li>';
    };
    const html = modalHead('Conflict · ' + esc(D.f(d, { weekday: 'long', month: 'long', day: 'numeric' })), 'alert') + '<div class="modal-b">' +
      '<div class="cf-state cf-' + st + '">' + icon(st === 'ok' ? 'check' : 'alert', 18) +
        (st === 'ok' ? 'All requests in this conflict are approved — the day marker is green.' : 'Over the daily max — approve, deny, edit or delete requests below, or approve them all.') + '</div>' +
      cs.map(c => '<div class="dl-sec"><div class="dl-h"><span>' + ({ Pilot: 'Pilots', Boom: 'Booms', Other: 'Other' })[c.role] + ' out: ' + c.list.length + ' · max ' + c.q + '</span></div>' +
        '<ul class="dl-list cf-list">' + c.list.map(row).join('') + '</ul></div>').join('') +
      (S.isAdmin ? '' : '<p class="meta" style="white-space:normal">Move or delete your request to clear the conflict, or leave it for an admin to decide.</p>') +
      '</div><div class="modal-f">' +
      '<button class="btn" data-act="gotoDay" data-date="' + d + '">' + icon('calendar', 15) + ' Day view</button>' +
      '<button class="btn" data-act="closeModal">Close</button>' +
      (S.isAdmin && pending ? '<button class="btn ok" data-act="cfApproveAll" data-date="' + d + '"' + (only ? ' data-role="' + only + '"' : '') + '>' + icon('check', 15) + ' Approve all</button>' : '') + '</div>';
    openModal('conflict', html, true);
  }

  /** In progress today (not denied): the member is out right now. */
  const isNow = r => r.status !== 'Denied' && r.start <= S.today && r.end >= S.today;
  function describe(r) {
    const u = userOf(r.userId);
    return fullName(u) + ', ' + ({ Pilot: 'Pilot', Boom: 'Boom Operator', Other: 'Other' })[u.role] + ', ' + r.type + ', ' + r.status + ', ' + D.short(r.start) + ' to ' + D.short(r.end) +
      (dupsOf(r).length ? ', overlap' : '');
  }
  const dupsOf = r => (IDX.dups && IDX.dups.get(r.id)) || [];
  const dupText = r => dupsOf(r).map(o => o.type.toLowerCase() + ' ' + D.short(o.start) + ' → ' + D.short(o.end) + ' (' + o.status.toLowerCase() + ')').join('; ');
  /* Admin changed this member's dates/type: a warning until the member acknowledges it. */
  const isChanged = r => r.adminChanged === 'true';
  function changeText(r) {
    const by = r.changedBy ? userOf(r.changedBy) : null;
    return 'Your request was changed by ' + (by ? fullName(by) : 'an admin') + (r.changedAt ? ' on ' + fmtTs(r.changedAt) : '') +
      ': was ' + (r.origType || r.type) + ' ' + D.short(r.origStart || r.start) + ' → ' + D.short(r.origEnd || r.end) +
      ', now ' + r.type + ' ' + D.short(r.start) + ' → ' + D.short(r.end) + '.';
  }
  const changedBadge = r => isChanged(r) ? '<span class="badge chg" title="' + esc(changeText(r)) + '">' + icon('alert', 12) + 'Dates changed by admin</span>' : '';
  const dupBadge = r => dupsOf(r).length ? '<span class="badge dup" title="Overlaps ' + esc(dupText(r)) + '">' + icon('alert', 12) + 'Overlap</span>' : '';
  /* Combined ID badge: [P|MKE] — position square on the left, unit section on the right, one button-like chip.
     Decorative: the parent's aria-label / title spells out position and unit. */
  function idBadge(u) {
    const L = (u.role || 'Other')[0];
    const un = unitsList().find(x => x.code === u.unit);
    return '<span class="idb" aria-hidden="true"><span class="idb-r idb-' + L.toLowerCase() + '">' + L + '</span>' +
      '<span class="idb-u ub-' + (un ? un.style : 'slate') + '">' + esc(u.unit) + '</span></span>';
  }
  /* Full person badge on calendar bars: [P|MKE|Lastname] as one chip. Approved = green border. */
  function personBadge(r, withStatus) {
    const u = userOf(r.userId), L = (u.role || 'Other')[0];
    const un = unitsList().find(x => x.code === u.unit);
    return '<span class="idb pb st-' + r.status.toLowerCase() + '" aria-hidden="true"><span class="idb-r idb-' + L.toLowerCase() + '">' + L + '</span>' +
      '<span class="idb-u ub-' + (un ? un.style : 'slate') + '">' + esc(u.unit) + '</span>' +
      '<span class="idb-n">' + barMarks(r) + '<span class="idb-t">' + esc(calName(u)) + '</span>' + (withStatus ? statusIcon(r.status) + (isChanged(r) ? '<span class="sti sti-chg" title="Dates changed by admin">' + icon('alert', 14) + '</span>' : '') : '') + '</span></span>';
  }
  /** Status mark shown after the name on the first day: ✓ approved, clock pending, ✕ denied. */
  function statusIcon(st) {
    const m = { Approved: ['check', 'ok'], Pending: ['clock', 'pend'], Denied: ['x', 'no'] }[st];
    return m ? '<span class="sti sti-' + m[1] + '" title="' + st + '">' + icon(m[0], 14) + '</span>' : '';
  }
  /* Middle days: one badge per position — [P|Doe · Roe · Poe], or [P|4+ Pilots] when more than 3. */
  function rolePuck(role, list) {
    list = list.slice().sort(byLast);
    const L = role[0];
    const title = ({ Pilot: 'Pilots', Boom: 'Booms', Other: 'Other' })[role] + ': ' + list.map(r => fullName(userOf(r.userId)) + ' (' + r.status + ')').join('; ');
    const names = list.length > 3

  /** Re-layout once the real row height is known (and on resize). */

  /*
   * 4-month overview: a 2×2 quadrant of mini months. Each day shows how many people
   * have Leave and Pass requested (blue / gold counts), or reads as open. Days over a
   * role quota get a red corner flag. Honours the status and role filters; denied
   * requests only count when the Denied filter is on.
   */
  /* Qtr view: each day shows the P / B / O meters for the current filters (like the phone month).
     With one person picked, it shows that person's Leave / Pass bars across their dates instead. */
  function renderQuad() {
    const ms = D.monthStart(S.cursor);
    const reqs = calRequests();
    const live = reqs.filter(countable);
    const roles = ROLES.filter(r => S.f.role.includes(r));
    const person = S.f.person;
    const months = [0, 1, 2, 3].map(i => D.addMonths(ms, i));
    // Availability tint for one position: mine if it is selected, else the first selected one.
    // Full (red) = approved fill every slot; Overbooked (orange) = requests (approved + pending) fill or exceed the slots
    // but approvals don't; Open (green) = requests still leave a slot free. Counts ignore the status/type filters (they are facts about the day).
    const myRole = (IDX.users.get(S.me) || {}).role;
    const aRole = roles.includes(myRole) ? myRole : roles[0];
    const aq = aRole ? quota(aRole) : 0;
    const appr = new Map();
    if (aq) IDX.live.forEach(r => {
      if (r.status !== 'Approved' || r.type !== 'Leave' || userOf(r.userId).role !== aRole) return;
      for (let d = r.start; d <= r.end; d = D.add(d, 1)) appr.set(d, (appr.get(d) || 0) + 1);
    });
    const avail = d => {
      if (!aq) return '';
      const a = appr.get(d) || 0, all = countOn(d, aRole);
      return a >= aq ? 'av-full' : all >= aq ? 'av-over' : 'av-open';
    };
    const ROLE_PL = { Pilot: 'Pilot', Boom: 'Boom', Other: 'Other' };
    const key = aq ? '<div class="qkey"><span class="qk-t">' + ROLE_PL[aRole] + ' slots</span>' +
      '<span class="qk av-open"><i></i>Open</span><span class="qk av-over"><i></i>Overbooked</span><span class="qk av-full"><i></i>Full</span></div>' : '';
    const bar = (r, d) => {
      const first = d === r.start, last = d === r.end, lbl = first || D.dow(d) === 0 || d.slice(8) === '01';
      const cls = ['qbar', r.type === 'Leave' ? 'leave' : 'pass', 'st-' + r.status.toLowerCase(), first ? 'b-s' : '', last ? 'b-e' : ''].join(' ');
      return '<span class="' + cls + '" role="button" tabindex="0" data-act="openReq" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' + (lbl ? '<span>' + r.type + '</span>' : '') + '</span>';
    };
    return key + '<div class="quad' + (person ? ' q-person' : '') + '">' + months.map(m0 => {
      const gs = D.weekStart(m0), mon = m0.slice(0, 7);
      let cells = '';
      for (let i = 0; i < 42; i++) {
        const d = D.add(gs, i);

        if (d.slice(0, 7) !== mon) { cells += '<div class="qd blank" aria-hidden="true"></div>'; continue; }
        const dayLabel = D.f(d, { weekday: 'long', month: 'long', day: 'numeric' });
        let body, label;
        if (person) {
          const mine = reqs.filter(r => r.start <= d && r.end >= d).sort((x, y) => (x.type === 'Leave' ? 0 : 1) - (y.type === 'Leave' ? 0 : 1));
          body = mine.map(r => bar(r, d)).join('');
          label = dayLabel + ': ' + (mine.length ? mine.map(r => r.type + ' (' + r.status + ')').join(', ') : 'not out');
        } else {
          const c = filteredRoleCounts(d);
          body = roles.map(role => roleMeter(role, c[role])).join('');
          label = dayLabel + ': ' + roles.map(role => c[role] + ' ' + ROLE_PLURAL[role] + ' on leave' + (quota(role) ? ' of ' + quota(role) : '')).join(', ');
        }

        if (av) label += '. ' + ROLE_PL[aRole] + ' slots ' + ({ 'av-open': 'open', 'av-over': 'overbooked', 'av-full': 'full' })[av];
        cells += '<div class="qd ' + av + (d === S.today ? ' today' : '') + (D.dow(d) === 0 || D.dow(d) === 6 ? ' wknd' : '') + '"' +
          ' data-act="pickDay" data-date="' + d + '" title="' + esc(label) + '">' +

          '<div class="qm">' + body + '</div></div>';

        '<div class="qwrow">' + DOW.map(x => '<div class="qw">' + x[0] + '<span class="wide">' + x.slice(1, 3).toLowerCase() + '</span></div>').join('') + '</div>' +

          return '<div class="' + cls + '" style="grid-column:' + a + '/' + z + '" role="button" tabindex="0" data-act="openReq" data-id="' + esc(r.id) + '" title="' + esc(describe(r)) + '" aria-label="' + esc(describe(r)) + '">' +
            '<span class="n">' + personBadge(r) + '</span><span class="s">' + r.type + ' · ' + r.status + ' · ' + D.short(r.start) + '–' + D.short(r.end) + '</span></div>';

        return '<div class="band band-' + b[0][0].toLowerCase() + '"><div class="band-title"><span class="band-tag">' + b[0][0] + '</span>' + b[1] + ' <span class="ct">' + evs.length + '</span></div>' +
          '<div class="band-body"><div class="band-inner"><div class="band-slots g7">' + slots + '</div><div class="band-pucks">' + pucks + '</div></div></div></div>';
      }).join('');
    return '<div class="week"><div class="wk-head g7">' + head + '</div><div class="bands">' + bands + '</div></div>';

  /** Desktop (≥900px): tapping a day opens it in a panel on the left, beside the calendar, instead of switching views. */

  function renderDay(day, panel) {

        meters + '</div></div>' +

      '</div><div class="day-groups">' + (reqs.length ? dayGroupsHtml(reqs) : '<div class="empty">No one is scheduled out on this day.</div>') +

  }

  /* Two-click range selection */

  /* ================================================================ */
  /* Request pucks & lists                                              */
  /* ================================================================ */
  // Members edit their own requests until approved; after that only admins can.
  const isTmp = r => String(r.id).indexOf('tmp_') === 0; // shown before the server has saved it
  const canEdit = r => !isTmp(r) && r.status !== 'Cancelled' && (S.isAdmin || (r.userId === S.me && r.status !== 'Approved'));

  function filteredList() {
    const L = S.list, F = S.f, q = L.q.trim().toLowerCase();
    return IDX.live.filter(r => {
      const u = userOf(r.userId);
      if (!F.status.includes(r.status) || !F.role.includes(u.role) || !F.type.includes(r.type)) return false;
      if (!personConfOk(r, F)) return false;
      if (q && (u.rank + ' ' + u.name + ' ' + u.unit + ' ' + u.role + ' ' + r.type + ' ' + r.note).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  /* ---------- Requests table ---------- */
  const firstName = u => u.name.trim().split(/\s+/).slice(0, -1).join(' ');
  /** "Last, First · Rank" with the comma and rank left out when a member has no first name or rank on file. */
  const nameText = (u, noRank) => lastName(u) + (firstName(u) ? ', ' + firstName(u) : '') + (u.rank && !noRank ? ' · ' + u.rank : '');
  const nameHtml = (u, noRank) => '<b>' + esc(lastName(u)) + (firstName(u) ? ',</b> ' + esc(firstName(u)) : '</b>') + (u.rank && !noRank ? ' <span class="muted">· ' + esc(u.rank) + '</span>' : '');
  const ROLE_NAME = { Pilot: 'Pilot', Boom: 'Boom Operator', Other: 'Other' };
  const milDate = d => Number(d.slice(8)) + ' ' + D.f(d, { month: 'short' }) + ' ' + d.slice(0, 4);
  const COLS = [
    ['st', ''], ['unit', 'Unit'], ['last', 'Last Name'], ['first', 'First Name'], ['rank', 'Rank'], ['role', 'Position'],
    ['start', 'Start'], ['end', 'End'], ['days', 'Days'], ['note', 'Notes'], ['status', 'Status']
  ];
  const SORT_KEYS = {
    type: r => r.type, unit: r => userOf(r.userId).unit, last: r => lastName(userOf(r.userId)).toLowerCase(),
    first: r => firstName(userOf(r.userId)).toLowerCase(), rank: r => { const i = RANKS.indexOf(userOf(r.userId).rank); return i < 0 ? 99 : i; },
    role: r => ROLES.indexOf(userOf(r.userId).role), start: r => r.start, end: r => r.end, days: r => D.days(r.start, r.end),
    note: r => (r.note || '').toLowerCase(), status: r => ['Pending', 'Approved', 'Denied'].indexOf(r.status), submitted: r => r.submittedAt
  };
  /** Compare by each level of the sort stack in turn. */
  function multiCompare(a, b, sorts, keyOf) {
    for (const so of sorts) {
      const f = keyOf(so.k);
      if (!f) continue;
      const x = f(a), y = f(b);
      const c = x < y ? -1 : x > y ? 1 : 0;
      if (c) return so.dir === 'asc' ? c : -c;
    }
    return 0;
  }
  /** Clicking a column makes it the main sort and keeps earlier sorts as tie-breakers; clicking the main one reverses it. */
  function pushSort(st, k, defDir) {
    // The first column click replaces the built-in default order instead of stacking on it.
    if (!st.userSorted) { st.userSorted = true; if (st.sorts.length === 1 && st.sorts[0].k !== k) st.sorts = []; }
    const i = st.sorts.findIndex(x => x.k === k);
    if (i === 0) st.sorts[0].dir = st.sorts[0].dir === 'asc' ? 'desc' : 'asc';
    else {
      if (i > 0) st.sorts.splice(i, 1);
      st.sorts.unshift({ k, dir: defDir });
      st.sorts = st.sorts.slice(0, 3);
    }
  }
  /** Header cell with sort arrow and, when sorting by more than one column, its level (1, 2, 3). */
  function sortTh(st, k, label, act, attrs, numeric) {
    const i = st.sorts.findIndex(x => x.k === k), so = st.sorts[i];
    const lvl = i >= 0 && st.sorts.length > 1 ? '<span class="lvl">' + (i + 1) + '</span>' : '';
    // The Last Name column stays pinned to the left edge when a table scrolls sideways.
    return '<th scope="col"' + (numeric ? ' class="num"' : k === 'last' ? ' class="stk"' : '') + ' aria-sort="' + (i === 0 ? (so.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' +
      '<button class="th-sort' + (i === 0 ? ' on' : i > 0 ? ' sub' : '') + '" data-act="' + act + '"' + attrs + ' data-v="' + k + '"' +
      (i > 0 ? ' title="Sort level ' + (i + 1) + '"' : '') + '>' + label +
      '<span class="arr" aria-hidden="true">' + (so ? (so.dir === 'asc' ? '▲' : '▼') : '') + '</span>' + lvl + '</button></th>';
  }
  function sortNote(st, table) {
    return st.sorts.length > 1 ? ' · sorted by ' + st.sorts.length + ' columns <button class="linkbtn" data-act="resetSort" data-table="' + table + '">Clear extra sorts</button>' : '';
  }
  function sortRows(rows, st) {
    return rows.slice().sort((a, b) => multiCompare(a, b, st.sorts, k => SORT_KEYS[k]) || (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
  }
  const canDelete = r => !String(r.id).startsWith('tmp_') && r.status !== 'Cancelled' && (S.isAdmin || (r.userId === S.me && (r.status !== 'Approved' || r.end >= S.today)));
  /** Full-width requests table. table = 'list' | 'mine' (sortable state key) or '' for a fixed order. */
  function reqTable(rows, table) {
    const st = table === 'mine' ? S.mine : S.list;
    const head = COLS.map(c => c[0] === 'st' ? '<th scope="col" class="st-ic-h"><span class="sr">Status</span></th>'
      : table ? sortTh(st, c[0], c[1], 'sortBy', ' data-table="' + table + '"') : '<th scope="col"' + (c[0] === 'last' ? ' class="stk"' : '') + '>' + c[1] + '</th>').join('') +
      '<th scope="col" class="th-acts">Actions</th>';
    const stIcon = r => { const m = { Approved: ['check', 'ok'], Pending: ['clock', 'pend'], Denied: ['ban', 'no'] }[r.status] || ['clock', 'pend'];
      return '<span class="st-ic st-ic-' + m[1] + '" title="' + r.status + '" aria-label="' + r.status + '">' + icon(m[0], 18) + '</span>'; };
    // Compact marks next to the name (instead of wide badges): Overlap (orange), changed by admin (pencil).
    const marks = r => (dupsOf(r).length ? '<span class="cfl cfl-sm cfl-warn" title="' + esc('Overlap: ' + dupText(r)) + '" aria-label="Overlap">' + icon('alert', 13) + '</span>' : '') +
      (isChanged(r) ? '<span class="cfl cfl-sm cfl-chg" title="Dates changed by admin" aria-label="Dates changed by admin">' + icon('pencil', 13) + '</span>' : '');
    const rowHtml = (r, showType) => {
      const u = userOf(r.userId), n = D.days(r.start, r.end), cd = conflictDays(r), st2 = r.status.toLowerCase();
      let acts = '';
      if (S.isAdmin) {
        acts += '<button class="btn ok sm act" data-act="setStatus" data-v="Approved" data-id="' + esc(r.id) + '"' + (r.status === 'Approved' ? ' disabled' : '') + ' aria-label="Approve ' + esc(u.name) + '" title="Approve">' + icon('check', 14) + '<span class="bl">Approve</span></button>' +
          '<button class="btn bad sm act" data-act="setStatus" data-v="Denied" data-id="' + esc(r.id) + '"' + (r.status === 'Denied' ? ' disabled' : '') + ' aria-label="Deny ' + esc(u.name) + '" title="Deny">' + icon('ban', 14) + '<span class="bl">Deny</span></button>';
      }
      if (canEdit(r)) acts += '<button class="btn sm act" data-act="editReq" data-id="' + esc(r.id) + '" aria-label="Edit request for ' + esc(u.name) + '" title="Edit">' + icon('pencil', 13) + '<span class="bl">Edit</span></button>';
      if (canDelete(r)) acts += '<button class="btn sm del act" data-act="cancelReq" data-id="' + esc(r.id) + '" aria-label="Delete request for ' + esc(u.name) + '" title="Delete">' + icon('trash', 13) + '<span class="bl">Delete</span></button>';
      return '<tr class="t-' + r.type.toLowerCase() + ' st-' + st2 + (r.userId === S.me ? ' mine' : '') + (isNow(r) ? ' now' : '') + '" data-act="openReq" data-id="' + esc(r.id) + '" tabindex="0" aria-label="' + esc(describe(r)) + '">' +
        '<td class="st-ic-c">' + stIcon(r) + '</td>' +
        '<td>' + unitBadge(u.unit) + '</td>' +
        '<td class="strong stk"><div class="stk-in">' + (showType ? '<span class="badge t-' + r.type.toLowerCase() + ' t-sm">' + r.type + '</span>' : '') +
          '<span class="stk-n">' + esc(lastName(u)) + '</span>' + (isNow(r) ? '<span class="now-tag" title="Active now"><i class="now-dot" aria-hidden="true"></i>Active</span>' : '') + conflictBadge(r, true) + marks(r) + '</div></td>' +
        '<td>' + esc(firstName(u)) + '</td>' +
        '<td>' + esc(u.rank) + '</td>' +
        '<td>' + esc(ROLE_NAME[u.role] || u.role) + '</td>' +
        '<td class="num">' + milDate(r.start) + '</td>' +
        '<td class="num">' + milDate(r.end) + '</td>' +
        '<td class="num"><span class="days">' + n + '</span>' +
          (isCaution(r) ? '<span class="flag caution" title="' + esc(cautionText(r)) + '">' + icon('alert', 13) + '<span class="sr">Caution: ' + esc(cautionText(r)) + '</span></span>' : '') +
          '</td>' +
        '<td class="note" title="' + esc(r.note || '') + '"><div class="clamp">' + (r.note ? esc(r.note) : '<span class="muted">—</span>') + '</div></td>' +
        '<td><div class="st-cell"><span class="badge s-' + st2 + '">' + r.status + '</span>' + conflictBadge(r) + '</div></td>' +
        '<td class="acts-cell"><div class="row-acts">' + (acts || '<span class="muted">—</span>') + '</div></td></tr>';
    };
    // Grouped like the Week view bands: Leave on top, Pass below, each with a header bar.
    // Headers stick under the column titles and collapse / expand their band (remembered per table this session).
    // The whole header row is the tap target; the button inside keeps keyboard access and aria-expanded.
    const key = table || 'queue', col = (S.grpCol = S.grpCol || {})[key] || {};
    // Current (ending today or later) leave and passes in their own bands; finished ones go to a Past band, collapsed by default.
    const group = (type, list) => {
      const closed = type === 'Past' ? col.Past !== false : !!col[type], n = COLS.length + 1;
      const label = type === 'Past' ? '<span class="badge t-past">Past</span>' : type === 'Now' ? '<span class="badge t-now"><i class="now-dot" aria-hidden="true"></i>Active Leave / Pass</span>' : '<span class="badge t-' + type.toLowerCase() + '">' + type + '</span>';
      return '<tbody class="grp grp-' + type.toLowerCase() + (closed ? ' closed' : '') + '"><tr class="grp-h" data-act="grpToggle" data-table="' + key + '" data-v="' + type + '"><th colspan="' + n + '" scope="rowgroup">' +
        '<button type="button" class="grp-in" data-act="grpToggle" data-table="' + key + '" data-v="' + type + '" aria-expanded="' + !closed + '">' +
        icon(closed ? 'right' : 'down', 16) + label + '<span class="ct">' + list.length + '</span></button></th></tr>' +
        (closed ? '' : list.length ? list.map(r => rowHtml(r, type === 'Past' || type === 'Now')).join('')
          : '<tr class="grp-empty"><td colspan="' + n + '"><span class="grp-empty-in">' + ({ Leave: 'No upcoming leave to show.', Pass: 'No upcoming passes to show.', Past: 'Nothing past to show.', Now: 'No active leave or passes today.' })[type] + '</span></td></tr>') + '</tbody>';
    };
    const cur = rows.filter(r => r.end >= S.today), past = rows.filter(r => r.end < S.today);
    // Active Leave / Pass (in progress today: leave first, then passes), then upcoming Leave and Pass.
    const now = cur.filter(r => isNow(r) && r.type === 'Leave').concat(cur.filter(r => isNow(r) && r.type === 'Pass')), next = cur.filter(r => !isNow(r));
    const body = group('Now', now) + group('Leave', next.filter(r => r.type === 'Leave')) + group('Pass', next.filter(r => r.type === 'Pass')) + group('Past', past);
    return '<div class="tbl-wrap" id="tbl-' + key + '" data-table="' + key + '"><table class="rtable"><thead><tr>' + head + '</tr></thead>' + body + '</table></div>';
  }

    return '<div class="tbl-count">' + plural(arr.length, 'request') + (nc ? ' · <span class="cfl-count">' + icon('alert', 13) + plural(nc, 'request') + ' in conflict</span>' : '') + sortNote(S.list, 'list') + '</div>' + reqTable(arr, 'list');

  /* ================================================================ */

  /* Stats (admin): per-person request metrics                          */
  /* ================================================================ */
  /** Fiscal year (1 Oct – 30 Sep) containing day d: [start, end, 'FY27']. */
  function fyOf(d) {
    const y = Number(d.slice(0, 4)), fy = Number(d.slice(5, 7)) >= 10 ? y + 1 : y;
    return [(fy - 1) + '-10-01', fy + '-09-30', 'FY' + String(fy).slice(2)];
  }
  /**
   * Leave-days counter shown under every request calendar (request form and request details).
   * Counts the member's Leave days in the fiscal year of the selection: approved + pending (other requests),
   * plus the days of the current selection when it is Leave. excludeId = the request being edited / viewed,
   * so it is counted once, as the selection.
   */
  function leaveTally(userId, type, start, end, excludeId) {
    if (!userId) return '';
    const anchor = D.valid(start) ? start : S.today, [fs, fe, label] = fyOf(anchor);
    const inFy = (a, b) => { const x = D.max(a, fs), y = D.min(b, fe); return x <= y ? D.days(x, y) : 0; };
    let appr = 0, pend = 0;
    IDX.live.forEach(r => {
      if (r.userId !== userId || r.type !== 'Leave' || r.id === excludeId) return;
      if (r.status === 'Approved') appr += inFy(r.start, r.end);
      else if (r.status === 'Pending') pend += inFy(r.start, r.end);
    });
    const hasSel = D.valid(start) && D.valid(end) && end >= start;
    const sel = hasSel && type === 'Leave' ? inFy(start, end) : 0;
    const who = userId === S.me ? 'Your' : esc(lastName(userOf(userId))) + '’s';
    return '<div class="lv-tally" aria-live="polite"><div class="lt-h">' + who + ' leave days · ' + label + '</div>' +
      '<span class="lt-n"><b>' + appr + '</b> approved</span><span class="lt-n"><b>' + pend + '</b> pending</span>' +
      (type === 'Leave'
        ? '<span class="lt-n lt-sel"><b>+' + sel + '</b> ' + (hasSel ? 'this request' : 'pick dates') + '</span>'
        : '<span class="lt-n lt-sel">Passes don’t use leave days</span>') +
      '<span class="lt-total">' + plural(appr + pend + sel, 'day') + '</span></div>';
  }
  function periodRange(p) {
    const y = Number(S.today.slice(0, 4)), m = Number(S.today.slice(5, 7));
    if (p === 'fy') { const fy = m >= 10 ? y + 1 : y; return [(fy - 1) + '-10-01', fy + '-09-30', 'FY' + String(fy).slice(2) + ' (1 Oct ' + (fy - 1) + ' – 30 Sep ' + fy + ')']; }
    if (p === 'cy') return [y + '-01-01', y + '-12-31', 'Calendar year ' + y];
    if (p === '12m') return [D.add(S.today, -365), '9999-12-31', 'Past 12 months + upcoming'];
    return ['0000-01-01', '9999-12-31', 'All time'];
  }
  const PEOPLE_COLS = [
    ['unit', 'Unit'], ['last', 'Last Name'], ['first', 'First Name'], ['rank', 'Rank'], ['role', 'Position'],
    ['count', 'Requests', 1], ['req', 'Days Requested', 1], ['appr', 'Days Approved', 1], ['den', 'Days Denied', 1], ['pend', 'Days Pending', 1],
    ['leave', 'Leave Approved', 1], ['pass', 'Pass Approved', 1]
  ];
  function peopleStats() {
    const P = S.people, rng = periodRange(P.period), q = P.q.trim().toLowerCase();
    const rows = S.users.filter(u => (P.inactive || u.active) && (!q || (u.rank + ' ' + u.name + ' ' + u.unit + ' ' + u.role).toLowerCase().indexOf(q) >= 0)).map(u => {
      const m = { u, count: 0, req: 0, appr: 0, den: 0, pend: 0, leave: 0, pass: 0 };
      S.requests.forEach(r => {
        if (r.userId !== u.id || r.status === 'Cancelled' || r.start < rng[0] || r.start > rng[1]) return;
        const n = D.days(r.start, r.end);
        m.count++; m.req += n;
        if (r.status === 'Approved') { m.appr += n; if (r.type === 'Leave') m.leave += n; else m.pass += n; }
        else if (r.status === 'Denied') m.den += n;
        else m.pend += n;
      });
      return m;
    });
    const KEYS = {
      unit: m => m.u.unit, last: m => lastName(m.u).toLowerCase(), first: m => firstName(m.u).toLowerCase(),
      rank: m => { const i = RANKS.indexOf(m.u.rank); return i < 0 ? 99 : i; }, role: m => ROLES.indexOf(m.u.role)
    };
    rows.sort((a, b) => multiCompare(a, b, P.sorts, k => KEYS[k] || (m => m[k])) || lastName(a.u).localeCompare(lastName(b.u)));
    return { rows, label: rng[2] };
  }
  function renderPeopleBody() {
    const P = S.people, st = peopleStats(), rows = st.rows;
    const tot = rows.reduce((t, m) => { ['count', 'req', 'appr', 'den', 'pend', 'leave', 'pass'].forEach(k => { t[k] += m[k]; }); return t; }, { count: 0, req: 0, appr: 0, den: 0, pend: 0, leave: 0, pass: 0 });
    const head = PEOPLE_COLS.map(c => sortTh(P, c[0], c[1], 'peopleSort', '', !!c[2])).join('');
    const cell = (v, cls) => '<td class="num' + (cls ? ' ' + cls : '') + '">' + (v ? v : '<span class="muted">0</span>') + '</td>';
    const body = rows.length ? rows.map(m => '<tr data-act="personYear" data-id="' + esc(m.u.id) + '" tabindex="0" class="' + (m.u.active ? '' : 'st-denied') + '" aria-label="' + esc(fullName(m.u) + ': ' + m.count + ' requests, ' + m.req + ' days requested, ' + m.appr + ' approved, ' + m.den + ' denied') + '">' +
        '<td>' + unitBadge(m.u.unit) + '</td><td class="strong stk">' + esc(lastName(m.u)) + '</td><td>' + esc(firstName(m.u)) + '</td><td>' + esc(m.u.rank) + '</td>' +
        '<td>' + esc(ROLE_NAME[m.u.role] || m.u.role) + (m.u.active ? '' : ' <span class="badge">Inactive</span>') + '</td>' +
        cell(m.count) + cell(m.req, 'strong') + cell(m.appr, 'ok-t') + cell(m.den, 'bad-t') + cell(m.pend, 'pend-t') + cell(m.leave) + cell(m.pass) + '</tr>').join('')
      : '<tr class="empty-row"><td colspan="' + PEOPLE_COLS.length + '">No members match.</td></tr>';
    const foot = '<tfoot><tr><td colspan="5" class="strong">Squadron total · ' + plural(rows.length, 'member') + '</td>' +
      ['count', 'req', 'appr', 'den', 'pend', 'leave', 'pass'].map(k => '<td class="num strong">' + tot[k] + '</td>').join('') + '</tr></tfoot>';
    // Only the multi-sort note remains above the table (no period explanation).
    const note = sortNote(P, 'people').replace(/^ · /, '');
    return (note ? '<div class="tbl-count">' + note + '</div>' : '') +
      '<div class="tbl-wrap" id="tbl-people"><table class="rtable ptable"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>' + foot + '</table></div>';
  }

  /* Roster page (admin): add members, edit, reset PINs, deactivate / reactivate. Opened from Admin → Squadron roster. */
  function renderRoster() {
    // Open on "Inactive" when sign-ups are waiting, so they're easy to approve.
    const show = S.rosterShow || (S.users.some(u => u.pending) ? 'inactive' : 'active');
    const q = (S.adq || '').trim().toLowerCase();
